# hello: the minimal example sport (docs/framework_zh.md §4.2, §8). The sport's declarations as data: the core,
# the generator (tools/generate.py), the checks (tools/check) and the prompt/README all read this file.

[sport]
name = "hello"
title = "Hello target throw"
summary = "throw balls at a target painted on the ground; points by the ring each ball rests in"
protocol = "turn"                     # realtime | turn
revision = "hello-3"                  # bump on any change that alters play (hello-3: the two modes, the low-level toolkit)
physics = "mujoco"                    # the physics engine (fixed by the sport)
image = "ghcr.io/mll-lab-nu/eai-olympiad:0.1.0"
status = "sport"                      # the only status (the stage-0 "wrapper" status was retired on 2026-10-10)
publish = false                       # the example is not part of the benchmark: its tasks go to build/tasks/
category = "example"

[rulebook]
name = "hello rules (written for this example; no official rulebook)"
version = "1"
url = "sports/hello/README.md"

[[deviations]]
id = "D1"
rule = "-"
text = "the example has no official rulebook; every rule is listed in [spec] and in the prompt"
affects_result = false

[formats.single]
seats = ["A"]
opponent = false                      # solo: no opponent; success = the score reaches the line
success = { score_at_least = 30 }
[formats.duel]
seats = ["A", "B"]
first = ["A", "B"]                    # the runner plays both first orders

[modes]                               # the two modes (docs/framework_zh.md §6.3; skilleval/README.md; CONTRIBUTING.md)
action_levels = ["high", "low"]       # low is required; high = the sport's high-level plugin (AimLayer)
plays = ["program"]
b9_test = "test_b9_feasible_under_the_launcher_ranges"   # robot and mode rule 2 (tests/test_hello.py)

[modes.high]                          # Agent as Athlete: the platform provides the skill API
skills = ["aim"]                      # the high level's act {type: aim, x, y}
contract = "skill_api.py"             # CONTRACTS: request ranges, measurement, tolerance, success (skilleval/contract.py)
implementation = "plugin.py:AimLayer" # our implementation: the reference row of the low level's API test

[modes.low]                           # Agent as Robotics Engineer: the player implements the same skill API
implements = ["aim"]
machine = "ball launcher: one throw = yaw, pitch, speed set-points (ranges = the throw schema), no joints"
toolkit = "seat/toolkit.toml"         # the manifest (skilleval/toolkit.py: sha256-checked)
toolkit_path = "/opt/ro/toolkit.toml" # where the seat has it
tools = ["throw_interface", "flight_model"]
forbidden = ["aim"]                   # the core skill: never given at the low level
evaluator = "lowlevel/evaluator.py"   # hooks of skilleval/evaluate.py (API test, competition test)
reference = "lowlevel/reference"      # our aim from the toolkit only (rule 4)
boundary = "lowlevel/boundary"        # the toolkit used without developing the skill (rule 5)
reference_results = "lowlevel/reference_results.json"   # platform / reference / boundary rows (tools/skill_eval.py)
thresholds = { reference_min = 0.9, boundary_max = 0.05 }   # API-test success rates
[modes.low.deliverable]               # robot and mode rule 10
path = "/app/output/skill/aim.py"
signature = "aim(x, y, *, state, spec) -> {'type': 'throw', 'yaw': deg, 'pitch': deg, 'speed': m/s}"
optional = []
allowed = "the Python standard library, numpy, the toolkit under /opt/ro (lib/flight.py) and files inside /app/output/skill; module-level memory between calls of one run; no network, no other files, no other processes"
memory = "per_run"                    # one process for all requests of a run (per_case: a fresh process per request)
time_limits_s = { load = 30, aim = 2 }
[modes.low.cases]                     # skilleval/cases.py; rebuilt by `python3 lowlevel/evaluator.py make-cases`
hidden = "lowlevel/cases/hidden.jsonl"     # simulator side only: never in the seat, not in generated tasks
public = "lowlevel/cases/public.jsonl"     # the practice subset (request + our implementation's error)
practice_path = "/opt/ro/practice.jsonl"

[seat.low]                            # the low level's toolkit in the player's image (= the manifest's tools)
files = { "/opt/ro/toolkit.toml" = "seat/toolkit.toml", "/opt/ro/lib/flight.py" = "seat/lib/flight.py", "/opt/ro/practice.jsonl" = "lowlevel/cases/public.jsonl" }

[timing]
clock_s = 3600                        # turn protocol: each seat's chess clock
start_timeout_s = 1800

[actions.cli]                         # the `game` shortcuts per action level: `game aim X Y`, `game throw YAW PITCH SPEED`
high = { aim = ["x", "y"] }
low = { throw = ["yaw", "pitch", "speed"] }

[observation]
fields = ["ball", "points", "colour", "throws"]   # the whitelist of Match.observe(); anything else is an error
renderer = "mujoco"                   # the players' image renderer (a task parameter)
frame_budget_ms = 250                 # per observation, all cameras (also the reply image of an action)
columns = 2
reply_images = "the reply to each throw shows your ball at rest (the overhead camera)"   # Match.reply_views (optional)

[spec]                                # the rule constants: the plugin reads them, /spec shows them
release_point_m = [0.0, 0.0, 1.0]
ball_radius_m = 0.05
balls_per_side = 5
sudden_death_pairs = 3
gravity_m_s2 = 9.81
execution_scatter_1sigma = { yaw_deg = 0.5, pitch_deg = 0.5, speed_rel = 0.01 }
target = "a painted target on the ground, its centre 4-6 m ahead and up to 0.5 m to either side (fixed by the seed)"
rings = [{ radius_m = 0.10, points = 10 }, { radius_m = 0.25, points = 8 }, { radius_m = 0.45, points = 6 },
         { radius_m = 0.70, points = 4 }, { radius_m = 1.00, points = 2 }]
colours = "the side that throws first throws yellow balls, the other side blue"
world = { origin = "ground below the release point", "+x" = "towards the target", "+y" = "left", "+z" = "up" }
throw = "yaw: + = to the left of +x; pitch: above horizontal; the ball leaves the release point, lands and rolls"

[tiebreaks]
order = ["total_then_sudden_death", "closest_ball", "second_thrower"]
text = "the higher total of the 5 balls wins; if level, sudden-death pairs (one ball each, same order, up to 3) until one pair is won; then the side whose best ball rests closest to the centre; then (last resort, not from a rulebook) the side that threw second"
last_resort_in_prompt = true

[[exploits]]
id = "E1"
text = "an out-of-range or malformed action is refused (HTTP 400) and changes nothing"
test = "test_exploit_bad_actions_are_refused"
[[exploits]]
id = "E2"
text = "throwing out of turn is refused (HTTP 409); the turn order cannot be gamed"
test = "test_exploit_out_of_turn"
[[exploits]]
id = "E3"
text = "the observation never holds the target's or a ball's position (only the cameras show them)"
test = "test_exploit_no_positions_in_observation"

[[exploits]]
id = "E4"
text = "the low-level toolkit is what its manifest says (seat/toolkit.toml: sha256 of every file, the seat ships exactly them); the flight model reproduces the simulator's flight and imports nothing of it"
test = "test_exploit_toolkit_is_the_manifest"
[[exploits]]
id = "E5"
text = "the API test's hidden requests stay on the simulator side: the seat gets only the public practice requests (request and our error; no state, no seed), hidden and public are disjoint"
test = "test_exploit_hidden_cases_stay_in_the_simulator"
[[exploits]]
id = "E6"
text = "the deliverable skill runs in its own process (python -I, a scrubbed environment, its own directory, time limits): it cannot import the simulator or the evaluator, its prints do not reach the protocol, a call that raises or overruns gives no command and is counted"
test = "test_exploit_skill_runs_isolated"

[players]
reference = "reference"               # Sport.players() names: camera-only, wins the default configuration
reference_class = "builtin_players:Reference"   # the same player for the task's solution/ (no simulator import)
check = ["random"]                    # policies for the generic tests

[fairness]
policy = "reference"
matches_per_order = 400                # N = 800: 95% CI about +-3.5 pp (fail: CI beyond +-5 pp; warn: wider)
max_advantage_pp = 5
mirror = "exact"                      # exact: swapping seats and first order swaps the result exactly

[official]
seeds = [1, 2, 3]                     # public development seeds (official only while no hidden set is registered)
first_any = true

[score]                               # the continuous score (core 0.2.14, core/score.py): larger is better
name = "mean_points_per_ball"
text = "the mean points of the side's balls (0-10), sudden-death balls included"
from = "hook"                         # share | margin | own (from scores()) | hook (Match.continuous_score())
forfeit = 0.0                         # a side that forfeits (no_show, abandoned, clock) gets the worst value
range = [0, 10]

[golden]
episodes = "golden"                   # sports/hello/golden/<case>/episode.jsonl + expected.json

[[tasks]]
format = "single"
action_level = "high"
[[tasks]]
format = "duel"
action_level = "high"
[[tasks]]
format = "single"
action_level = "low"
[[tasks]]
format = "duel"
action_level = "low"

[broadcast]                           # spectators: the broadcast log every action, the replay video's camera
camera = { name = "broadcast", pos = [3.2, -3.2, 2.2], lookat = [5.0, 0.0, 0.0], fovy_deg = 40, width = 640, height = 360 }

[capabilities]                        # docs/capabilities_zh.md: 2 primary, 1 secondary, 0 none
a1 = 2                                # 3D: the target and the balls only from the camera images
a2 = 1                                # flight and rolling (one fixed physics)
a3 = 1                                # execution under scatter
a4 = 0                                # turn-based: no time pressure
b1 = 1                                # the tiebreak chain
b2 = 0
b3 = 0
physics = ["ballistics", "friction_rolling"]
