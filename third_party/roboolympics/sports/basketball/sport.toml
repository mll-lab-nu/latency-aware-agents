# basketball: the robot basketball shootout (migrated from the legacy task basketball-shootout-program-standard,
# docs/framework_zh.md §10 stage 1). The simulator is the unchanged legacy bball.py / court.py; the legacy records of
# the golden-data store replay bit-exactly (golden/convert.py). One format, the single shootout (review item B10,
# 2026-10-07: the legacy duel basketball-duel-program-standard had no interaction, identical courts, and is retired;
# compare players by their single scores on the same seeds). Revision basketball-5 (2026-10-09): the shooter is a
# declared shooting machine (D7, like Toyota's CUE) instead of a kinematic Franka Panda that seemed to throw; the arm is
# gone, the legacy records no longer apply and were retired from the golden set (README).

[sport]
name = "basketball"
title = "Robot basketball shootout"
summary = "a declared shooting machine (a launcher like Toyota's CUE robots) on a 1 m pedestal shoots from five spots, mid-range to beyond the three-point line, past a static defender, finding the hoop in the camera images; every make counts 1"
protocol = "turn"
revision = "basketball-5+core-0.2"    # = plugin.REVISION; bump on any change that alters play
physics = "MuJoCo 3.3.7 (ball with quadratic drag and Magnus force; rim, backboard, floor and defender contacts)"
image = "ghcr.io/mll-lab-nu/eai-olympiad:0.1.0"
status = "sport"
publish = true
category = "robotics-sports-arena"

[rulebook]
name = "FIBA Official Basketball Rules 2024 (Art. 16, goal); closest standard contest: FIBA 3x3 Shoot-out Contest"
version = "2024 v1.0a"
url = "https://assets.fiba.basketball/image/upload/documents-corporate-fiba-official-rules-2024-v10a.pdf"

[[deviations]]
id = "D1"
rule = "FIBA 3x3 Shoot-out Contest"
text = "a shooting contest instead of a game: 10 shots, two from each of five spots"
affects_result = true
[[deviations]]
id = "D2"
rule = "Art. 16.2.1"
text = "every make counts 1, from any spot, instead of 2 or 3 points by the release area"
affects_result = true
[[deviations]]
id = "D3"
rule = "Art. 2"
text = "NBA court markings and equipment sizes (FIBA: a 6.75 m three-point arc and a 1.80 m backboard)"
affects_result = false
[[deviations]]
id = "D4"
rule = "Art. 33 (contact)"
text = "a static defender with its hands up stands on the line from the shooter to the hoop; a ball that touches it first is blocked and does not count (instead of live defence)"
affects_result = true
[[deviations]]
id = "D5"
rule = "Art. 29 (shot clock)"
text = "time is a chess clock (60 minutes, running while the shootout is on) instead of a shot clock"
affects_result = true
[[deviations]]
id = "D7"
rule = "Art. 4 (teams: the players)"
text = "the shooter is a declared shooting machine, like Toyota's CUE basketball robots, not a player: you set its release (yaw, elevation, speed up to 14 m/s, spin) and it releases the ball from its muzzle with a stated execution scatter; 14 m/s is within what a real shooting robot reaches (CUE6's 24.55 m record shot needs about 20 m/s with this sport's drag), while a robot arm's hand (a Franka Panda: about 2 m/s) could not reach the hoop from any spot"
affects_result = true

[formats.single]
seats = ["A"]
opponent = false                      # solo: no opponent; success = the makes reach the line
success = { score_at_least = 6 }      # makes of 10, as the legacy task

[modes]
action_levels = ["low"]               # one level: the shooting machine's release (angle, speed, spin, yaw)
plays = ["program"]

[timing]
clock_s = 3600
start_timeout_s = 1800

[actions.cli]
low = { shoot = ["angle_deg", "speed", "spin_hz", "yaw_deg"] }

[observation]
fields = ["stage", "shot", "shots_total", "shots_left", "spot", "attempt_at_this_spot", "made", "success_line",
          "last_shot", "shots"]
renderer = "mujoco"
frame_budget_ms = 4000                # four 640 x 480 tiles on the CPU (osmesa); turn-based, nothing moves meanwhile
columns = 2
reply_images = "the reply to each shot shows a picture strip: 2 rows x 4 columns of 400 x 300 tiles, 100 ms apart around the ball's closest approach to the hoop (each tile's `label`: ms from it); row 1: the rim camera (a side view of the hoop), row 2: your shooter_zoom camera"

[spec]                                # the rule constants: /spec shows them, the prompt lists them
shootout = "10 shots, two from each of five spots in order (spot 1 twice, then spot 2 twice, ... spot 5 twice), from mid-range to beyond the three-point line; every make counts 1"
shot = "shoot ANGLE SPEED SPIN YAW: angle_deg = release elevation above horizontal (20 to 80); speed = release speed in m/s (3 to 14); spin_hz = revolutions per second, + = backspin, - = topspin (-5 to 5); yaw_deg = release direction relative to the shooter's current heading, + = to the left, counter-clockwise from above (-35 to 35). The shooter is parked facing roughly, not exactly, towards the hoop (a few degrees off, different at every spot)"
limits = { angle_deg = [20.0, 80.0], speed = [3.0, 14.0], spin_hz = [-5.0, 5.0], yaw_deg = [-35.0, 35.0] }
execution_scatter_1sigma = { speed_rel = 0.005, angle_deg = 0.4, yaw_deg = 0.4, spin_hz = 0.15 }
execution_scatter_source = "an estimate bounded by a real shooting robot: Toyota's CUE3 made 2,020 free throws in a row (Guinness World Records, May 2019), so its make rate from the free-throw line is at least 99.85 % (one-sided 95 % bound); with this scatter the machine, aimed at the centre of the make region, makes 99.87 % from the free-throw line (6000 seeded draws), so the declared scatter is about the largest one consistent with that record; it is drawn per shot from a seeded generator"
shooter = "a shooting machine (D7) on a 1.0 m pedestal: a turret turns its launch tube (the yaw), the tube sets the elevation, and the machine releases the ball from the tube's muzzle with your release parameters plus its execution scatter; nothing of the machine touches the ball after the release; its frame: origin on the floor at the pedestal axis, +x = its heading, +y = its left, z up"
release_point_in_shooter_frame_m = [0.5, 0.0, 2.17]
release = "the release point is the muzzle; its envelope: 0.50 m from the pedestal axis, 2.17 m above the floor, turned by the yaw (the tube pivots about the muzzle, so the elevation does not move it): shooter_pos + 0.50 (cos(h + yaw), sin(h + yaw)) at height 2.17, h = the heading; the ball leaves 0.45 s after the shot command (the machine aims first)"
throw_to_release_s = 0.45
speed_cap = "14 m/s, the machine's declared maximum release speed: within a real shooting robot's reach (Toyota's CUE6 made a 24.55 m shot, Guinness World Records 2024-09-26, which needs at least about 20 m/s from this release height with this sport's drag); the farthest spot needs at most about 9.5 m/s"
ball = "size 7: radius 0.1195 m, mass 0.62 kg (thin shell)"
ball_radius_m = 0.1195
ball_mass_kg = 0.62
flight = "gravity 9.81 m/s^2 (down); air drag F = -drag_coef |v| v (N); Magnus F = magnus_coef (omega x v) (N), omega in rad/s; backspin: omega = 2 pi spin_hz (d x z), d = the horizontal release direction"
gravity_m_s2 = 9.81
drag_coef_n_s2_m2 = 0.0145355
magnus_coef = 0.00418165
contacts = "the floor, the rim, the bracket and the backboard are hard and bouncy (restitution about 0.8 floor, 0.6 rim, 0.65 backboard, 0.3 defender); the net is visual only"
make = "a make: the ball drops through the rim from above (FIBA Art. 16.1.1); it counts 1, from any spot"
defender = "a static defender stands on the line from you to the hoop, min(3.0 m, 0.55 x your distance to the hoop) from you (axis to axis), its hands up (top of the hands at 2.545 m); it never moves; a ball whose first contact is the defender is blocked and does not count"
court = "NBA court markings and equipment sizes: the hoop's centre at (0, 0, 3.048); the floor z = 0; the court is y < 0, the baseline y = +1.60 behind the backboard; rim inner diameter 0.4572 m (orange, 16 mm tube); backboard 1.83 x 1.07 m, its front face 0.381 m behind the rim centre, bottom edge 2.90 m, red border and a red 0.61 x 0.45 m shooter's square above the rim; white 5 cm lines: lane 4.88 m wide, free-throw line y = -4.19 with its 1.8 m circle, three-point arc 7.24 m from the hoop centre (straight 6.71 m from the centre line in the corners), sidelines x = +-7.62"
hoop_centre_m = [0.0, 0.0, 3.048]
rim_inner_diameter_m = 0.4572
world = { origin = "the floor below the hoop's centre", "+y" = "from the court towards the baseline (the shooter's half is y < 0)", "+z" = "up" }
images = "one PNG of four 640 x 480 camera tiles (observation.tiles): shooter_wide and shooter_zoom (both on your shooter, behind and above the arm, looking along its heading, pitched up 8 deg; vertical field of view 55 and 16 deg), broadcast and baseline (fixed, overlooking the court); no hoop, ball or shooter coordinates; `cameras` in /spec gives every camera's pose (the two shooter cameras in the shooter's frame) and intrinsics (pinholes, square pixels)"
act_reply = "after each shot: its result (made, rim, backboard, blocked, airball), how it went in, what the ball touched, the makes and shots left, and a picture strip (observation.image_png_b64 with observation.tiles, as observe; `game` saves it as observation.image_file): 2 rows x 4 columns of 400 x 300 tiles, 100 ms apart around the ball's closest approach to the hoop; row 1: the rim camera (a side view of the hoop), row 2: your shooter_zoom camera"
not_given = "the shooter's position and heading and the spots' distances: judge them from the images"

[[exploits]]
id = "E1"
text = "an out-of-range or malformed shot is refused (HTTP 400) and changes nothing"
test = "test_exploit_bad_actions_are_refused"
[[exploits]]
id = "E2"
text = "shooting before the start, or before the review of one's last shot, is refused (HTTP 409)"
test = "test_exploit_out_of_turn"
[[exploits]]
id = "E3"
text = "the observation and /spec hold no hoop, ball, spot or shooter coordinate (the legacy single task's release_point leaked the shooter's position; it is gone)"
test = "test_exploit_no_positions_in_observation_or_spec"
[[exploits]]
id = "E6"
text = "stalling gains nothing: when the chess clock runs out the shootout ends there (success 0)"
test = "test_exploit_stalling_loses"
[[exploits]]
id = "E8"
text = "the rule constants of the prompt ([spec]) are the simulator's own (a stale prompt would mislead the players)"
test = "test_exploit_spec_matches_the_simulator"
[[exploits]]
id = "E9"
text = "the defender blocks: a flat shot into it is blocked and does not count"
test = "test_exploit_defender_blocks"
[[exploits]]
id = "E10"
text = "the shooting machine never drives the ball: none of its parts can collide, and a shot's flight and result do not depend on the machine's display motion (D7)"
test = "test_exploit_machine_never_touches_the_ball"

[players]
reference = "reference"
reference_class = "builtin_players:Reference"
check = ["random"]

[official]
seeds = [1, 2, 3, 7, 17, 27]          # 7, 17, 27 = the legacy single seeds; 1 = the default

[golden]
episodes = "golden"                   # recorded with the shooting machine (basketball-5); the legacy records are retired (README)

[[tasks]]
format = "single"
action_level = "low"
id = "basketball-shootout-program-standard"    # the legacy task name ([[tasks]] id)

[broadcast]
camera = { name = "broadcast", pos = [-10.5, -6.0, 6.0], lookat = [0.0, -3.2, 1.2], fovy_deg = 50, width = 640, height = 360 }

[capabilities]                        # docs/capabilities_zh.md: 2 primary, 1 secondary, 0 none
a1 = 2                                # 3D: the hoop's bearing and distance from the camera images (pinhole geometry)
a2 = 2                                # ballistics: the release speed to 1-2 % through drag and Magnus force
a3 = 2                                # execution: a shooting machine with a stated scatter; the shot solves the flight
a4 = 0                                # turn-based: no time pressure
b1 = 0
b2 = 0
b3 = 0
physics = ["ballistics", "drag"]      # drag: about 12 % of the ball's weight at release speed; ignoring it misses the hoop
