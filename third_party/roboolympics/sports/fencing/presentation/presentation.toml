# Spectator-only appearance of fencing (docs/framework_zh.md §3.1, renderer rule 6; renderers/presentation/__init__.py).
# Not part of the match: this directory is not copied into the simulator (tools/sportlib.NOT_IN_SIM), so source_sha,
# the golden replays, the task directories and the players' images are unchanged.
[presentation]
version = 1
label = "Franka Panda visual meshes (MuJoCo Menagerie), the fencers' colours kept"

[[presentation.robot]]                # fencer A: the arm's white shells in A's colour (the match scene's A_link*_c rgba)
model = "franka_emika_panda"          # renderers/presentation/menagerie.json (fetched, sha256-pinned)
bodies = '^A_link(?P<n>[0-7])$'
body = "link{n}"
hide = "mesh"                         # the arm's collision meshes move to the hidden group 3
colors = { white = [0.92, 0.50, 0.42, 1], off_white = [0.85, 0.45, 0.38, 1] }

[[presentation.robot]]                # fencer B: B's colour
model = "franka_emika_panda"
bodies = '^B_link(?P<n>[0-7])$'
body = "link{n}"
hide = "mesh"
colors = { white = [0.42, 0.58, 0.95, 1], off_white = [0.38, 0.52, 0.86, 1] }
