# Toolkit manifest: hello x the ball launcher (a declared machine, no library robot), LOW level ("Agent as Robotics
# Engineer", docs/framework_zh.md §6.3.5, §9 robot and mode rules 3-5, 10; schema: skilleval/toolkit.py). Everything the
# low-level seat gets is listed here, the same for every player; the platform's aim (plugin.py AimLayer) is not.
# The seat has this file as /opt/ro/toolkit.toml. Changing it changes the task: bump [toolkit] version and the sport's
# revision, refresh the sha256 (python3 -m skilleval.toolkit check sports/hello/seat/toolkit.toml --fix) and re-run the
# evaluations (tools/check hello --stages 6).

[toolkit]
id = "hello-launcher-low"
version = "1.0.0"
sport = "hello"
level = "low"
configuration = "ball launcher at (0, 0, 1) m (sport.toml [modes.low] machine)"
definition = "RoboOlympics two-mode definition, 2026-10-08 (docs/framework_zh.md §6.3)"

[[tools]]
name = "throw_interface"
kind = "interface"
api = ["act {type: throw, yaw, pitch, speed}: yaw -20..20 deg (+ = left of +x), pitch 0..60 deg above horizontal, speed 1..12 m/s (game spec actions)"]
rate = "one throw per turn"
notes = "the only way to move the ball; the simulator adds the execution scatter of sport.toml [spec] in a match (not in the API test)"

[[tools]]
name = "flight_model"
kind = "library"
file = "/opt/ro/lib/flight.py"
source = "seat/lib/flight.py"
sha256 = "75852ba20af170f858f5be6cc6bf12d7f57e005781e88542223c56e30a11292d"
version = "1.0.0"
api = ["land(yaw_deg, pitch_deg, speed_m_s) -> {x, y, t}: the first ground contact", "path(yaw_deg, pitch_deg, speed_m_s) -> [(t, x, y, z), ...]", "within_limits(yaw_deg, pitch_deg, speed_m_s) -> bool", "constants RELEASE, BALL_RADIUS, GRAVITY, DT, LIMITS"]
license = "the repository's"
notes = "forward only (the simulator's flight: gravity, no drag, 2 ms semi-implicit Euler); standard library only, deterministic"

[limits]
source = "the launcher's ranges = the throw schema of the simulator (plugin.py SCHEMA; sport.toml [spec])"
enforced_by = "the simulator's command schema (core.sport.check_command): an out-of-range throw is refused (no robot: no servo)"

[forbidden]
skills = ["aim: our implementation (plugin.py AimLayer, the high level's act) - the player implements aim itself"]
modules = ["plugin.py", "lowlevel/evaluator.py"]
develop = "aim(x, y): the throw (yaw, pitch, speed inside the ranges) whose ball first touches the ground at (x, y), using the flight model or anything else built from these tools"

[boundary]
baseline = "lowlevel/boundary"        # yaw at the point, the launcher's nominal setting (pitch 35, speed 7): no aiming in depth
threshold = 0.05                      # its API-test success rate must stay at or below this (rule 5)
