# Disc golf (docs/framework_zh.md §4.2, §8; migrated from the Season-1 task discgolf-course-program-standard, docs §10
# stage 1). One format, the single round (user decision of 2026-10-08, as review item B10 for archery and basketball:
# the legacy duel discgolf-duel-program-standard had no interaction between the players, the discs never met on
# identical courses, and is retired; compare players by their single scores on the same seeds). The declarations as data: the core, the generator
# (tools/generate.py), the checks (tools/check) and the prompt/README read this file. The simulator and its rules
# module are sim/ (unchanged from the legacy tree); turnshot.py maps them onto contract ② (sports/bowling/README.md,
# "Pattern for the shared turn-based server").

[sport]
name = "discgolf"
title = "Disc golf"
summary = "play a 6-hole disc golf round (par 20) through woods, around two doglegs, over OB water and past a mandatory in a seeded wind; a disc-launcher robot throws, each throw a release (disc, speed, launch angle, nose angle, bank, spin, aim) chosen from the camera images, and the disc flies with a deterministic aerodynamic model (lift, drag and pitching moment of Hummel 2003, gyroscopic precession, spin-down)"
protocol = "turn"
revision = "discgolf-3"               # discgolf-1 = the Season-1 service (turn-1); 3: single only (the duel retired)
physics = "disc-flight model (Hummel 2003, RK4, dt 0.01 s) with tree, basket and ground contact; MuJoCo scene for the views"
image = "ghcr.io/mll-lab-nu/eai-olympiad:0.1.0"
status = "sport"
publish = true
category = "robotics-sports-arena"

[rulebook]
name = "PDGA Official Rules of Disc Golf (Professional Disc Golf Association, rev. 2026-01-01)"
version = "2026-01-01"
url = "https://www.pdga.com/rules/official-rules-disc-golf"

[[deviations]]
id = "D1"
rule = "802.07"
text = "the thrower is a launcher robot with a stated release scatter; no run-up and no stance rules: the release point is 1.0 m above the lie"
affects_result = false
[[deviations]]
id = "D2"
rule = "806.02"
text = "out of bounds always uses option 806.02.B (the next lie is the point where the disc was last in bounds), without the 1 m relief"
affects_result = true
[[deviations]]
id = "D3"
rule = "808"
text = "a hole not holed out after par + 3 throws (penalty throws included) ends there and scores par + 4 (not in the rules; it bounds the round's length)"
affects_result = true
[[deviations]]
id = "D4"
rule = "805.02"
text = "a disc that rests on a tree drops to the ground below it at once (805.02 does not apply)"
affects_result = false
[[deviations]]
id = "D5"
rule = "802.03"
text = "no time limit per throw: the player has a chess clock instead; when it runs out the round ends there, and the unfinished hole and the holes not played score par + 4 each"
affects_result = true

[formats.single]
seats = ["A"]
opponent = false                      # solo: success = a complete round in 21 throws or fewer (par + 1, the old task's line)
success = { score_at_most = 21 }

[modes]
action_levels = ["low"]               # the launcher's release is the only level (no robot body)
plays = ["program"]

[timing]
clock_s = 3600                        # the chess clock (the round's turns, reviews included)
start_timeout_s = 1800

[actions.cli]                         # `game throw DISC SPEED LAUNCH_DEG NOSE_DEG BANK_DEG SPIN_RPS AIM_DEG`
low = { throw = ["disc", "speed", "launch_deg", "nose_deg", "bank_deg", "spin_rps", "aim_deg"] }

[observation]
fields = ["decision", "game_over", "score", "last_shot"]   # the whitelist of Match.observe()
renderer = "mujoco"                   # the sport draws its own views (sim/discgolf.py Views, MuJoCo + osmesa)
frame_budget_ms = 2000                # per observation, all three views (about 200-400 ms on a CPU)
columns = 1

[spec]                                # the rule constants (shown in /spec and in the prompt's Rules)
round = "6 holes, par 3, 3, 4, 3, 3, 4 (par 20); stroke play (PDGA 808): the score is the number of throws plus penalty throws, fewer is better; every hole's tee sign (the basket, the course limits, the OB areas, the mandatory, the ground, the overview's centre and scale) is /spec match.holes"
tee_and_lie = "each hole starts at its tee, (0, 0) (802.04); the next throw is made from where the disc came to rest, below it if it rests above the ground (802.05, 805.01)"
out_of_bounds = "a disc that comes to rest outside the course limits or in an OB area (the water) is out of bounds: one penalty throw, and the next lie is the point where it was last in bounds (806.02.B)"
mandatory = "on a hole with a mandatory (match.holes[].mandatory), until your disc has passed it on the correct side, a throw that crosses the restricted line misses it: one penalty throw, and the next lie is the drop zone (804.01)"
holing_out = "the disc is holed when its centre comes within catch_radius_m of the pole between 0.70 and 1.40 m above the basket's ground (or drops into the tray from above) at no more than max_catch_speed_m_s (/spec contacts.basket); faster, the chains spit it out and it drops at the basket (807)"
cap = "a hole not holed out after par + 3 throws (penalty throws included) ends there and scores par + 4"
single_success = "the single round (no opponent) succeeds when it is complete in 21 throws or fewer (par 20 + 1, penalty throws included): lower is better, so the success line is a score of AT MOST 21"
throw = "{'type':'throw','disc':D,'speed':V,'launch_deg':A,'nose_deg':N,'bank_deg':B,'spin_rps':S,'aim_deg':H}: disc = putter, midrange or driver (coefficients in /spec discs); speed = release speed, m/s (5 to 30); launch_deg = the velocity's angle above horizontal (-5 to 35); nose_deg = the disc's pitch above the velocity, its angle of attack at release in still air (-10 to 15); bank_deg = the disc's roll about the flight direction, + = its left edge down seen from behind (hyzer for a clockwise spin) (-60 to 60); spin_rps = revolutions per second, + = clockwise seen from above (a right-hand backhand), at least 4 in magnitude (-20 to 20); aim_deg = the heading of the release in the hole's frame, 0 = +x, counter-clockwise positive (-180 to 180), not relative to the basket; the launcher releases the disc 1.0 m above the ground at your lie"
execution_scatter_1sigma = { aim_deg = 1.5, launch_deg = 1.5, nose_deg = 1.5, bank_deg = 3.0, speed_frac = 0.04, spin_frac = 0.05 }
flight = "the disc (mass, diameter, Izz in /spec discs) flies with the model of Hummel (2003; as in FrisPy): with u = v - w the velocity relative to the air, n the disc's unit normal, q = rho |u|^2 / 2 and the angle of attack alpha = atan2(-u.n, |u - (u.n) n|): lift q A (CL0 + CLa alpha) perpendicular to u towards n; drag q A (CD0 + CDa (alpha - ALPHA0)^2) along -u; pitching moment q A d (CM0 + CMa alpha) (+ = nose up) about -(n x e), e = the unit vector of u's component in the disc's plane; spin-down torque q A d CS (w_s d / (2 |u|)) about n; the normal precesses as dn/dt = tau / (Izz w_s); RK4, dt 0.01 s. A clockwise disc with a nose-up moment (slow) rolls left and fades left; fast, the moment is nose-down and it turns right"
wind = "uniform and horizontal over the hole, constant during a flight; each hole has its own wind and it gusts from throw to throw; the windsock (/spec cameras.wind) always shows the wind of the throw you are about to make: it points downwind and hangs at 90 deg x (1 - speed / 10 m/s) below horizontal; no wind numbers are given"
trees_basket_ground = "trees are vertical cylinders, 12 to 22 m tall: a trunk (radius 0.30 m) from the ground to the top, the canopy (the green disc seen from above) from 2.5 m to the top; a trunk bounces the disc, a canopy catches it and it falls; the ground is a tilt plus Gaussian hills (match.holes[].ground); on landing the disc skids (v_h - mu_impact v_z)^2 / (2 mu_kinetic g); constants in /spec contacts and air"
world = "each hole has its own frame: the tee at (0, 0), x down the fairway, y to the left, z up (metres)"
image_layout = "one PNG (its rectangles are `image.tiles` in /spec and `observation.tiles`): overview (top, 1400 x 700, orthographic straight down on the whole hole: trees as green discs, the basket yellow in the white 10 m circle, OB lines white, OB water blue, a mandatory's line red and its drop zone a yellow square, your launcher orange at your lie, the flight of your previous throw on this hole as yellow dots), tee (bottom left, 1000 x 600, a pinhole camera behind your launcher looking at the basket) and wind (bottom right, 400 x 400, orthographic straight down on the windsock); poses and scales in /spec cameras; no tree coordinates or wind numbers are given"
decision_point = "referee information in every state: the hole, its par, the throw you are about to make (penalty throws counted), your lie and its ground height, the basket and its distance and heading, whether the mandatory is cleared, and your previous throw's result on this hole"


[[exploits]]
id = "E1"
text = "an out-of-range or malformed throw (unknown field or disc, NaN, a string, a missing field, |spin| < 4) is refused (HTTP 400), never clipped, and changes nothing"
test = "test_exploit_bad_actions_are_refused"
[[exploits]]
id = "E2"
text = "throwing before the start or before the review of the previous throw is refused (HTTP 409)"
test = "test_exploit_out_of_turn"
[[exploits]]
id = "E3"
text = "stalling gains nothing: a round that ends early is a valid failure (abandoned or on the clock; on the clock the unfinished hole and every hole not played score par + 4: session_end)"
test = "test_exploit_stalling_loses"
[[exploits]]
id = "E4"
text = "no world state reaches the player: no tree coordinates, no wind numbers, no flight track, no executed release and no seed in the observation or /spec (world_state, seed_hidden)"
test = "test_exploit_no_world_state"
[[exploits]]
id = "E5"
text = "throwing out of bounds (into the water to reach the far side) costs a penalty throw and the next lie is where the disc was last in bounds; cutting the mandatory costs a penalty throw and the next lie is the drop zone"
test = "test_exploit_ob_and_mandatory_penalised"
[[exploits]]
id = "E6"
text = "a hole cannot be played forever (par + 3 throws, then par + 4); a disc fired into the basket too fast is spat out; a throw straight through the woods hits the trees (no flying through obstacles)"
test = "test_exploit_cap_fast_basket_and_trees"

[players]
reference = "reference"               # Sport.players(): camera-only, reaches the line on the default seed
reference_class = "builtin_players:Reference"
check = ["random"]

[official]                            # the Season-1 official seeds (20261005 = the standard course); the default is 1
seeds = [20261005, 2, 3]

[golden]
episodes = "golden"                   # golden/<case>/ + golden/convert.py (the Season-1 records, RO_GOLDEN_DATA)

[[tasks]]
id = "discgolf-course-program-standard"   # the Season-1 task name ([[tasks]] id)
format = "single"
action_level = "low"

[capabilities]                        # docs/capabilities_zh.md: 2 primary, 1 secondary, 0 none
a1 = 2                                # trees, basket and the flight from the overview and tee images; the wind from the windsock
a2 = 2                                # aerodynamics: lift, drag, pitching moment, precession (turn and fade) in the wind
a3 = 2                                # seven release parameters under execution scatter
a4 = 0                                # turn-based: no time pressure
b1 = 1                                # OB, mandatory and cap penalties
b2 = 1                                # route planning (safe layup or risky line)
b3 = 0
physics = ["ballistics", "wind", "drag"]
