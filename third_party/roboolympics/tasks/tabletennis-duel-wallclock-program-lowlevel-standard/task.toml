schema_version = "1.3"
artifacts = [
  "/app/output/",
  { source = "/app/output/", service = "seat_a", destination = "seats/A/app/output" },
  { source = "/app/output/", service = "seat_b", destination = "seats/B/app/output" },
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/video.json", service = "sim" },
  { source = "/data/broadcast.jsonl", service = "sim" },
  { source = "/data/think_usage_A.json", service = "sim" },
  { source = "/data/think_calls_A.jsonl", service = "sim" },
  { source = "/data/think_usage_B.json", service = "sim" },
  { source = "/data/think_calls_B.jsonl", service = "sim" },
  { source = "/data/inloop_A.jsonl", service = "sim" },
  { source = "/data/inloop_B.jsonl", service = "sim" },
]

[task]
name = "robot-coding-bench/tabletennis-duel-wallclock-program-lowlevel-standard"
description = "Table tennis, PROGRAM PLAY, duel, action level low (eai-standard-realtime/1.0): robot table tennis in a continuous world slowed by a factor S (MuJoCo Franka Panda + paddle on an x-y rail base behind the end line, both held to the real robot's limits: the Panda's joint velocity, acceleration, jerk, torque and torque rate, the rail's speed, acceleration and jerk; DeepMind ball and table model), seen only through two cameras of four frames each; one game to 5 points (lead by 2 from 4:4, at 6:6 the next point wins); the players' robots serve by the ITTF service laws (a toss device on the robot projects the ball at least 16 cm up from a point you choose behind your end line, you strike it as it falls; 2 serves each, from 4:4 one each); format match: you against a scripted opponent (level 1-4; you serve first), format duel: two players. Generated from sports/tabletennis/sport.toml by tools/generate.py on the v0.2 core."
authors = [{ name = "RoboOlympics" }]
keywords = ["program-play", "tabletennis", "sports", "realtime", "vision", "roboolympics-v0.2"]

[metadata]
revision = "wallclock-15+duel-wallclock-12+low-inloop-1+core-0.2"
author_name = "RoboOlympics"
category = "robotics-sports-arena"
task_type = "trajectory"
simulator = "mujoco"
robot = "franka_panda"
family = "tabletennis_duel"
mode = "standard"
protocol = "eai-standard-realtime/1.0"
play = "program"
action_level = "low"
oracle = "full"
oracle_evidence = "solution/: the sport's reference player (camera images and /spec only); tools/check runs it live and it wins the default configuration"
parameters = "DUEL_SEED, FIRST_PLAYER, RO_RENDERER (the players' image renderer)"
expert_time_estimate_hours = 0.5
skill_deliverable = "/app/output/skill/hit.py"
skill_in_loop = true
skill_evaluation = "python3 tools/skill_eval.py tabletennis <the trial's artifact app/output/skill> --inloop-log <the trial's artifact inloop_<seat>.jsonl>"

[[seats]]
name = "A"
service = "seat_a"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress_a"]

[[seats]]
name = "B"
service = "seat_b"
agent_kwargs = { think_proxy_url = "http://sim:18091/v1" }
setup_networks = ["egress_b"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 600); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; [ x$RCB_RENDER_VIDEO = x1 ] && for i in $(seq 1 300); do [ -f /data/video.json ] && break; sleep 1; done; cat /data/final.json | head -c 2000"
timeout_sec = 1080

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 1024
