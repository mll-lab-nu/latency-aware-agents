# tennis: robot singles tennis in real time (docs/framework_zh.md §4.2, §8). Migrated from the legacy tree in stage 3
# (scripts/olympiad/tennis, scripts/olympiad/shared/tennis): sim/tn.py (court, ball, robot, stroke controller, scripted
# opponent, referee), sim/duel.py (the two-robot match). Physics unchanged since the migration; since revision
# wallclock-7 + duel-5 (2026-10-07) the players serve (ITF Rules 16-22), the rails cover the whole half and the duel's
# robots share one execution-scatter sequence (the legacy recordings no longer replay; golden re-recorded); since
# wallclock-8 + duel-6 (2026-10-08) no cap: from 4:4 a lead of 2; since wallclock-9 + duel-7 (2026-10-09, rule A6)
# each robot draws its own execution-scatter stream, swapped by the duel pair.
# [[tasks]] id keeps the legacy task names (tennis-match-wallclock-program-standard, tennis-duel-wallclock-program-standard).

[sport]
name = "tennis"
title = "Robot tennis"
summary = "robot singles tennis on a regulation court in real time (slowed down): a Franka Panda arm with a racket on an x-y rail base, the ball with drag, Magnus lift, a hard-court bounce and a racket impact law; first to 5 points; format match: you against a scripted computer opponent (levels 1-4, `game spec` match.opponent_level), format duel: two players; the players serve (ITF Rules 16-22, tie-break order)"
protocol = "realtime"
revision = "tennis-wallclock-9+duel-7+core-0.2"   # bump on any change that alters play (9/7: independent execution-scatter streams, rule A6)
physics = "mujoco (robots, PD-controlled joints at 1 ms) + a point-mass ball integrated at 1 ms (sim/tn.py)"
image = "ghcr.io/mll-lab-nu/eai-olympiad:0.1.0"
status = "sport"
publish = true
category = "robotics-sports-arena"

[rulebook]
name = "ITF Rules of Tennis 2026 (English)"
version = "2026"
url = "https://www.itftennis.com/media/7221/2026-rules-of-tennis-english.pdf"

[[deviations]]
id = "D1"
rule = "5-7"
text = "one tie-break-style game to 5 points instead of games and sets (Rule 5 b, shorter): from 4:4 a lead of 2 is needed, without a cap (the serving order is the tie-break's; since revision wallclock-8 + duel-6, 2026-10-08: the earlier cap of 7 points favoured one serving order whenever the server's point rate was far from 1/2); the match also ends after 400 racket hits or 40 points played: the player ahead wins, at equal points the winner of the last point"
affects_result = true
[[deviations]]
id = "D2"
rule = "16"
text = "the robot has one arm and holds the racket (Rule 16: a one-armed player may release the ball with the racket): the release is a `toss` command: the ball appears at a declared point (0.3-2.4 m high, within 1.3 m horizontally of the base) and is projected straight up by a declared height (0-1.0 m), without spin; the rulebook allows a release in any direction"
affects_result = true
[[deviations]]
id = "D3"
rule = "24 i"
text = "only the strings touch the ball: it passes through the racket frame, the arm and the base"
affects_result = true
[[deviations]]
id = "D4"
rule = "-"
text = "the robot moves on rails over its whole half (|bx| <= 5.9, -15.4 <= by <= -0.4; up to 4 m/s and 8 m/s^2); the stance rules are judged on the base: at the release it must be at rest (< 0.1 m/s) with its centre behind the base line between the centre mark and the singles sideline (Rule 16), and a base that moves more than 0.10 m between the release and the strike is a foot fault (Rule 18); a toss from a wrong stance is refused, not faulted"
affects_result = true
[[deviations]]
id = "D5"
rule = "-"
text = "the last resort of the no-draw rule (equal points at the match limit and no point won) is not from the rulebook: the player who received first wins (format match: the opponent, since you serve first)"
affects_result = true
[[deviations]]
id = "D6"
rule = "21"
text = "the serve window: it opens 1.0 s after the point starts (the receiver is ready) and closes 6 s later (a second serve or a let: opens at once, 4 s for a second serve); no toss within it is a service fault (undue delay), every time (the rulebook leaves the timing to the officials; no disqualification)"
affects_result = true
[[deviations]]
id = "D7"
rule = "5 b"
text = "format match: you serve the first point; duel: the first server is match.first_server (the runner plays both orders; there is no toss for service)"
affects_result = true

[formats.match]             # one model seat against the scripted opponent inside the world (tn.Match)
seats = ["A"]
opponent = true                       # success = winning a valid match (core/grading.py), as in the legacy task
levels = [1, 2, 3, 4]                 # the opponent level (RCB_LEVEL; default 1)
[formats.duel]              # two seats (duel.Duel), mirrored: each plays in its own frame
seats = ["A", "B"]
first = ["A", "B"]                    # the first server; the runner plays both orders

[modes]
action_levels = ["high", "low"]       # high: the racket command `act` (lowered to joint targets); low: joint targets
plays = ["program"]

[timing]
slowdown = 20                         # the legacy default (RCB_SLOWDOWN; the act lead is ceil(0.5 s / (0.01 s x S)) steps)
start_timeout_s = 1800                # the second seat may start up to 30 min after the first (legacy START_TIMEOUT_S)
ready_timeout_s = 300                 # each review after a point (legacy READY_TIMEOUT_S), else the late side loses

[actions.cli]                         # `game none`; act, move and traj take vectors: `game act '{"type": "move", "base": [0, -11.4]}'`
high = { none = [] }
low = { none = [] }

[observation]
fields = ["score", "point", "ball", "t_since_played", "heard", "robot_base_xy", "q_arm", "racket_pos", "racket_normal",
          "ball_in_play", "ball_state", "you_serve", "you_receive_serve", "serve", "command", "base_rest", "pending_commands",
          "last_points", "last_shots", "opponent_level", "q_target"]
renderer = "mujoco"                   # the sport draws its own views (the legacy 2 x 4 tiles, MuJoCo; plugin.Views)
frame_budget_ms = 4000                # one observation, 8 tiles of 640 x 480 (CPU osmesa, measured 2-3 s at host load ~650)
columns = 4

[spec]                                # the rule constants (the simulator's values; tests/test_tennis.py checks them)
match = "first to 5 points; from 4:4 a player must lead by 2 (no cap: 5:4, 6:5, ... go on until a lead of 2); the match also ends after 400 racket hits or 40 points played: then the player with more points wins, at equal points the player who won the last point"
serve = "the players serve (ITF Rules 16-22). Order (tie-break, Rule 5 b): the first server serves point 1, then each player serves two points in turn (format match: you serve first; duel: match.first_server); the serving half alternates every point, point 1 from the right half (state.serve.court). The window opens 1.0 s after the point starts and closes 6 s later (state.serve.opens_in_s, deadline_in_s). Your base must be at rest (< 0.1 m/s) behind your base line (y <= -11.885) between the centre mark and the singles sideline of the serving half. {'type':'toss','pos':[X,Y,Z],'height':H}: when it takes effect (the act lead) the ball is at that point (0.3 <= Z <= 2.4, within 1.3 m horizontally of your base) and rises straight up by H (0 <= H <= 1.0; 0: dropped), no spin; then hit it with an act before it lands (the act may be sent before the toss). The serve must first land in the service box diagonally opposite (lines are in). Faults (a second serve from the same half; a second fault, a double fault, loses the point): out of the box, into the net, a foot fault (your base moves more than 0.10 m between the toss and the strike), the toss missed while a stroke is under way (a toss let drop without a stroke is tossed again, within the window), no toss within the window (undue delay). A serve that touches the net and is otherwise good is a let (that serve again, a previous fault stands). The receiver may not hit the serve before it bounces. A point lost on the serve says 'serve_fault:<reason> (double fault: ...)' with reason undue_delay, out_of_box, net, foot_fault, missed_toss or not_completed (each serve's outcome is in the match record); a receiver who hits the serve before it bounces loses the point with 'receive_fault:volley'"
play = "after the serve has bounced in your service box, or after your opponent's shot (which you may also hit before it bounces), hit the ball once so that it passes over the net, directly or after touching its top edge, and first lands inside your opponent's singles court (lines are in). You lose the point for returning the serve before it bounces, a racket contact beyond the net (y > 0, Rule 24 i), a second bounce on your half, a ball into the net, or a ball that lands out or on your own half; your opponent loses it for the same faults"
opponent = "format match: a scripted computer opponent that never makes unforced errors and returns every ball it can reach; higher levels react and run faster, reach further and hit faster, wider balls with more spin"
world = "metres; your own frame: x to your right, y towards the opponent, z up. Court surface z = 0; singles court |x| <= 4.115, |y| <= 11.885; service lines at |y| = 6.40. The net is the plane y = 0, its top 0.914 m at x = 0 rising linearly to 1.07 m at |x| = 5.029. Your half is y < 0"
robot = "a Franka Panda arm on a 0.55 m pedestal (shoulder 0.88 m above the court) whose base slides on rails over the whole half (|bx| <= 5.9, -15.4 <= by <= -0.4, up to 4 m/s and 8 m/s^2; home (0, -11.4)); the racket head centre is 0.52 m beyond the flange; the strung face is an ellipse of half axes 0.13 m x 0.16 m. Contacts are comfortable 0.6-1.4 m high, about 0.6-0.8 m to the right of and 0.2-0.4 m in front of the base"
ball = "mass 57.7 g, radius 0.0335 m; gravity 9.81 m/s^2; drag a = -0.0203 |v| v; Magnus lift a = 0.0370 C_L |v|^2 unit(w x v) with C_L = 1/(2 + 1/S), S = 0.0335 |w| / |v|; the spin w is constant in flight"
court_bounce = "the normal velocity reverses with restitution 0.76; friction (coefficient 0.6) acts on the ball's contact point until it rolls (the tangential impulse is the smaller of 0.6 x the normal impulse and what stops the sliding); the ball's moment of inertia is 0.55 m r^2"
net = "a ball whose centre comes within its radius of the net's top edge bounces off the edge by the same law (restitution 0.3, friction 0.3) and play goes on; a ball that meets the net lower down stops there"
racket_contact = "the ball leaves as if the racket head moved 5 times faster than its delivered velocity (V = 5 x the head velocity). In the frame moving with V, with n the unit face normal towards the ball, the normal component reverses with restitution 0.82 (at the head centre, up to 25 % less towards the frame) and friction (coefficient 0.4) acts as in the court bounce. Without the friction: v_out = v_in - 1.82 ((v_in - V).n) n"
act = "high level: {'type':'act','t':T,'pos':[PX,PY,PZ],'normal':[NX,NY,NZ],'vel':[VX,VY,VZ],'base':[BX,BY] (optional)}: the racket's state at contact, T s after the act takes effect: the head centre, the string-face normal (towards the incoming ball), the head velocity (m/s) and optionally the base position at contact (default: the forehand stance, base = (PX - 0.62, PY - 0.30)). Limits: 0 < T <= 5, |x| <= 6.5, -16 <= y <= 0, 0.1 <= z <= 2.4, speed <= 8 m/s. The act is accepted at the next control step and takes effect `act.lead_steps` steps later (`game spec`; the stroke is planned meanwhile); it replaces the stroke under way. The delivered state scatters by about 5 mm, 0.5 degrees and 2 %. {'type':'move','base':[BX,BY]} sets the base's rest position (where the base goes whenever no stroke is under way; home after each point); {'type':'none'} cancels the stroke (the arm returns to its ready pose); both take effect at the next step; `toss` (serve) takes effect after the act lead. Each player's execution scatter is independent of the opponent's within a match: your acts draw your own seeded stream, and the scripted opponent's choices draw others; format duel: the two matches of a duel pair (the same seed, the first server swapped) swap the scatter sequences, so over the pair both players meet the same draws"
lowlevel = "low level: {'type':'traj','q':[[base_x, base_y, q1..q7], ...]}: joint targets, one per 10 ms control step from the next step on (then the arm returns to its ready pose), each within the joint ranges and speed limits of `game spec` joints; move, none and toss as above (toss: at the next step)"
observation = "a PNG of 2 rows x 4 columns of 640 x 480 tiles: row 1 a camera behind and above your base line looking down the court, row 2 a camera at the side of the court (x < 0) looking along +x (your half on the right); the columns are frames 40 ms apart, newest on the right, with each frame's step and game time (view_steps, view_sim_times) and view_leg_ids (a new id each time the ball is served or hit). No ball coordinates: the ball is drawn enlarged, a yellow-green sphere of radius 9 cm centred on its true position. `game spec` gives both cameras' poses and intrinsics (pinhole, 45 degree vertical field of view, focal length 579.4 px, principal point at the tile centre). The state gives your robot (robot_base_xy, q_arm, racket_pos, racket_normal), the bounces you heard (side and time, no position), whether the ball is coming to you, and the serve (you_serve, you_receive_serve, serve: phase waiting / open / tossed / done, court, serve_number, opens_in_s, deadline_in_s, tossed_at_step and the toss point and height, also the opponent's)"
duel = "format duel: another agent controls an identical robot across the net; in each player's frame its own half is y < 0 and its base's home is (0, -11.4). The players serve by the serve rules above, match.first_server first"

[tiebreaks]
order = ["score", "last_point", "first_receiver"]
text = "first to 5 points (from 4:4 by 2, no cap); at the match limit (400 hits or 40 points played) the player with more points; at equal points the player who won the last point; then (last resort, not from the rulebook) the player who received first (format match: the opponent, since you serve first)"
last_resort_in_prompt = true

[[exploits]]
id = "E1"
text = "an out-of-range, non-finite or malformed command is refused (HTTP 400) and changes nothing"
test = "test_exploit_bad_commands_are_refused"
[[exploits]]
id = "E2"
text = "low-level joint targets outside the joint ranges or faster than the joint speed limits are refused when they would take effect and change nothing"
test = "test_exploit_joint_limits"
[[exploits]]
id = "E3"
text = "acts cannot be stacked: a command sent before the previous act took effect is refused (HTTP 409)"
test = "test_exploit_no_stacked_acts"
[[exploits]]
id = "E4"
text = "the observation holds no ball position, velocity or spin and no opponent state (only the images, the heard bounces and the player's own robot)"
test = "test_exploit_no_ball_state_in_observation"
[[exploits]]
id = "E5"
text = "doing nothing gains nothing: a player who never hits loses every point it receives, and one who never serves loses every point it serves (two undue-delay faults)"
test = "test_exploit_idle_loses"
[[exploits]]
id = "E6"
text = "a rally ball that touches the net's top edge and lands in is played on (ITF Rule 25 a; the legacy net-cord test)"
test = "test_exploit_net_cord"
[[exploits]]
id = "E7"
text = "the rule constants the players are told (/spec, [spec]) are the simulator's"
test = "test_exploit_spec_is_the_simulator"
[[exploits]]
id = "E8"
text = "a lowered act replays exactly: the episode holds the low-level joint targets, and a fresh replay reproduces the live state"
test = "test_exploit_lowered_act_replays"

[[exploits]]
id = "E9"
text = "the serve rules: a toss by the receiver, before the window opens, twice, from a moving base, from a base in front of the base line or outside the serving half, or beyond reach is refused and changes nothing; a base that moves during the service motion is a foot fault; a serve out of the box is a fault and two lose the point; a serve touching the net and landing in is a let"
test = "test_exploit_serve_rules"
[[exploits]]
id = "E10"
text = "the rails reach the net, but a racket contact beyond the net (y > 0) loses the point (ITF Rule 24 i)"
test = "test_exploit_reach_over_net"
[[exploits]]
id = "E11"
text = "the opponent's strokes tell nothing about your own scatter: each robot's execution scatter is its own seeded stream (duel: the first server's and the other's, swapped by the two matches of a pair, so over the pair both players meet the same draws; match: independent of the scripted opponent's serve and return choices). Until duel-6 the n-th act of either robot got the same draw, which a player acting later could pre-compensate (rule A6)"
test = "test_exploit_independent_scatter_streams"

[players]
reference = "reference"               # camera-only (the legacy tn_player.py + the serve): wins the default configuration
reference_class = "builtin_players:Reference"
check = []                            # the generic tests play the reference only (each match draws 8 tiles per view)

[fairness]
policy = "reference"
matches_per_order = 100               # N = 200 (2026-10-07 review: >= 100 per order); one in-process duel draws its
                                      # 8-tile views on the CPU (see [check]); a realtime sport's wide interval only warns
max_advantage_pp = 5
mirror = "statistical"                # seats are mirrored worlds (one scatter stream per robot, following the first server); the first server alternates

[official]
seeds = [1, 2, 3, 101, 111, 121, 202, 212, 222, 303, 313, 323, 404, 424, 434]   # duel: 1-3; match: the legacy level seeds
levels = [1, 2, 3, 4]
slowdowns = { program = [1, 2, 5, 10, 20] }
first_any = true

[check]                               # tools/check limits: an in-process duel draws ~3000 8-tile views per seat (~0.4 s each on the shared host)
stage_timeout_s = 36000               # stage 2 (in-process matches with images) takes hours; stage 4 at N = 200 does not fit (see README)
live_player_timeout_s = 4500

[golden]
episodes = "golden"                   # recorded under revision wallclock-8 + duel-6 (the legacy machine-serve records are retired)

[[tasks]]
id = "tennis-match-wallclock-program-standard"   # the legacy task name ([[tasks]] id)
format = "match"
action_level = "high"
[[tasks]]
id = "tennis-duel-wallclock-program-standard"
format = "duel"
action_level = "high"

[capabilities]                        # docs/capabilities_zh.md §6
a1 = 2                                # the ball's flight only from the camera images (rays, a flight fit)
a2 = 2                                # drag, Magnus lift, the bounce and racket laws
a3 = 2                                # a robot arm on rails, a stroke under joint limits and scatter
a4 = 2                                # real time: the ball does not wait; the act lead
b1 = 1                                # the scoring and let rules, the match limit
b2 = 2                                # placement against the opponent, reading its position
b3 = 0
physics = ["spin_bounce"]

# ---------------------------------------------------------------------------------------------------------------------
[self_collision]                       # real limits B0 (2026-10-09): the arm cannot pass through its own stand and links
body = "franka_panda"                  # bodies/franka_panda/body.toml [self_collision]; the pairs in the scenes below are
                                       # generated (python3 -m bodies.selfcollision scene sports/tennis), CI S4 compares
[[self_collision.scenes]]
scene = "sim/scene/tn_scene.xml"
robots = [{ prefix = "", suffix = "" }]
geoms = "physical"                     # the arm's meshes, the tool, the stand (massless drawings left out)
[[self_collision.scenes]]
scene = "sim/scene/tn_duel.xml"
robots = [{ prefix = "", suffix = "" }, { prefix = "", suffix = "_b" }]
geoms = "physical"                     # the arm's meshes, the tool, the stand (massless drawings left out)
