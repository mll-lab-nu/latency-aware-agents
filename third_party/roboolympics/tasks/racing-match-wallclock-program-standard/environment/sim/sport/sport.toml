# racing (docs/framework_zh.md §4.2, §10 stage 3): 1:10-scale robot racing after the RoboRacer rules, migrated from the
# legacy tree (scripts/olympiad/racing, scripts/olympiad/shared/racing/sim); the simulator and referee race.py is the
# legacy file, so the legacy recordings replay bit-exactly (golden/convert.py). Three formats: `match` (seat A against
# the scripted car, levels 1-4), `duel` (seats A and B) and `race` (4 cars, seats A-D: heats with a rotating grid and
# an F1 points classification; the core's stage-0 hooks ranking() and retire()). [[tasks]] id keeps the Season-1 task
# names.

[sport]
name = "racing"
title = "Robot racing"
summary = "drive a simulated 1:10-scale racecar (rigid chassis, four rolling wheels, wheel-speed and steering servos with finite force) round a seeded walled circuit with fixed obstacles, from the cameras on your car; one-lap heats after the RoboRacer Head-to-Head rules, with crash calls (the at-fault car is placed 2 m behind and warned, the third warning disqualifies) and obstacle crashes; format `match`: against a scripted car, the first to win two heats wins; `duel`: against another player under the same rules; `race`: four cars, one heat per car with a rotating grid, points per place and a classification by points"
protocol = "realtime"
revision = "racing-v3+core-0.2"       # plugin.REVISION; legacy: race.py v3 (seeded circuits, obstacles, multi-car race)
physics = "mujoco (CPU, 500 Hz rigid-body cars with wheel contacts and servo-driven wheels and steering, rigid walls and fixed obstacles)"
image = "ghcr.io/mll-lab-nu/eai-olympiad:0.1.0"
status = "sport"
publish = true
category = "robotics-sports-arena"

[rulebook]
name = "RoboRacer Rules, general rules of the 31st International RoboRacer (formerly F1TENTH) Autonomous Racing Competition; the multi-car race takes its classification from the FIA Formula 1 Sporting Regulations"
version = "v3.2026-draft, read 2026-10-05 (sections cited by name, with the 24th-competition rule numbers of github.com/f1tenth/roboracer_rules @ 202c377146 in brackets); FIA 2026 Formula 1 Sporting Regulations"
url = "https://iros2026-race.roboracer.ai/rules.html"

[[deviations]]
id = "D1"
rule = "Head-to-Head Race > Evaluation [2.5.4.1]"
text = "one lap per heat (official: the first car to complete 20 laps wins)"
affects_result = true
[[deviations]]
id = "D2"
rule = "Head-to-Head Race > Single Elimination, up to three heats [2.5.1.8]; Time Trial > Evaluation (random method)"
text = "first to two heat wins as written; the race slot is replaced by a heat time limit of the lap length at 1.25 m/s rounded up to 5 s (55-60 game s on the official circuits); with no finisher the rulebook's completed laps and progress decide (checkpoint-bounded distance, millimetres), then who reached that progress first, then, as the stated last resort, a draw fixed by the seed; two finishers in one 10 ms step are ordered by the interpolated crossing time"
affects_result = true
[[deviations]]
id = "D3"
rule = "Head-to-Head Race, starting positions [2.5.1.9]"
text = "there is no Time Trial: in heat 1 FIRST_PLAYER starts on the outer side, in heat 2 the sides switch (as written), in heat 3 a draw fixed by the seed (the rulebook's random method) gives the inner side (the legacy task gave it to the faster winning lap of heats 1-2; between cars of equal pace that was an artefact of the control timing and always the car that started inside in heat 1); the cars are 0.84 m apart centre to centre (official: about 30 cm)"
affects_result = true
[[deviations]]
id = "D4"
rule = "Race penalties, crash into the opponent [2.5.3.4, 2.5.1.14]"
text = "decided by the simulator, not by referees: a car-car contact is a crash when its impulse could change a car's speed by at least 0.30 m/s or the cars stay in contact for 2 s (touching below that is not penalized, as written); at fault is the car that drove into the other (closing speed larger by more than 0.1 m/s), else the car behind on the track, else the seed's draw; with more than two cars every pair is judged on its own; the race is not paused: only the at-fault car is placed 2 m behind the other car, at rest (further back in 0.5 m steps if that spot is taken), the other car is not stopped"
affects_result = true
[[deviations]]
id = "D5"
rule = "Race violations, warnings [2.5.1.14.6-8]"
text = "intent cannot be judged: every at-fault car-car crash is a warning; the third warning disqualifies the car from the race (head-to-head: the other car wins it; race: the car is retired, parked off the track and classified after the running cars); deliberate crowding and abnormal changes of direction are not judged beyond the crash rule"
affects_result = true
[[deviations]]
id = "D6"
rule = "Race penalties, crash into an obstacle [2.5.3.3]"
text = "decided by the simulator with the car-car test: the car is placed at rest at the side of the track 0.75 m before the obstacle, in its free gap, and held for 1 s; no warning; obstacles are fixed bodies (nothing to put back)"
affects_result = true
[[deviations]]
id = "D7"
rule = "Race penalties, crash into the track border [2.5.3.3]"
text = "the border is a continuous rigid wall: wall contact is not penalized, the car has to free itself (reverse); the time lost is the penalty; no manual handling"
affects_result = true
[[deviations]]
id = "D8"
rule = "Head-to-Head Race, no reconfiguration while the car moves [2.5.1.11]"
text = "program play: the player may change its program at any time, also while the car moves, and in the review after each heat"
affects_result = false
[[deviations]]
id = "D9"
rule = "Vehicle specifications, Inspection, Qualification, Time Trial, kill switch [2.1, 2.3, 2.5.1.6]"
text = "not applicable: identical simulated 1:10-scale cars (0.60 m, wheel-speed and steering servos, at most 4 m/s) with two RGB cameras and no LiDAR, on a flat seeded circuit (45-70 m, 2.45-2.95 m wide, a hairpin, an S-bend, a chicane and bends both ways, smallest centre-line radius 2.5 m) with continuous walls, 16 checkpoint lines and 2-4 fixed obstacles; the map is published in /spec as the rulebook's map"
affects_result = false
[[deviations]]
id = "D10"
rule = "Multi-car race (not in the RoboRacer rules; format and classification after the FIA 2026 Formula 1 Sporting Regulations)"
text = "format race: 4 cars (race.py supports 3-6), one one-lap heat per car; staggered grid of two columns 0.9 m apart, rotated by one slot per heat so every car starts once from every slot; a heat ends when all running cars but one have finished, 10 game s after the first finisher, or at the time limit; its order: finishers by finish time, then progress, then who reached it first, then the seed's draw; points 25-18-15-12-10-8 per place; classification by points, then count-back, then a draw fixed by the seed (no ties; the legacy task used the better place in the last heat, which with cars of equal pace always went to the car on pole in the last heat, a slot fixed by FIRST_PLAYER); a car that does not start in the start window, misses a review or is disqualified is retired (parked off the track, no more points) and classified after the running cars, the later retirement first"
affects_result = true

[formats.match]
seats = ["A"]
opponent = true                       # the scripted car (race.py car B, side "opponent"; RCB_LEVEL 1-4); success = winning the race
levels = [1, 2, 3, 4]
[formats.duel]
seats = ["A", "B"]
first = ["A", "B"]                    # FIRST_PLAYER starts on the outer side in heat 1
[formats.race]
seats = ["A", "B", "C", "D"]
first = ["A", "B", "C", "D"]          # FIRST_PLAYER is on pole in heat 1; the grid rotates by one slot per heat

[modes]
action_levels = ["low"]               # one level: the servo targets (speed, steering)
plays = ["program"]

[timing]
slowdown = 20                         # RCB_SLOWDOWN default (legacy match and duel x20; the race task: [[tasks]] slowdown)
start_timeout_s = 1800                # after the first seat started (match: from the service start)
ready_timeout_s = 300                 # each review (legacy: duel and race 300 s, the match had no limit)

[actions.cli]                         # `game drive SPEED STEERING`
low = { drive = ["speed", "steering"] }

[observation]
fields = ["heat", "heat_time_s", "awaiting_review", "race", "crashes_this_heat", "results", "own", "race_over",
          "race_winner", "classification"]
renderer = "mujoco"
frame_budget_ms = 250                 # one 240 x 160 tile (CPU, osmesa: about 35 ms)
columns = 1

[spec]                                # the rules (also /spec); the circuit map, limits and cameras come from plugin.spec()
real_time = "this sport is real time (where the generic text above says otherwise, this line holds): the world runs while you think; `game wait DT` (POST /wait {\"dt\": DT}, 0 < DT <= 1) lets it run DT game seconds; `game ready \"WHY\" \"PLAN\"` is due only in the review after each heat, not after each action; acts are never out of turn; a command holds until replaced and takes effect at the next 10 ms control step; one act in flight per seat (429); acting while the world is frozen is refused (409)"
action = "drive: {\"type\": \"drive\", \"speed\": S, \"steering\": D} (also `game drive S D`; a body without type is a drive): the target forward speed of the rear wheels S in [-1.5, 4.0] m/s (negative: reverse) and the front-wheel steering angle D in [-0.48, 0.48] rad (positive turns left); {\"type\": \"none\"} brakes and straightens the wheels; wheel motors and steering servos track the targets with finite force; numbers are rounded to 6 digits"
camera = "two cameras ride on your car: `front` 0.22 m ahead of the car's centre and about 0.40 m above the road, pitched 20 degrees down; `chase` 1.5 m behind and about 1.5 m above, pitched about 35 degrees down; both 70 degrees vertical field of view, 240 x 160 pixels. `game observe` shows the front camera; `game observe '{\"camera\": \"chase\"}'` (POST /observe {\"query\": {\"camera\": \"chase\"}}) the chase camera. /spec `camera` gives the mounts, /spec `cameras` the front camera's world pose when /spec was read (it moves with the car). An image shows the world at the reply's `step`"
track = "SI units, x/y on the flat ground, z up; a closed circuit of green asphalt with a yellow centre stripe, a white start/finish line and red/white walls on both sides, driven counter-clockwise: straights, a hairpin, an S-bend, a chicane and bends of both directions, 2.45-2.95 m wide, centre-line turn radius at least 2.5 m; 16 checkpoint lines across the full width, the 16th is the finish line, passed in order (reverse driving or cutting earns nothing); 2-4 fixed magenta obstacles (barrels and blocks), each leaving a free gap of at least 1.5 m on one side. The map is in /spec `geometry`: the centre line every about 0.5 m with the local width from the start/finish line in driving order, the lap length, the obstacles (position, yaw, size)"
car = "identical cars: 0.60 m long, 0.45 m wide over the wheels, 0.46 m wheelbase, 0.10 m wheels, rear-wheel drive, front-wheel steering (the car turns down to a 0.9 m radius); friction, finite motor force and contacts decide the motion; walls, obstacles and cars collide physically"
crashes = "touching is not penalized. A crash is a car-to-car contact that could change a car's speed by 0.30 m/s or more, or that lasts 2 s: the car that drove into the other (the larger speed towards the other car; if equal, the car behind) is at fault, is placed 2 m behind the other car at rest and gets a warning; the other car goes on; the third warning disqualifies. An obstacle contact that passes the same test is an obstacle crash: the car is placed at rest beside that obstacle, in its free gap, and held 1 s; no warning. Wall contact is not penalized, but you have to free your car yourself"
match_format = "match: seat A against a scripted car (side `opponent`, race.py car B) of level RCB_LEVEL 1-4 that cruises its line at 1.75 / 2.2 / 2.7 / 3.2 m/s, steers round the obstacles, passes a car ahead in its line and keeps its distance; up to three one-lap heats, the first to win two heats wins; heat 1: FIRST_PLAYER (A by default) starts on the outer side, heat 2 the sides switch, heat 3 the seed's draw decides who starts inside; a heat is won by the first car across the finish line after all 16 checkpoints; success = winning the race"
duel_format = "duel: seats A and B, the same rules as the match"
race_format = "race: four cars (seats A-D), four one-lap heats; staggered grid behind the line (slot 1, pole, inner side; FIRST_PLAYER on pole in heat 1), rotated by one slot per heat; a heat ends when all running cars but one have finished, 10 game s after the first finisher, or at the time limit; points per heat place 25, 18, 15, 12; classification by points, then more first places, then more second places, ..., then a draw fixed by the seed; a car that has not started when the start window closes, misses a review or is disqualified is retired (parked off the track, no more points, classified after the running cars); a valid race always has a full classification (<seat>_place)"
observation = "the state in every reply holds the heat and its game time (`heat_time_s`), your car (`own`: forward speed, command, grid slot and side inner or outer, held after an obstacle crash, retired), the race score (`race`: heats won or points, warnings, retired cars), the referee's crash calls of this heat (every car-to-car crash, your own obstacle crashes) and `results`: one entry per finished heat (winner, order, how it was decided, each car's checkpoints, finish time and obstacle crashes); no position, track progress or running order of any car during a heat, no depth or LiDAR, and no seed"
review = "after every heat the world freezes; each running car's player sends `game ready \"WHY\" \"PLAN\"` within the review limit (else: duel, it loses the race; race, its car is retired); the next heat starts when every running car has reviewed"

[tiebreaks]
order = ["disqualification", "heat_wins", "points", "count_back", "lot"]
text = "match and duel: a car that gets its third warning loses the race; otherwise the first car to win two heats wins (a heat goes to the first car across the finish line; with no finisher to more progress, then to the car that reached it first, then, as the last resort not from the rulebook, to a draw fixed by the seed). Race: the classification by points, then count-back (more first places, then more second places, ...), then, as the last resort not from the rulebook, a draw fixed by the seed"
last_resort_in_prompt = true

[[exploits]]
id = "E1"
text = "an out-of-range or malformed command is refused (HTTP 400) and changes nothing; a retired car cannot act (409)"
test = "test_exploit_bad_commands_are_refused"
[[exploits]]
id = "E2"
text = "reverse or wrong-way driving earns no checkpoint: the 16 lines count only in order and forwards"
test = "test_exploit_reverse_and_wrong_way_earn_no_checkpoint"
[[exploits]]
id = "E3"
text = "cutting through an obstacle is slower than driving round it (the obstacle crash holds the car)"
test = "test_exploit_cutting_through_obstacles_is_slower"
[[exploits]]
id = "E4"
text = "ramming loses: the car that drives into another is at fault, placed 2 m behind and warned; the third warning disqualifies it"
test = "test_exploit_ramming_is_penalised_and_disqualifies"
[[exploits]]
id = "E5"
text = "blocking or stalling never beats the scripted car (stopping in its lane, brake checks, never moving, reversing; levels 1 and 4)"
test = "test_exploit_blocking_or_stalling_never_beats_the_scripted_car"
[[exploits]]
id = "E6"
text = "the observation and /spec hold no car pose, track progress, running order or seed, no camera off the car, and another car's obstacle crash is not shown during the heat"
test = "test_exploit_world_state_hidden"
[[exploits]]
id = "E7"
text = "wedging cars together gains nothing: 2 s of contact is a crash and separates them"
test = "test_exploit_wedged_cars_are_separated"
[[exploits]]
id = "E8"
text = "no draws: equal finish times go to the seed's draw, idle heats are decided, the classification orders every car"
test = "test_exploit_no_draws"
[[exploits]]
id = "E9"
text = "a race car whose player never starts or misses a review is retired and the others race on; a retirement that leaves one car ends the race"
test = "test_exploit_retirement_and_racing_on"

[players]
reference = "reference"               # Sport.players() names: camera-only, wins the default configuration
reference_class = "builtin_players:Reference"
check = ["random"]

[fairness]
# Built-in reference cars on every seat. A reference duel takes about 100 s of CPU (six thousand control steps, a
# rendered front image per car every 5 steps), a four-car race about 300 s, so N stays at the contract's minimum of
# 20 per order (duel N = 40, race N = 80): realtime fairness only warns on a wide interval. The race format's "first
# side" is the pole car of heat 1 (fair rate 1/4).
policy = "reference"
matches_per_order = 20
max_advantage_pp = 5
mirror = "statistical"                # the cars are identical, but MuJoCo orders their contacts by body: no exact mirror

[official]
seeds = [1, 2, 3, 101, 111, 121, 202, 212, 222, 303, 313, 323, 404, 414, 424]   # duel / race: 1-3; match: the level's seeds (and 1-3)
levels = [1, 2, 3, 4]
first_any = true

[check]                               # tools/check time limits: the generic suite plays 32 four-car races (about 200 s
stage_timeout_s = 21600               # of CPU each) and the fairness check 80; an x10 race live takes about 40 min
live_player_timeout_s = 5400

[golden]
episodes = "golden"                   # the 11 legacy records of the golden-data store, converted (golden/convert.py)

[[tasks]]
id = "racing-match-wallclock-program-standard"
format = "match"
action_level = "low"
[[tasks]]
id = "racing-duel-wallclock-program-standard"
format = "duel"
action_level = "low"
[[tasks]]
id = "racing-race-wallclock-program-standard"
format = "race"
action_level = "low"
slowdown = 10                         # the legacy race task's default

[broadcast]                           # spectators: the legacy overview camera for the largest circuit, a frame every 4 steps
every = 4
camera = { name = "overview", pos = [0.0, -19.5, 26.0], lookat = [0.0, 0.0, 0.0], fovy_deg = 65, width = 640, height = 360 }

[capabilities]                        # docs/capabilities_zh.md: 2 primary, 1 secondary, 0 none
a1 = 2                                # 3D: the road, obstacles and other cars from the car's own camera, ground projection
a2 = 1                                # dynamics: speed in bends, tyre friction, contact consequences
a3 = 2                                # execution: closed-loop steering and speed at up to 4 m/s
a4 = 1                                # real time: the world runs while the program thinks (control latency)
b1 = 1                                # crash and warning rules, heat and classification rules
b2 = 2                                # racecraft: passing, keeping distance, avoiding blame, points strategy
b3 = 0
physics = ["inertia_latency", "friction_rolling"]
