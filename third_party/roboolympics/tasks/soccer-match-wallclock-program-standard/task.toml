schema_version = "1.3"
artifacts = [
  "/app/output/",
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/video.json", service = "sim" },
  { source = "/data/broadcast.jsonl", service = "sim" },
  { source = "/data/think_usage_A.json", service = "sim" },
  { source = "/data/think_calls_A.jsonl", service = "sim" },
]

[task]
name = "robot-coding-bench/soccer-match-wallclock-program-standard"
description = "Robot soccer 2 v 2, PROGRAM PLAY, match, action level low (eai-standard-realtime/1.0): robot soccer 2 v 2 under the RoboCup Humanoid Soccer League rules: four simulated Booster T1 humanoids (lower bodies on the released walking policy, held to the real robot's joint limits) and one ball on a boarded 10 x 7 m pitch with two goals, two halves of 5 minutes of game time, a penalty shoot-out when level; each robot takes a walk velocity command, stand or a swing-leg kick, and you see the game only through your robots' head cameras; in the `match` format you command both robots of team A against a scripted team, in the `duel` format another player commands team B, in the `team` format each robot has its own player and teammates talk only through the team channel, in the `team_match` format each robot of team A has its own player against the scripted team; `match_overhead` and `duel_overhead` are match and duel seen through fixed overhead cameras instead of the head cameras. Generated from sports/soccer/sport.toml by tools/generate.py on the v0.2 core."
authors = [{ name = "RoboOlympics" }]
keywords = ["program-play", "soccer", "sports", "realtime", "vision", "roboolympics-v0.2"]

[metadata]
revision = "soccer-2v2-10+core-0.2"
author_name = "RoboOlympics"
category = "robotics-sports-arena"
task_type = "trajectory"
simulator = "MuJoCo 3.3.7 (2 ms physics steps, 20 ms control steps; four Booster T1 lower bodies on the released walking policy, a model-based swing kick and an in-walk kick, a ball calibrated to FIFA turf (bounce, rolling deceleration), the real T1's leg torques, torque-speed envelope and walking-command rate; robot-robot, robot-ball, goal and board contacts)"
robot = "booster_t1"
family = "soccer_match"
mode = "standard"
protocol = "eai-standard-realtime/1.0"
play = "program"
action_level = "low"
oracle = "full"
oracle_evidence = "solution/: the sport's reference player (camera images and /spec only); tools/check runs it live and it wins the default configuration"
parameters = "RCB_SEED, RO_RENDERER (the players' image renderer)"
expert_time_estimate_hours = 0.5

[[seats]]
name = "A"
service = "player"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 600); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; [ x$RCB_RENDER_VIDEO = x1 ] && for i in $(seq 1 300); do [ -f /data/video.json ] && break; sleep 1; done; cat /data/final.json | head -c 2000"
timeout_sec = 1080

[agent]
timeout_sec = 10800.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 1024
