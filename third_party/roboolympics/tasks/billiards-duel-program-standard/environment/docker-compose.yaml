# Generated by tools/generate.py from the sport's sport.toml (do not edit). The sim sidecar runs the
# v0.2 core (one metering proxy per seat on 18090 + i; the model credentials live only here); each seat
# shares a network only with sim (internal: no internet), plus egress while Harbor installs its agent.
# Anti-cheat (audit 2026-10-08): the seat networks run with an isolated gateway (no route to the host's
# services), seats and sim drop NET_RAW (no raw sockets, no SO_MARK) and sim does not forward packets.
services:
  main:
    depends_on: [sim]
  sim:
    image: ghcr.io/mll-lab-nu/eai-olympiad-billiards:0.1.0
    volumes:
      - ./sim:/srv:ro
    working_dir: /srv
    command: python3 /srv/core/launch.py
    cpus: 4
    mem_limit: 8g
    pids_limit: 256
    cap_drop: [NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "0"
    networks: [default, net_a, net_b]
    environment:
      RCB_DATA: "/data"
      MUJOCO_GL: "osmesa"
      PYOPENGL_PLATFORM: "osmesa"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      RO_PLUGIN: "/srv/sport/plugin.py"
      RO_SPORT: "billiards"
      RO_FORMAT: "duel"
      RO_SEATS: "A,B"
      RO_SEED: "${DUEL_SEED:-1}"
      RO_SEED_SALT: "${RCB_SEED_SALT:-}"
      RO_SEED_INDEX: "${RCB_SEED_INDEX:-}"
      RO_FIRST: "${FIRST_PLAYER:-A}"
      RO_LEVEL: "${RCB_LEVEL:-}"
      RO_RENDERER: "${RO_RENDERER:-mujoco}"
      RCB_ACTION_LEVEL: "low"
      RCB_PLAY: "program"
      RCB_ACT_RULE: "program"
      CLOCK_S: "3600"
      START_TIMEOUT_S: "1800"
      READY_TIMEOUT_S: "300"
      THINK_RETRY_WAITS_S: ""
      SEAT_HOSTS: "A=seat_a,B=seat_b"
      RCB_RENDER_VIDEO: "${RCB_RENDER_VIDEO:-1}"
      RCB_BROADCAST: "${RCB_BROADCAST:-1}"
      RO_REPLAY_TIMEOUT_S: "600"
      RCB_VIDEO_TIMEOUT_S: "300"
      RO_VIDEO_RENDERER: "${RO_VIDEO_RENDERER:-}"
      PLAYER_MODE_A: "${PLAYER_MODE_A:-${RCB_PLAYER_MODE:-model}}"
      RO_SEAT_SELECT_A: "${RO_SEAT_SELECT_A:-}"
      RO_SEAT_ENV_THINK_OPENAI_ROUTE_A: "${THINK_OPENAI_ROUTE_A:-}"
      RO_SEAT_ENV_THINK_MODEL_A: "${THINK_MODEL_A:-}"
      RO_SEAT_ENV_THINK_CHATGPT_MODEL_A: "${THINK_CHATGPT_MODEL_A:-}"
      RO_SEAT_ENV_AZURE_AI_API_KEY_A: "${AZURE_AI_API_KEY_A:-}"
      RO_SEAT_ENV_AZURE_AI_ENDPOINT_A: "${AZURE_AI_ENDPOINT_A:-}"
      RO_SEAT_ENV_AZURE_DEPLOYMENTS_A: "${AZURE_DEPLOYMENTS_A:-}"
      RO_SEAT_ENV_AZURE_SOL_API_KEY_A: "${AZURE_SOL_API_KEY_A:-}"
      RO_SEAT_ENV_AZURE_SOL_DEPLOYMENTS_A: "${AZURE_SOL_DEPLOYMENTS_A:-}"
      RO_SEAT_ENV_AZURE_SOL_ENDPOINT_A: "${AZURE_SOL_ENDPOINT_A:-}"
      RO_SEAT_ENV_CLAUDE_CODE_OAUTH_TOKEN_A: "${CLAUDE_CODE_OAUTH_TOKEN_A:-}"
      RO_SEAT_ENV_CLAUDE_CODE_OAUTH_TOKEN_2_A: "${CLAUDE_CODE_OAUTH_TOKEN_2_A:-}"
      RO_SEAT_ENV_CODEX_ACCESS_TOKEN_A: "${CODEX_ACCESS_TOKEN_A:-}"
      RO_SEAT_ENV_CODEX_ACCOUNT_ID_A: "${CODEX_ACCOUNT_ID_A:-}"
      RO_SEAT_ENV_OPENROUTER_API_KEY_A: "${OPENROUTER_API_KEY_A:-}"
      PLAYER_MODE_B: "${PLAYER_MODE_B:-${RCB_PLAYER_MODE:-model}}"
      RO_SEAT_SELECT_B: "${RO_SEAT_SELECT_B:-}"
      RO_SEAT_ENV_THINK_OPENAI_ROUTE_B: "${THINK_OPENAI_ROUTE_B:-}"
      RO_SEAT_ENV_THINK_MODEL_B: "${THINK_MODEL_B:-}"
      RO_SEAT_ENV_THINK_CHATGPT_MODEL_B: "${THINK_CHATGPT_MODEL_B:-}"
      RO_SEAT_ENV_AZURE_AI_API_KEY_B: "${AZURE_AI_API_KEY_B:-}"
      RO_SEAT_ENV_AZURE_AI_ENDPOINT_B: "${AZURE_AI_ENDPOINT_B:-}"
      RO_SEAT_ENV_AZURE_DEPLOYMENTS_B: "${AZURE_DEPLOYMENTS_B:-}"
      RO_SEAT_ENV_AZURE_SOL_API_KEY_B: "${AZURE_SOL_API_KEY_B:-}"
      RO_SEAT_ENV_AZURE_SOL_DEPLOYMENTS_B: "${AZURE_SOL_DEPLOYMENTS_B:-}"
      RO_SEAT_ENV_AZURE_SOL_ENDPOINT_B: "${AZURE_SOL_ENDPOINT_B:-}"
      RO_SEAT_ENV_CLAUDE_CODE_OAUTH_TOKEN_B: "${CLAUDE_CODE_OAUTH_TOKEN_B:-}"
      RO_SEAT_ENV_CLAUDE_CODE_OAUTH_TOKEN_2_B: "${CLAUDE_CODE_OAUTH_TOKEN_2_B:-}"
      RO_SEAT_ENV_CODEX_ACCESS_TOKEN_B: "${CODEX_ACCESS_TOKEN_B:-}"
      RO_SEAT_ENV_CODEX_ACCOUNT_ID_B: "${CODEX_ACCOUNT_ID_B:-}"
      RO_SEAT_ENV_OPENROUTER_API_KEY_B: "${OPENROUTER_API_KEY_B:-}"
      AZURE_AI_API_KEY: "${AZURE_AI_API_KEY:-}"
      AZURE_AI_ENDPOINT: "${AZURE_AI_ENDPOINT:-}"
      AZURE_DEPLOYMENTS: "${AZURE_DEPLOYMENTS:-}"
      AZURE_SOL_API_KEY: "${AZURE_SOL_API_KEY:-}"
      AZURE_SOL_DEPLOYMENTS: "${AZURE_SOL_DEPLOYMENTS:-}"
      AZURE_SOL_ENDPOINT: "${AZURE_SOL_ENDPOINT:-}"
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      CLAUDE_CODE_OAUTH_TOKEN_2: "${CLAUDE_CODE_OAUTH_TOKEN_2:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      THINK_OPENAI_ROUTE: "${THINK_OPENAI_ROUTE:-openrouter}"
  seat_a:
    build:
      context: ./seat
    depends_on: [sim]
    command: ["sh", "-c", "sleep infinity"]
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    cap_drop: [NET_RAW]
    networks: [net_a, egress_a]
    environment:
      SEAT: A
  seat_b:
    build:
      context: ./seat
    depends_on: [sim]
    command: ["sh", "-c", "sleep infinity"]
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    cap_drop: [NET_RAW]
    networks: [net_b, egress_b]
    environment:
      SEAT: B
networks:
  net_a:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  net_b:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  egress_a: {}
  egress_b: {}
