[task]
name = "robot-coding-bench/soccer_ssl-team-wallclock-program-standard"
description = "Wheeled robot soccer 5 v 5 (RoboCup SSL Division B), PROGRAM PLAY, team, action level high (eai-standard-realtime/1.0): wheeled robot soccer 5 v 5 under the RoboCup Small Size League rules (Division B): ten omnidirectional SSL robots after TIGERs Mannheim's v2020 (kicker, chip kicker, dribbler; their real speed, acceleration, kick and dribbler limits) and an orange golf ball on the 9 x 6 m field, two halves of 300 s of playing time, a shoot-out when level, an automatic referee for every rule an SSL auto-referee judges; you command your robots with three skills (move to a pose, optionally by a time and at a speed; kick flat or chipped along the robot's heading, now or the moment the ball reaches it; spin the dribbler) and see the game through the four overhead cameras of the shared vision, 40 ms late; in the `match` format you command the blue team against a scripted team, in the `duel` format another player commands the yellow team, in the `team` format each robot has its own player. Generated from sports/soccer_ssl/sport.toml by tools/generate.py on the v0.2 core."
authors = [{ name = "RoboOlympics" }]
keywords = ["program-play", "soccer_ssl", "sports", "realtime", "vision", "roboolympics-v0.2"]

[metadata]
revision = "soccer_ssl-1"
author_name = "RoboOlympics"
category = "robotics-sports-arena"
task_type = "trajectory"
simulator = "MuJoCo 3.3.7 (1 ms physics steps, 10 ms control steps; ten planar SSL robots (bodies/ssl_robot: the library's PlanarBase servo at the real limits, an impulse kicker behind a break beam, a contact dribbler with a capped grip); a golf ball sliding and rolling on carpet (condim 6, elliptic cone), chip bounces; robot-robot, robot-ball, wall and goal contacts)"
robot = "ssl_robot"
robot_configuration = "ssl_robot@ssl-1+bare#ba3ad264d897"
family = "soccer_ssl_team"
mode = "standard"
protocol = "eai-standard-realtime/1.0"
play = "program"
action_level = "high"
oracle = "full"
oracle_evidence = "solution/: the sport's reference player (camera images and /spec only); tools/check runs it live and it wins the default configuration"
parameters = "DUEL_SEED, FIRST_PLAYER, RO_RENDERER (the players' image renderer)"
expert_time_estimate_hours = 0.5

