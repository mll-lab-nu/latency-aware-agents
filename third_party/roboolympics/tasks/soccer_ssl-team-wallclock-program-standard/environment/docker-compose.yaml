# Generated by tools/generate.py from the sport's sport.toml (do not edit). The sim sidecar runs the
# v0.2 core (one metering proxy per seat on 18090 + i; the model credentials live only here); each seat
# shares a network only with sim (internal: no internet), plus egress while Harbor installs its agent.
# Anti-cheat (audit 2026-10-08): the seat networks run with an isolated gateway (no route to the host's
# services), seats and sim drop NET_RAW (no raw sockets, no SO_MARK) and sim does not forward packets.
services:
  main:
    depends_on: [sim]
  sim:
    image: ghcr.io/mll-lab-nu/eai-olympiad:0.1.0
    volumes:
      - ./sim:/srv:ro
    working_dir: /srv
    command: python3 /srv/core/launch.py
    cpus: 6
    mem_limit: 8g
    pids_limit: 256
    cap_drop: [NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "0"
    networks: [default, net_a0, net_a1, net_a2, net_a3, net_a4, net_b0, net_b1, net_b2, net_b3, net_b4]
    environment:
      RCB_DATA: "/data"
      MUJOCO_GL: "osmesa"
      PYOPENGL_PLATFORM: "osmesa"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      RO_PLUGIN: "/srv/sport/plugin.py"
      RO_SPORT: "soccer_ssl"
      RO_FORMAT: "team"
      RO_SEATS: "A0,A1,A2,A3,A4,B0,B1,B2,B3,B4"
      RO_SEED: "${DUEL_SEED:-1}"
      RO_SEED_SALT: "${RCB_SEED_SALT:-}"
      RO_SEED_INDEX: "${RCB_SEED_INDEX:-}"
      RO_SIDES: "A0=A,A1=A,A2=A,A3=A,A4=A,B0=B,B1=B,B2=B,B3=B,B4=B"
      RO_TEAM_CHANNEL: "${RO_TEAM_CHANNEL:-on}"
      RO_FIRST: "${FIRST_PLAYER:-A}"
      RO_LEVEL: "${RCB_LEVEL:-}"
      RO_SLOWDOWN: "${RCB_SLOWDOWN:-10}"
      RO_RENDERER: "${RO_RENDERER:-mujoco}"
      RCB_ACTION_LEVEL: "high"
      RCB_PLAY: "program"
      RCB_ACT_RULE: "program"
      CLOCK_S: "3600"
      START_TIMEOUT_S: "1800"
      READY_TIMEOUT_S: "600"
      THINK_RETRY_WAITS_S: ""
      SEAT_HOSTS: "A0=seat_a0,A1=seat_a1,A2=seat_a2,A3=seat_a3,A4=seat_a4,B0=seat_b0,B1=seat_b1,B2=seat_b2,B3=seat_b3,B4=seat_b4"
      RCB_RENDER_VIDEO: "${RCB_RENDER_VIDEO:-1}"
      RCB_BROADCAST: "${RCB_BROADCAST:-1}"
      RO_REPLAY_TIMEOUT_S: "1800"
      RCB_VIDEO_TIMEOUT_S: "1800"
      RO_VIDEO_RENDERER: "${RO_VIDEO_RENDERER:-}"
      LP_NUM_THREADS: "2"
      PLAYER_MODE_A0: "${PLAYER_MODE_A0:-${RCB_PLAYER_MODE:-model}}"
      RO_SEAT_SELECT_A0: "${RO_SEAT_SELECT_A0:-}"
      RO_SEAT_ENV_THINK_OPENAI_ROUTE_A0: "${THINK_OPENAI_ROUTE_A0:-}"
      RO_SEAT_ENV_THINK_MODEL_A0: "${THINK_MODEL_A0:-}"
      RO_SEAT_ENV_THINK_CHATGPT_MODEL_A0: "${THINK_CHATGPT_MODEL_A0:-}"
      RO_SEAT_ENV_AZURE_AI_API_KEY_A0: "${AZURE_AI_API_KEY_A0:-}"
      RO_SEAT_ENV_AZURE_AI_ENDPOINT_A0: "${AZURE_AI_ENDPOINT_A0:-}"
