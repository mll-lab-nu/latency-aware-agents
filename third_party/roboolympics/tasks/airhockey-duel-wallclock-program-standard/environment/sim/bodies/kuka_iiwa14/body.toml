# KUKA LBR iiwa 14 R820: the arm of air hockey (its MJCF is the Air Hockey Challenge model of the iiwa 14, MIT). KUKA
# publishes the axis ranges, maximum velocities and maximum torques; it publishes no joint acceleration, jerk or
# torque-rate limits (the Sunrise controller plans its own). The accelerations are the Air Hockey Challenge's, the
# only values tied to the real iiwa 14 (S2); the jerks an estimate (audit 2026-10-08 section 5, approved); the
# torque rate stays unset (None in bodies/limits.py: not enforced). Data only.

[body]
name = "kuka_iiwa14"
title = "KUKA LBR iiwa 14 R820"
revision = "iiwa14-limits-2"            # iiwa14-limits-2: accelerations (S2) and jerks (estimate) added
kind = "arm"

[limits.arm]                           # axes A1..A7 (S1, "Axis data", LBR iiwa 14 kg column); degrees converted to rad
range_lo_rad = [-2.96706, -2.09440, -2.96706, -2.09440, -2.96706, -2.09440, -3.05433]    # -170, -120, -170, -120, -170, -120, -175 deg
range_hi_rad = [2.96706, 2.09440, 2.96706, 2.09440, 2.96706, 2.09440, 3.05433]
speed_rad_s = [1.48353, 1.48353, 1.74533, 1.30900, 2.26893, 2.35619, 2.35619]          # 85, 85, 100, 75, 130, 135, 135 deg/s
accel_rad_s2 = [14.8353, 14.8353, 17.4533, 13.0900, 22.6893, 23.5619, 23.5619]     # 10 x the speed limit (S2)
jerk_rad_s3 = [741.77, 741.77, 872.67, 654.50, 1134.47, 1178.10, 1178.10]             # 50 x the acceleration (estimate)
torque_nm = [320.0, 320.0, 176.0, 176.0, 110.0, 40.0, 40.0]
[limits.arm.source]
speed_rad_s = "S1"
accel_rad_s2 = "S2 (Air Hockey Challenge env_base.py joint_acc_limit = 10 x the velocity limit: a competition constant of the real iiwa 14 setup; KUKA publishes none)"
jerk_rad_s3 = "ESTIMATE: 50 x the acceleration (full acceleration within 20 ms; no source anywhere; audit D3, approved)"
torque_nm = "S1"
torque_rate_nm_s = "NOT PUBLISHED: neither KUKA nor the Air Hockey Challenge gives one (recorded, not limited)"

[sources]
S1 = "KUKA Roboter GmbH, brochure 'Sensitive robotics - LBR iiwa' (EN, (c) 2017 KUKA Roboter GmbH), technical data table 'Axis data / Range of motion, Maximum torque, Maximum velocity' for the LBR iiwa 7 R800 and LBR iiwa 14 R820"
S2 = "Air Hockey Challenge (MIT), air_hockey_challenge/environments/iiwas/env_base.py joint_acc_limit (commit 34729081): the iiwa 14 of the challenge's real-robot stage, https://github.com/AirHockeyChallenge/air_hockey_challenge"
