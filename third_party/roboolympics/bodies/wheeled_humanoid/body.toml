# The RoboOlympics wheeled humanoid (bodies/README.md, docs/benchmarks/unified-body-20261007.md): a humanoid upper
# body (two 7-DOF arms, a torso on a lifting column, a head with cameras) on an omnidirectional base. The model is
# MuJoCo Menagerie's Rainbow Robotics RB-Y1 (RBY1-M, mecanum base); every limit below is the manufacturer's where one
# is published (sources at the end), else derived and marked so. Data only: body.py reads it.

[body]
name = "wheeled_humanoid"
title = "wheeled humanoid (Rainbow Robotics RB-Y1 M)"
revision = "wh-4"                      # bump on any change that alters play (wh-2: stereo head camera, fixed neck yaw;
                                       # wh-3: the real limits enforced by bodies/servo.py, 2026-10-08)
                                       # wh-4: self-collision, [self_collision]; the free arm's rest roll 0.40 (bodies/selfcollision.py, 2026-10-09)
model = "model.xml"                    # tools/make_model.py from the Menagerie model (provenance, changes)
meshes = { standard = "meshes", fine = "meshes_fine", "25k" = "meshes_25k" }   # standard: about 50 k faces (simulation, players' cameras,
                                       # in-task videos); fine: the Menagerie meshes, 162 k faces (display renders)
# "25k": the players' level of detail (25 k faces, in git; bodies/lod.py from meshes_fine/,
# user decision D1 2026-10-08): mount(..., lod="25k") draws the players' images with the real robot's appearance
license = "Apache-2.0 (LICENSE; MuJoCo Menagerie rainbow_robotics_rby1, derived from Rainbow Robotics' RB-Y1 URDF)"
mass_kg = 135.1                        # the Menagerie model's masses (datasheet RBY1-M: 170 kg, of which the battery
                                       # and mecanum base 90 kg; the base is planar-jointed, so only its mass matters)
height_m = 1.40                        # at full lift (datasheet 1,400 mm)

[dof]                                  # the body's controlled degrees of freedom (u), in this order
names = ["base_x", "base_y", "base_yaw", "lift", "waist",
         "arm_0", "arm_1", "arm_2", "arm_3", "arm_4", "arm_5", "arm_6"]
# base_x / base_y: the base's displacement from its mount, along the mount's forward / left axes (m); base_yaw (rad);
# lift: the lifting column's angle a (rad): torso_1 = a, torso_2 = -2a, torso_3 = a keeps the chest upright and moves
# it straight down by 0.70 (1 - cos a) m (two 0.35 m links); waist: torso_5 (yaw); arm_i: the hand arm's joints.
# The other arm holds its rest pose (body.py Rig).

[limits.base]                          # the planar base (servo on base_x, base_y, base_yaw; bodies/servo.py PlanarBase)
mode = "norm"                          # the translation's limits on the norm (the mecanum base drives any direction)
speed_m_s = 1.5
accel_m_s2 = 2.0
jerk_m_s3 = 50.0
yaw_rate_rad_s = 2.0
yaw_accel_rad_s2 = 1.0
yaw_jerk_rad_s3 = 25.0
force_n = 600.0                        # servo force limit per axis (traction ~0.45 g x 135 kg; the planar joints'
yaw_torque_nm = 300.0                  # motors stand in for the wheels)
[limits.base.source]
speed_m_s = "S1 (datasheet 'Base speed 1.5 m/s')"
accel_m_s2 = "DERIVED: no published value (the SDK's ramp default x 5.0 m/s^2, S5, is a command option, not a limit); about half the tip-over limit g x 0.245 m (half track) / 0.55 m (CoM height) = 4.4 m/s^2, below mecanum traction (~0.3 g)"
jerk_m_s3 = "ESTIMATE: 25 x the acceleration (full acceleration within 40 ms, a common servo-drive ramp; audit 2026-10-08 section 5, approved)"
yaw_rate_rad_s = "DERIVED: mecanum kinematics give 1.5 m/s / (0.245 + 0.245) m = 3.1 rad/s; 2.0 kept"
yaw_accel_rad_s2 = "S5 (se2_velocity_command acceleration_limit default, angular 1.0 rad/s^2; audit D4)"
yaw_jerk_rad_s3 = "ESTIMATE: 25 x the yaw acceleration (as the translation)"

[limits.lift]                          # u: the lift angle a; its joints torso_1 = a, torso_2 = -2a, torso_3 = a
range_rad = [0.0, 1.309]               # a in [0, 1.309]: torso_2 = -2a reaches its URDF limit -2.618; the chest moves
                                       # down 0.518 m (datasheet "vertical movement more than 50 cm", S1/S3)
speed_rad_s = 1.0472
accel_rad_s2 = 3.75
jerk_rad_s3 = 187.5
torque_nm = [270.0, 270.0, 120.0]      # torso_1, torso_2, torso_3 (S2)
[limits.lift.source]
speed_rad_s = "S2 (torso_2 moves at 2a: its URDF velocity 2.094 rad/s halves)"
accel_rad_s2 = "S2 x 1.5 (S5): the URDF's torso acceleration 5 rad/s^2 at the controller's largest acceleration_limit_scaling 1.5 = 7.5 rad/s^2 on torso_2, halved"
jerk_rad_s3 = "ESTIMATE: 50 x the acceleration (no published jerk; the rate used for every unpublished arm jerk, audit section 5)"
torque_nm = "S2"

[limits.waist]
range_rad = [-2.35619449, 2.35619449]  # torso_5 (S2)
speed_rad_s = 3.141592654
accel_rad_s2 = 7.5
jerk_rad_s3 = 375.0
torque_nm = 120.0
[limits.waist.source]
speed_rad_s = "S2"
accel_rad_s2 = "S2 x 1.5 (S5): URDF 5 rad/s^2 x the largest acceleration_limit_scaling 1.5"
jerk_rad_s3 = "ESTIMATE: 50 x the acceleration"
torque_nm = "S2"

[limits.arm]                           # joints 0..6 of either arm (S2: URDF <limit velocity effort acceleration>)
speed_rad_s = [3.141592654, 3.141592654, 3.141592654, 3.141592654, 6.283185308, 6.283185308, 2.094395102]
accel_rad_s2 = [15.0, 15.0, 15.0, 15.0, 15.0, 15.0, 15.0]
jerk_rad_s3 = [750.0, 750.0, 750.0, 750.0, 750.0, 750.0, 750.0]
torque_nm = [70.0, 70.0, 70.0, 40.0, 10.0, 10.0, 8.0]
reach_m = 0.60                         # shoulder to wrist (datasheet "Arm reach 600 mm (to wrist) + hand", S1)
payload_kg = 3.0                       # per arm (S1)
[limits.arm.source]
speed_rad_s = "S2"
accel_rad_s2 = "S2 x 1.5 (S5): the URDF's arm acceleration 10 rad/s^2 at the controller's largest acceleration_limit_scaling 1.5 (audit D4, approved 2026-10-08)"
jerk_rad_s3 = "ESTIMATE: 50 x the acceleration (full acceleration within 20 ms; no published jerk)"
torque_nm = "S2"

[controller]                           # body.py Rig.apply -> bodies/servo.py Servo: the 10 ms targets, interpolated,
                                       # through the jerk-limited setpoint generator (the limits above); tau = M(q)
                                       # qdd_sp + kp (q_sp - q) + kd (qd_sp - qd) + gravity/Coriolis compensation,
                                       # clipped at the torque limits, every 1 ms physics step
[controller.kp]
base = 200000.0
yaw = 4000.0
lift = [6000.0, 6000.0, 3000.0]
waist = 3000.0
arm = [6000.0, 6000.0, 4000.0, 4000.0, 800.0, 800.0, 400.0]
[controller.kd]                        # wh-3: the arm's kd quartered (as the R1 Pro's): the servo's damping is explicit
base = 10000.0                         # at 1 ms and wh-2's 150 / 80 N m s rang (limit cycles at the torque limit) where
yaw = 600.0                            # the shoulder joints' inertia is small (bodies/conformance.py: 7 of 12 random
lift = [300.0, 300.0, 120.0]           # poses off by 0.01-0.02 rad; quartered: none)
waist = 120.0
arm = [37.5, 37.5, 20.0, 15.0, 1.0, 1.0, 0.75]

[controller.step]
control_dt_s = 0.01
physics_dt_s = 0.001

[rest]                                 # the ready pose (u without the base); the other arm holds rest_other_arm
lift = 0.635                           # a forehand ready pose with a hand on the right wrist: the upper arm out to
waist = 0.206                          # the side, the forearm across, the tool hanging below the wrist about 0.4 m
arm = [0.057, -1.318, -0.19, -1.382, -2.355, 1.552, 0.123]   # ahead of the base centre; every joint >= 0.37 rad
                                       # from its limits (tools: the planner's IK with random seeds)
other_arm = [0.35, 0.40, 0.0, -1.70, 0.0, 0.0, 0.0]    # the free arm, elbow bent in front of the body (wh-4:
                                       # shoulder roll 0.30 -> 0.40: the upper arm's collision capsule cleared the chest's
                                       # by -0.4 cm, 1.2 cm now, [self_collision])

[mounts]                               # what a sport can attach and where
wrist = "the body <arm>_mount: the URDF tool frame (0.1087 m along -z of link_<arm>_arm_6), +z away from the wrist"
cameras = ["head_left", "head_right"]  # a stereo pair on the head, 12 cm apart (a ZED 2i class camera: 120 mm baseline), 70 degree vertical field of view, looking forward
head_pitch_rad = 0.0                   # default; a sport may tilt (head_pitch) and turn (head_yaw) the fixed neck; the
                                       # RB-Y1's neck joints (head_0, head_1) are fixed in this model: not commandable


# ---------------------------------------------------------------------------------------------------------------------
# Self-collision (real limits B0, 2026-10-09: the real arm cannot pass through its own body, so the simulated one
# cannot either). bodies/selfcollision.py turns this into MuJoCo <pair>s at mount(): parts by body name (without the
# prefix; a body matching nothing takes its parent's part, one below an arm is that arm's tool), the rules say which
# parts touch, the exclusions say which pairs do not and why. Automatic exclusions (not listed): geoms of one rigid
# group (a link, its mount, its tool) and of two rigid groups joined by one joint (the joint's housing).
# Recorded during play (rig.self_collisions()): events, time in contact, peak force; above warn_force_n a warning.
# No penalty yet (the sports decide). Check: python -m bodies.selfcollision check <robot> (CI: check-robot-limits).
[self_collision]
parts.left_arm = "link_left_arm_[0-6]"
parts.right_arm = "link_right_arm_[0-6]"
parts.body = "base|wheel_(fr|fl|rr|rl)_link|link_torso_[0-5]|NECK_0|link_head_[12]"
rules = { arm_body = true, arm_arm = true, tool_own_arm = true, same_arm = false }
warn_force_n = 20.0                    # a self-collision event above this peak normal force is a warning
[self_collision.source]
warn_force_n = "ESTIMATE: no vendor publishes a self-contact threshold for this robot; the Franka's collision threshold (20 N, bodies/franka_panda S4) for every body, so one rule reads the same everywhere"
[[self_collision.exclude]]
bodies = ["link_torso_5", "link_(left|right)_arm_1"]
reason = "shoulder housing: arm_1 (the second shoulder link) turns inside the chest's shoulder socket; the chest's fitted collision capsule (r 0.149 m) covers the socket, so the two overlap by up to 3 cm in 29% of legal poses whatever the arm does (the render meshes overlap 1.8 cm at the mount too: a model artefact, not a collision); the upper arm (arm_2) onwards stays enabled"

[sources]
S1 = "Rainbow Robotics, RB-Y1 product page, technical specifications: https://rainbow-robotics.com/en/products/rb-y1/ (base speed 1.5 m/s; arm 7 DOF x 2, payload 3 kg, reach 600 mm to wrist + hand; 600 x 690 x 1,400 mm; RBY1-M 170 kg)"
S2 = "Rainbow Robotics, rby1-sdk models/rby1m/urdf/model.urdf (joint <limit> lower, upper, velocity, effort, acceleration: arm 10 rad/s^2, torso 5 rad/s^2), commit ac7e83056e07: https://github.com/RainbowRobotics/rby1-sdk"
S3 = "Rainbow Robotics press release (RB-Y1 unveiling): vertical movement of more than 50 cm, https://www.plantautomation-technology.com/news/rainbow-robotics-unveils-rb-y1-koreas-first-bimanual-mobile-manipulator"
S4 = "MuJoCo Menagerie rainbow_robotics_rby1 (Apache-2.0), commit f054586a8e90465d49ee5be15335c4a0c7f57caf: https://github.com/google-deepmind/mujoco_menagerie/tree/main/rainbow_robotics_rby1"
S5 = "Rainbow Robotics, RB-Y1 developer documentation, controller parameters (default.acceleration_limit_scaling 1.0, range 0.01-1.5; default.se2_velocity_command.acceleration_limit [1.0, 5.0, 99.0] = angular, x, y), read 2026-10-08: https://rainbowrobotics.github.io/rby1-dev/sdk/controllers/generated/parameter.html"
