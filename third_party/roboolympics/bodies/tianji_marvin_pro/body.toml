# The RoboOlympics Tianji Marvin Pro (bodies/README.md, docs: olympiad_review bodies_new/tianji_marvin_pro_zh.md): the
# stationary dual-arm robot of Guangdong TianJi Intelligent Systems (天机智能): two 7-DOF Marvin M6 arms mounted
# sideways on a fixed stand (floor plate, column, chest, head camera), mains powered, no mobile base, no lift, no
# waist. The model is the vendor's RoboTwin embodiment (KLMmotion/marvin_pro_robotwin, MIT), converted by
# tools/make_model.py; every limit below is the manufacturer's where one is published (sources at the end), else
# derived and marked so. Data only: body.py reads it.

[body]
name = "tianji_marvin_pro"
title = "Tianji Marvin Pro (stationary dual-arm, two Marvin M6 arms)"
revision = "mp-3"                      # bump on any change that alters play (mp-2: the SDK accelerations enforced)
                                       # mp-3: self-collision, [self_collision] (bodies/selfcollision.py, 2026-10-09)
status = "test-use"                    # TEST USE ONLY (bodies/tianji_marvin_pro/README.md): the licence of the vendor
                                       # model needs Tianji's written confirmation before any public release
model = "model.xml"                    # tools/make_model.py from the vendor URDF (provenance, changes)
meshes = { standard = "meshes", fine = "meshes_fine", "25k" = "meshes_25k" }   # standard: 61 k faces (simulation, players' cameras, videos);
                                       # fine: the URDF's STL meshes, 474 k faces, 23 MB: NOT in git (regenerate with
                                       # tools/make_model.py; body.py falls back to standard when they are missing)
# "25k": the players' level of detail (30 k faces, in git; bodies/lod.py from meshes_fine/,
# user decision D1 2026-10-08): mount(..., lod="25k") draws the players' images with the real robot's appearance
license = "MIT (LICENSE; KLMmotion/marvin_pro_robotwin, the vendor-affiliated Tianji Kernel Mind fork of RoboTwin; the repository's MIT licence, Copyright 2025 Tianxing Chen, covers the Marvin Pro URDF and meshes it publishes)"
mass_kg = 41.3                         # the URDF's masses (stand 18.8 kg, each arm 11.2 kg; datasheet: system about
                                       # 80 kg with the computer and power supply, S1; the stand is fixed, only the arms'
                                       # masses matter)
height_m = 1.42                        # the stand's head top above the floor (URDF mesh; no datasheet value)
shoulder_height_m = 1.203              # the J1/J2 centres above the floor, 0.20 m left / right of the centre (URDF)

[dof]                                  # the controlled degrees of freedom (u): the wheeled humanoid's layout, so that
names = ["base_x", "base_y", "base_yaw", "lift", "waist",   # bodies/control/wholebody.py and the sports' command layers work
         "arm_0", "arm_1", "arm_2", "arm_3", "arm_4", "arm_5", "arm_6"]   # unchanged
# base_x, base_y, base_yaw, lift, waist: NOT on this robot: always 0 (range 0 for the base, +-0.001 for lift and waist
# so that the planner's joint box is not empty; speed 0 / 1e-6: a row that moves them is refused by Rig.check);
# arm_i: the hand arm's joints J1..J7. The other arm holds its rest pose (body.py Rig).

[limits.base]                          # no base: the stand is fixed to the floor
kind = "absent"                        # bodies/servo.py: nothing to limit (Rig.check refuses any base motion)
speed_m_s = 0.0
accel_m_s2 = 1.0                       # placeholder (a speed of 0 is the binding limit; > 0 keeps the brake maths finite)
yaw_rate_rad_s = 0.0
yaw_accel_rad_s2 = 1.0

[limits.lift]                          # no lift (the vertical workspace 0.6-1.8 m of S1 is the arms' reach)
kind = "absent"
range_rad = [-0.001, 0.001]
speed_rad_s = 1e-6
torque_nm = [0.0, 0.0, 0.0]

[limits.waist]                         # no waist
kind = "absent"
range_rad = [-0.001, 0.001]
speed_rad_s = 1e-6
torque_nm = 0.0

[limits.arm]                           # J1..J7 of either arm
# ranges: model.xml (the URDF's, S2, intersected with the controller configuration's, S3):
#   J1 +-170, J2 -120..-5.7, J3 +-170, J4 -145..-5.7, J5 +-170, J6 +-60, J7 +-90 degrees
speed_rad_s = [3.141592654, 3.141592654, 3.141592654, 3.141592654, 3.141592654, 3.141592654, 3.141592654]
accel_rad_s2 = [7.854, 7.854, 15.708, 15.708, 15.708, 15.708, 15.708]
jerk_rad_s3 = [392.7, 392.7, 785.4, 785.4, 785.4, 785.4, 785.4]
torque_nm = [108.0, 108.0, 66.0, 66.0, 18.0, 18.0, 18.0]
reach_m = 0.696                        # Marvin M6 working radius (S1; DH: 0.287 + 0.314 + 0.095 m, S3)
payload_kg = 6.0                       # Marvin M6 rated payload (S1; M6 Lite 5 kg / 615 mm)
tcp_speed_m_s = 2.0                    # Marvin M6S series max TCP speed (S4, secondary source; not enforced)
[limits.arm.source]
speed_rad_s = "S1, S3 (180 deg/s every joint: the datasheet and the SDK's controller configuration column 7; the URDF's velocity 10 is a placeholder)"
accel_rad_s2 = "S3 (controller configuration column 8: 450 deg/s^2 J1-J2, 900 deg/s^2 J3-J7; enforced since mp-2)"
jerk_rad_s3 = "ESTIMATE: 50 x the acceleration (the SDK configuration has no jerk; audit section 5)"
torque_nm = "S2 (URDF <limit effort>; no datasheet value: an estimate in effect)"

[controller]                           # body.py Rig.apply -> bodies/servo.py Servo (jerk-limited setpoints, PD +
[controller.kp]                        # inertia feed-forward + gravity/Coriolis, clipped at the torques, every 1 ms)
arm = [6000.0, 6000.0, 4000.0, 4000.0, 800.0, 800.0, 400.0]
[controller.kd]
arm = [150.0, 150.0, 80.0, 60.0, 4.0, 4.0, 3.0]
[controller.step]
control_dt_s = 0.01
physics_dt_s = 0.001

[rest]                                 # the ready pose (u[3:]: lift, waist, arm); the other arm holds rest_other_arm
lift = 0.0
waist = 0.0
arm = [0.8287, -0.9537, -1.4822, -1.7038, 2.6777, 0.7599, -1.0538]   # tools/rest_pose.py 0.40 -0.50 1.00 1 0 0:
                                       # a hand's centre 0.40 m ahead, 0.50 m right, 1.00 m high, its face normal (+x)
                                       # forward; joints >= 0.29 rad from their limits (the wrist J5-J7 is the tight part)
other_arm = [0.0375, -0.5495, 2.0485, -2.0821, -0.7779, -0.0355, 0.7194]  # tools/rest_pose.py: the free arm
                                       # hanging beside the stand, its mount 0.05 m behind the centre, 0.40 m left, 0.85 m
                                       # high, pointing down (clear of a table in front; joints >= 0.45 rad from limits)

[mounts]
wrist = "the body <arm>_mount at the URDF flange frame flange_<L/R> (0.088 m beyond J7 along the arm), +z away from the wrist"
cameras = ["head_left", "head_right"]  # the head camera (Intel RealSense D435, S1): a stereo pair 5 cm apart, 58 degree
                                       # vertical field of view, on the front of the stand's head block, 1.37 m high
head_pitch_rad = 0.5                   # default tilt down; a sport may tilt (head_pitch) and turn (head_yaw) it (the
                                       # real head is rigid)


# ---------------------------------------------------------------------------------------------------------------------
# Self-collision (real limits B0, 2026-10-09: the real arm cannot pass through its own body, so the simulated one
# cannot either). bodies/selfcollision.py turns this into MuJoCo <pair>s at mount(): parts by body name (without the
# prefix; a body matching nothing takes its parent's part, one below an arm is that arm's tool), the rules say which
# parts touch, the exclusions say which pairs do not and why. Automatic exclusions (not listed): geoms of one rigid
# group (a link, its mount, its tool) and of two rigid groups joined by one joint (the joint's housing).
# Recorded during play (rig.self_collisions()): events, time in contact, peak force; above warn_force_n a warning.
# No penalty yet (the sports decide). Check: python -m bodies.selfcollision check <robot> (CI: check-robot-limits).
[self_collision]
parts.left_arm = "link_left_arm_[0-6]"
parts.right_arm = "link_right_arm_[0-6]"
parts.body = "base|head"
rules = { arm_body = true, arm_arm = true, tool_own_arm = true, same_arm = false }
warn_force_n = 20.0                    # a self-collision event above this peak normal force is a warning
[self_collision.source]
warn_force_n = "ESTIMATE: no vendor publishes a self-contact threshold for this robot; the Franka's collision threshold (20 N, bodies/franka_panda S4) for every body, so one rule reads the same everywhere"
[[self_collision.exclude]]
bodies = ["base", "link_(left|right)_arm_1"]
reason = "shoulder housing: arm_1 is the shoulder's second link (arm_0, its parent, hangs on the stand: excluded automatically); the stand chest's fitted box reaches over both shoulders, so it and arm_1 overlap at the ready pose (0.6 / 1.3 cm) and in 80% of legal poses; the upper arm (arm_2) onwards stays enabled"

[sources]
S1 = "TianJi Marvin Pro product page (distributor RoboticsCenter): 14 DOF (7 per arm), about 80 kg, arms M6 (6 kg, 696 mm) or M6 Lite (5 kg, 615 mm), max joint speed 180 deg/s, repeatability +-0.03 mm, 1 kHz EtherCAT, position / impedance / hybrid force control, cameras: 1 RealSense D435 + 2 SH5WG RGB + 2 wrist, vertical workspace 0.6-1.8 m, AC mains, no battery: https://www.roboticscenter.ai/store/product/tianji-marvin-pro"
S2 = "KLMmotion/marvin_pro_robotwin (Tianji Kernel Mind, MIT), assets/embodiments/tianji/marvin_robot.urdf, commit 1e30f003984ddb82d2994474b015f0933c131d94: https://github.com/KLMmotion/marvin_pro_robotwin"
S3 = "tianjizn/tianji-robot-SDK03 (Guangdong TianJi Intelligent Systems, Apache-2.0), branch Marvin_Pro, CommonConfig/ccs_m6_40.MvKDCfg (per joint: DH, range, max speed 180 deg/s, max acceleration 450/900 deg/s^2, identified dynamics): https://github.com/tianjizn/tianji-robot-SDK03/tree/Marvin_Pro"
S4 = "Marvin series selection article (secondary, from the vendor datasheets): M6S 6 kg class 11.45-13.1 kg, TCP speed 2 m/s, J2 +-120, J4 +60/-145 deg: https://www.163.com/dy/article/L3KTM7160556OZS9.html"
