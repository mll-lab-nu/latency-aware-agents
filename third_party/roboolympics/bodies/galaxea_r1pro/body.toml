# The Galaxea R1 Pro (bodies/README.md): a wheeled humanoid used in the BEHAVIOR Challenge (OmniGibson's R1Pro): two
# 7-DOF Galaxea A2 arms on a 4-DOF torso (three pitch joints that lift and tilt, a yaw waist) on a three-wheel
# vector-steering chassis, a fixed head with a stereo camera. The model is Galaxea's own URDF (GalaxeaManipSim,
# Apache-2.0) converted by tools/make_model.py; every limit below is the manufacturer's where one is published
# (sources at the end), else derived and marked so. Same controlled vector and API as bodies/wheeled_humanoid (RB-Y1),
# so the whole-body planner and the wheeled sports' code drive it unchanged. Data only: body.py reads it.

[body]
name = "galaxea_r1pro"
title = "wheeled humanoid (Galaxea R1 Pro)"
revision = "r1p-3"                     # bump on any change that alters play (r1p-2: the SDK limits, bodies/servo.py)
                                       # r1p-3: self-collision, [self_collision] (bodies/selfcollision.py, 2026-10-09)
model = "model.xml"                    # tools/make_model.py from Galaxea's URDF (provenance, changes)
meshes = { standard = "meshes", fine = "meshes_fine", "25k" = "meshes_25k" }   # standard: 43 k faces (simulation, players' cameras, videos),
                                       # checked in; fine: the URDF's meshes, 473 k faces, 23 MB: NOT checked in
                                       # (tools/make_model.py writes them; without them lod "fine" uses "standard")
# "25k": the players' level of detail (27 k faces, in git; bodies/lod.py from meshes_fine/,
# user decision D1 2026-10-08): mount(..., lod="25k") draws the players' images with the real robot's appearance
license = "Apache-2.0 (LICENSE; OpenGalaxea/GalaxeaManipSim, Copyright 2025 Galaxea: the R1 Pro URDF and meshes)"
mass_kg = 90.5                         # the URDF's masses without the grippers (datasheet: 96 kg with battery, S1)
height_m = 1.70                        # standing, torso straight (datasheet 1,700 mm, S1; the model's head top ~1.70 m)

[dof]                                  # the controlled degrees of freedom (u), in this order: the wheeled humanoid's
names = ["base_x", "base_y", "base_yaw", "lift", "waist",
         "arm_0", "arm_1", "arm_2", "arm_3", "arm_4", "arm_5", "arm_6"]
# base_x / base_y: the chassis' displacement from its mount along the mount's forward / left axes (m); base_yaw (rad);
# lift: the torso's lift angle a (rad): torso_joint1 = a, torso_joint2 = -2a, torso_joint3 = -a (its axis is -y) keeps
# the chest upright; with the URDF's 0.40 m and 0.30 m torso links the chest goes down by 0.70 (1 - cos a) m and
# forward by 0.10 sin a m (the real robot's "lift" in its torso speed control mode also moves the chest on such an arc,
# S3); waist: torso_joint4 (yaw); arm_i: the hand arm's arm_joint(i+1). The other arm holds its rest pose (body.py Rig).
# Not in u: the torso's tilt (a chest pitch; the real robot can lean the chest), the grippers (replaced by the hand).

[limits.base]                          # the planar base (bodies/servo.py PlanarBase): per axis of the robot's frame,
mode = "axes"                          # as the SDK's chassis interface limits vx, vy, wz separately (S5)
speed_m_s = [1.5, 1.5]                 # forward, left
accel_m_s2 = [2.5, 1.0]
jerk_m_s3 = [62.5, 25.0]
yaw_rate_rad_s = 3.0
yaw_accel_rad_s2 = 1.0
yaw_jerk_rad_s3 = 25.0
force_n = 600.0                        # servo force limit per axis (the planar joints' motors stand in for the wheels)
yaw_torque_nm = 300.0
[limits.base.source]
speed_m_s = "S5 (chassis control: vx, vy within +-1.5 m/s; also S3)"
accel_m_s2 = "S5 (chassis acceleration limit: max x 2.5, y 1.0 m/s^2; audit G6, approved 2026-10-08)"
jerk_m_s3 = "ESTIMATE: 25 x the acceleration (full acceleration within 40 ms; no published jerk; audit section 5)"
yaw_rate_rad_s = "S5 (wz within +-3 rad/s)"
yaw_accel_rad_s2 = "S5: the text says w 1.0 rad/s^2, the table 3 rad/s^2 (the document contradicts itself): the lower value"
yaw_jerk_rad_s3 = "ESTIMATE: 25 x the yaw acceleration"

[limits.lift]                          # u: the lift angle a; torso_joint1 = a, torso_joint2 = -2a, torso_joint3 = -a
range_rad = [0.0, 1.344]               # a <= 1.344: torso_joint2 = -2a reaches the datasheet's knee range -154 deg
                                       # (S1; the URDF allows -160 deg, S2); the chest moves down 0.54 m
speed_rad_s = 0.75
accel_rad_s2 = 1.125
jerk_rad_s3 = 1.125
torque_nm = [304.0, 304.0, 304.0]      # datasheet "torso motor torque: rated 108 N m, max 304 N m" (S1; URDF 100, S2)
[limits.lift.source]
speed_rad_s = "S5 (torso joint speed cap 1.5 rad/s; torso_joint2 moves at 2a: halved; the URDF's 2.5 rad/s, S2, is not what the controller allows)"
accel_rad_s2 = "S5 (torso joint acceleration = 1.5 x the speed cap = 2.25 rad/s^2; halved for 2a)"
jerk_rad_s3 = "S5 (torso joint jerk = 1.5 x the speed cap = 2.25 rad/s^3; halved for 2a)"
torque_nm = "S1"

[limits.waist]
range_rad = [-2.967, 2.967]            # datasheet waist yaw +-170 deg (S1; URDF +-175 deg)
speed_rad_s = 1.5
accel_rad_s2 = 2.25
jerk_rad_s3 = 2.25
torque_nm = 304.0
[limits.waist.source]
speed_rad_s = "S5 (torso joint speed cap; URDF 2.5, S2)"
accel_rad_s2 = "S5 (1.5 x the speed cap)"
jerk_rad_s3 = "S5 (1.5 x the speed cap)"
torque_nm = "S1"

[limits.arm]                           # joints 0..6 of either arm = arm_joint1..7: the SDK's joint control limits (S5),
speed_rad_s = [3.0, 3.0, 3.0, 3.0, 5.0, 5.0, 5.0]          # not the URDF's 7.1-10.5 rad/s (S2; audit G6: SDK over URDF)
accel_rad_s2 = [4.5, 4.5, 4.5, 4.5, 7.5, 7.5, 7.5]
jerk_rad_s3 = [4.5, 4.5, 4.5, 4.5, 7.5, 7.5, 7.5]
torque_nm = [55.0, 55.0, 25.0, 25.0, 18.0, 18.0, 18.0]
reach_m = 0.62                         # datasheet "arm working radius 620 mm" (S1; the model: 0.66 m shoulder to flange)
payload_kg = 3.5                       # rated, at 0.6 m (max 5 kg; S1)
# not enforced: the datasheet's end-effector limits, 7.5 m/s and 10 m/s^2 (S1)
[limits.arm.source]
speed_rad_s = "S5 (arm joint control: max velocity {3, 3, 3, 3, 5, 5, 5} rad/s; audit G6 / D5, approved: a slow-sports body)"
accel_rad_s2 = "S5 (acceleration = 1.5 x the velocity limit)"
jerk_rad_s3 = "S5 (jerk = 1.5 x the velocity limit)"
torque_nm = "S2"

[controller]                           # body.py Rig.apply -> bodies/servo.py Servo (jerk-limited setpoints, PD +
                                       # gravity/Coriolis + inertia feed-forward, clipped at the torque limits, every
                                       # 1 ms physics step); kp as the wheeled humanoid's
[controller.kp]
base = 200000.0
yaw = 4000.0
lift = [6000.0, 6000.0, 3000.0]
waist = 3000.0
arm = [6000.0, 6000.0, 4000.0, 4000.0, 800.0, 800.0, 400.0]
[controller.kd]                        # the wheeled humanoid's kd chatter on the R1 Pro's lighter links (the servo's
                                       # damping is explicit at 1 ms): arm quartered; the lift's knee joint damps the
                                       # whole-body sway on the planar base, its upper joints are light (tools: a reach
                                       # and hold sweep; bodies/conformance.py)
base = 10000.0
yaw = 600.0
lift = [800.0, 100.0, 60.0]
waist = 120.0
arm = [37.5, 37.5, 20.0, 15.0, 1.0, 1.0, 0.75]

[controller.step]
control_dt_s = 0.01
physics_dt_s = 0.001

[rest]                                 # the ready pose (u without the base); the other arm holds other_arm
lift = 0.617                           # a forehand ready pose with a hand on the right wrist (tools: a random search
waist = 0.352                          # with hill climbing on the forward kinematics): the blade 0.49 m ahead of the
                                       # base centre, 0.36 m right, 1.01 m up, its handle pointing down and left
arm = [-0.905, -1.461, 1.484, -1.139, -1.61, 0.446, 0.86]   # every arm joint >= 0.6 rad from its limits
other_arm = [-0.30, 0.25, 0.0, -1.60, 0.0, 0.0, 0.0]   # the free (left) arm, elbow bent in front of the body

[mounts]
wrist = "the body <side>_mount: where the gripper housing meets arm_link7 (on the wrist axis), +z away from the wrist"
cameras = ["head_left", "head_right"]  # the head's stereo pair: 12 cm apart (2026 URDF camera_head_left/right_link,
                                       # S4), 70 degree vertical field of view (datasheet 110 x 70 degrees, S1)
head_pitch_rad = 0.3491                # the URDF's head camera looks 20 degrees down; the head has no joint (S1): a
                                       # sport may tilt (head_pitch) and turn (head_yaw) it as a mount parameter


# ---------------------------------------------------------------------------------------------------------------------
# Self-collision (real limits B0, 2026-10-09: the real arm cannot pass through its own body, so the simulated one
# cannot either). bodies/selfcollision.py turns this into MuJoCo <pair>s at mount(): parts by body name (without the
# prefix; a body matching nothing takes its parent's part, one below an arm is that arm's tool), the rules say which
# parts touch, the exclusions say which pairs do not and why. Automatic exclusions (not listed): geoms of one rigid
# group (a link, its mount, its tool) and of two rigid groups joined by one joint (the joint's housing).
# Recorded during play (rig.self_collisions()): events, time in contact, peak force; above warn_force_n a warning.
# No penalty yet (the sports decide). Check: python -m bodies.selfcollision check <robot> (CI: check-robot-limits).
[self_collision]
parts.left_arm = "left_arm_link[1-7]"
parts.right_arm = "right_arm_link[1-7]"
parts.body = "base|(steer|wheel)_motor_link[1-3]|torso_link[1-4]|head|(left|right)_arm_base_link"
rules = { arm_body = true, arm_arm = true, tool_own_arm = true, same_arm = false }
warn_force_n = 20.0                    # a self-collision event above this peak normal force is a warning
[self_collision.source]
warn_force_n = "ESTIMATE: no vendor publishes a self-contact threshold for this robot; the Franka's collision threshold (20 N, bodies/franka_panda S4) for every body, so one rule reads the same everywhere"
[[self_collision.exclude]]
bodies = ["torso_link4", "(left|right)_arm_link2"]
reason = "shoulder housing: link2 (the second shoulder link) turns at the shoulder bracket; the chest's fitted collision box reaches over the bracket, so they overlap by up to 1.9 cm in 52-57% of legal poses whatever the arm does; the upper arm (link3) onwards stays enabled"
[[self_collision.exclude]]
bodies = ["left_arm_base_link", "left_arm_link2"]
reason = "shoulder housing: the bracket's fitted capsule (r 0.070 m) and link2's overlap by up to 1.8 cm in 58% of legal poses (link2 turns inside the bracket)"
[[self_collision.exclude]]
bodies = ["right_arm_base_link", "right_arm_link2"]
reason = "shoulder housing: the bracket's fitted capsule (r 0.070 m) and link2's overlap by up to 1.9 cm in 66% of legal poses (link2 turns inside the bracket)"

[sources]
S1 = "Galaxea, R1 Pro Hardware Introduction (Product_User_Guide docs/en/Guide/R1Pro/R1Pro_Hardware_Introduction.md, commit aca42753cc0399a90790bbc49f671726e960e372): https://github.com/userguide-galaxea/Product_User_Guide (1,700 mm, 96 kg, 26 DOF = 2 x (7 + gripper) + 4 torso + 6 chassis; arm working radius 620 mm, payload 3.5 kg rated / 5 kg max at 0.6 m, end effector 7.5 m/s and 10 m/s^2; waist yaw +-170 deg, hip pitch +-100 deg, knee W1 0..100 deg / W2 -154..145 deg; torso motor 108 N m rated / 304 N m max; head stereo depth camera 110 x 70 deg)"
S2 = "Galaxea, R1 Pro URDF in OpenGalaxea/GalaxeaManipSim (Apache-2.0), galaxea_sim/assets/r1_pro/configs/urdfs/r1pro.urdf, commit abe7f5161eeaa150e6eaffdf443af5df7f23f356: https://github.com/OpenGalaxea/GalaxeaManipSim (joint <limit> lower, upper, velocity, effort; inertials; meshes)"
S3 = "Galaxea, R1 Pro Software Introduction ROS2 (same repository and commit as S1, R1Pro_Software_Introduction_ROS2.md): chassis control target speed x, y within +-1.5 m/s, w within +-3 rad/s; acceleration limit max x 2.5, y 1.0, w 1.0; torso joint control max speed 1.5 rad/s per joint; torso speed control 0.1 m/s, 0.3 rad/s"
S4 = "Galaxea, R1 Pro 2026 URDF (userguide-galaxea/URDF R1Pro/urdf_r1pro_g1z_2026, commit b81c32520b1d1a3b3299df0c038e042001b46ae3; no licence file: read for facts only, not redistributed): head cameras 0.1202 m apart"
S5 = "Galaxea, R1 Pro motion control (2026 software interface): arm joint control max velocity {3, 3, 3, 3, 5, 5, 5} rad/s with acceleration and jerk 1.5 x velocity; torso joints 1.5 rad/s (acceleration, jerk 1.5 x); chassis vx, vy +-1.5 m/s, wz +-3 rad/s, acceleration max x 2.5, y 1.0 m/s^2 (yaw: 1.0 in the text, 3 in the table), read 2026-10-08: https://docs.galaxea-dynamics.com/R1Pro/en/docs/2026/software_interface/r1pro_motion_control/"
