# Franka Research 3 (FR3): the Panda's successor (same kinematic chain and DH parameters, different joint ranges,
# faster wrist joints, lower accelerations). No RoboOlympics scene uses it yet (every Franka sport's MJCF is the
# Panda: bodies/franka_panda); kept for comparison and for a later FR3 model. Data only (bodies/limits.py).

[body]
name = "franka_fr3"
title = "Franka Research 3 (FR3)"
revision = "fr3-limits-1"
kind = "arm"

[limits.arm]                           # joints A1..A7 (S1 "Limits for Franka Research 3 (FR3)")
range_lo_rad = [-2.9007, -1.8361, -2.9007, -3.0770, -2.8763, 0.4398, -3.0508]
range_hi_rad = [2.9007, 1.8361, 2.9007, -0.1169, 2.8763, 4.6216, 3.0508]
speed_rad_s = [2.62, 2.62, 2.62, 2.62, 5.26, 4.18, 5.26]
accel_rad_s2 = [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
jerk_rad_s3 = [5000.0, 5000.0, 5000.0, 5000.0, 5000.0, 5000.0, 5000.0]
torque_nm = [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]
torque_rate_nm_s = [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0]
# position-based velocity limits (S1): qd_max(q) = min(qd_max, max(0, -qd_offset + sqrt(max(0, 2 qdd_dec (q_max - q)))))
# and the mirror image towards q_min; not applied by bodies/limits.py yet
velocity_offset_rad_s = [0.6599, 0.2517, 0.2000, 0.3533, 0.5757, 0.4878, 0.4628]
deceleration_rad_s2 = [6.0, 2.585, 3.5, 4.0, 17.0, 5.5, 17.0]
[limits.arm.source]                    # per quantity (bodies/servo.py source_problems; numbers unchanged)
speed_rad_s = "S1 (cross-checked with S3)"
accel_rad_s2 = "S1 (S2 kMaxJointAcceleration)"
jerk_rad_s3 = "S1 (S2 kMaxJointJerk)"
torque_nm = "S1, S3"
torque_rate_nm_s = "S1 (S2 kMaxTorqueRate)"

[limits.cartesian]                     # S1, Cartesian-space interfaces only
translation = { speed_m_s = 3.0, accel_m_s2 = 9.0, jerk_m_s3 = 4500.0 }
rotation = { speed_rad_s = 2.5, accel_rad_s2 = 17.0, jerk_rad_s3 = 8500.0 }
elbow = { speed_rad_s = 2.620, accel_rad_s2 = 10.0, jerk_rad_s3 = 5000.0 }

[sources]
S1 = "Franka Robotics, Franka Control Interface (FCI) documentation, 'Control Interface Specification and Robot Limits', section 'Limits for Franka Research 3 (FR3)' (joint-space, position-based velocity and Cartesian-space limit tables), https://frankarobotics.github.io/docs/robot_specifications.html, page (c) 2023 Franka Robotics GmbH, read 2026-10-07"
S2 = "libfranka 0.21.3 (released 2026-07-30), include/franka/rate_limiting.h: kMaxJointJerk 5000, kMaxJointAcceleration 10, kMaxTorqueRate 1000, kMaxTranslationalVelocity 3.0, kMaxRotationalVelocity 2.5, https://github.com/frankarobotics/libfranka"
S3 = "franka_description (main), robots/fr3/joint_limits.yaml (ranges, velocity, effort, position-based velocity limits), https://github.com/frankaemika/franka_description"
