# @package _global_

rl_games:
  env_eval:
    mid_train:
      interval_steps: 500
    deadly:
      action_layout: multibinary_7
      multibinary_threshold: 0.0
  cross_task:
    loss_by_task:
      defend_the_line: discrete_ce
      deadly_corridor: multibinary_bce
    loss_weight_by_task:
      defend_the_line: 1.0
      deadly_corridor: 1.0
    train_tasks:
      - name: defend_the_line
        role: A
        train_source_hf: latency-sensitive-bench/benchmark-datasets
        train_revision: d6f0ad0995f6e4b095f315920e8de18e04297048
        prompt_source_hf: latency-sensitive-bench/benchmark-datasets
        prompt_revision: d6f0ad0995f6e4b095f315920e8de18e04297048
        train_source_subdir: zero-latency/defend-the-line/defend_the_line_fixed_latency_0_1000ep_7k2steps
        prompt_source_subdir: zero-latency/defend-the-line/defend_the_line_fixed_latency_0_1000ep_7k2steps
        converted_name: defend_the_line_zero_latency_train
        train_latency_filter: [0]
        eval_latency_filter: [0]
        episodes_per_latency: 40
        max_episodes: null
        weight: 1.0
      - name: deadly_corridor
        role: B
        train_source_hf: latency-sensitive-bench/benchmark-datasets
        train_revision: d6f0ad0995f6e4b095f315920e8de18e04297048
        train_source_subdir: zero-latency/deadly-corridor/deadly_1000ep/deadly_corridor_fix_latency_0_1000ep
        prompt_source_hf: latency-sensitive-bench/benchmark-datasets
        prompt_revision: d6f0ad0995f6e4b095f315920e8de18e04297048
        prompt_source_subdir: zero-latency/deadly-corridor/deadly_1000ep/deadly_corridor_fix_latency_0_1000ep
        converted_name: deadly_corridor_zero_latency_train
        train_latency_filter: [0]
        eval_latency_filter: [0, 2, 4]
        episodes_per_latency: 1000
        max_episodes: null
        action_layout: multibinary_7
        weight: 1.0
    eval_tasks:
      defend_the_line:
        frameskip: 4
        image_size: 224
        task_description: "You are playing Defend the Line in VizDoom. Your goal is to survive by turning toward enemies and shooting them before they reach you. The available actions are: TURN_LEFT, TURN_RIGHT, and ATTACK. Choose the best next action from the current visual observation."
        mid_train:
          latencies: [0]
          num_episodes: 5
          max_steps_per_episode: 3600
        post_train:
          latencies: [0, 2, 4]
          num_episodes: 20
          max_steps_per_episode: 3600
      deadly_corridor:
        frameskip: 4
        image_size: 224
        task_description: "You are playing Deadly Corridor in VizDoom. Choose actions from MOVE_FORWARD, MOVE_BACKWARD, MOVE_LEFT, MOVE_RIGHT, TURN_LEFT, TURN_RIGHT, ATTACK."
        mid_train:
          latencies: [0]
          num_episodes: 5
          max_steps_per_episode: 3600
        post_train:
          latencies: [0, 2, 4]
          num_episodes: 20
          max_steps_per_episode: 3600

framework:
  action_model:
    action_dim: 7
    action_env_dim: 7
    loss_type: discrete_ce
