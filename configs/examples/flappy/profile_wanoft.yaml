experiment:
  name: starvla_wan_oft_flappy_raw3
  seed: 42
backend:
  algo: APPO
  device: cuda
  train_dir: results/checkpoints
  restart_behavior: resume
  run_mode: eval
executor:
  mode: realtime
  simulated_worker_capacity: null
  parallel_envs: 1
  inference_devices:
  - cuda:0
  sync_cuda: true
env:
  name: flappy
  env_fps: 30
  obs_fps: 30
  gym_id: FlappyBird-v0
  render_mode: rgb_array
  observation_mode: image
  use_lidar: false
  normalize_obs: true
  audio_on: false
  frame_stack: 4
  obs_resize:
  - 224
  - 224
  use_gpu_render: true
  simulator: gpu
  gpu_render_device: auto
  gpu_render_profile: false
  gpu_render_profile_interval: 200
  noop_action: noop
  action_map:
    noop: 0
    flap: 1
  oneshot_actions:
  - flap
scheduler:
  hold_policy: one_frame_then_noop
  ordering_policy: latest_ready
policy:
  type: starvla
  actions:
  - noop
  - flap
  deterministic: true
  latency_prompt_map_path: /home/lixinyuan/latency-sensitive-bench/third_party/starVLA/data/flappy_fix_latency_3_200ep_context5/flappy_train__bridge/latency_prompt_map.json
  latency_prompt_key: 3
  source: hf
  root: .
  checkpoint: checkpoints/steps_2000_pytorch_model.pt
  model_config: config.full.yaml
  hf_repo: latency-sensitive-bench/wan_oft_flappy_fix_latency_3_context5_standard_sft_2000_effbs128_224_currentce
training:
  train_for_env_steps: 25000000
  num_workers: 2
  num_envs_per_worker: 128
  worker_num_splits: 1
  num_policies: 1
  batch_size: 4096
  rollout: 128
  recurrence: 1
  num_epochs: 8
  num_batches_per_epoch: 8
  max_policy_lag: 400
  learning_rate: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.5
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5
evaluation:
  eval_interval_steps: 1000000
  eval_raw_reward: false
  episodes: 10
  max_env_steps: 3600
  suites: []
logging:
  output_dir: outputs/profiling
  video:
    enabled: false
    num_bins: 10
  save_step_records: false
  save_action_records: false
  save_latency_records: false
  wandb_project: null
  wandb_group: flappy-new(remove training episode limit)
  wandb_job_type: sample_factory
  wandb_tags: ''
profiling:
  model_id: wanoft
  workload_id: flappy
  repeats: 5
  calibration: null
