__base__: gymnasium_mountain_car_latency_bench_eval.yaml

experiment:
  name: gymnasium_mountain_car_starvla_fixed_l3

policy:
  type: starvla
  checkpoint_path: third_party/starVLA/results/Checkpoints/mountain_car_fixed_l3_openvla_sft/final_model
  model_config_path: third_party/starVLA/results/Checkpoints/mountain_car_fixed_l3_openvla_sft/config.full.yaml
  task_manifest_path: third_party/starVLA/playground/Datasets/rl_games/mountain_car_fixed_l3/manifest.json
  device: cuda
  latency_prompt_map_path: third_party/starVLA/playground/Datasets/rl_games/mountain_car_fixed_l3/latency_prompt_map.json

evaluation:
  eval_episodes: 20
  eval_parallel_envs: 1
  eval_max_steps: 200

logging:
  output_dir: outputs/examples/gymnasium_mountain_car/starvla_eval
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
