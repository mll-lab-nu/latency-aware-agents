experiment:
  name: gymnasium_inverted_pendulum_starvla_profile
  seed: 42
executor:
  mode: realtime
  parallel_envs: 1
  inference_devices:
  - cuda:0
  sync_cuda: true
env:
  name: inverted_pendulum
  make_kwargs:
    base_env_id: InvertedPendulum-v4
    render_mode: rgb_array
    force_values:
    - -3.0
    - -1.5
    - 0.0
    - 1.5
    - 3.0
    base_make_kwargs: {}
  env_fps: 25
  obs_fps: 25
  frame_stack: 1
  state_space:
    labels:
    - cart_position
    - pole_angle
    - cart_velocity
    - pole_angular_velocity
  noop_action: zero_force
  action_map:
    push_left_hard: 0
    push_left_soft: 1
    zero_force: 2
    push_right_soft: 3
    push_right_hard: 4
  action_order:
  - push_left_hard
  - push_left_soft
  - zero_force
  - push_right_soft
  - push_right_hard
  base_prompt: 'Keep the pole upright by applying horizontal cart forces. Choose exactly
    one action from: push_left_hard, push_left_soft, zero_force, push_right_soft,
    push_right_hard.'
scheduler:
  hold_policy: hold
  ordering_policy: issue_order_fifo
policy:
  type: starvla
  actions:
  - push_left_hard
  - push_left_soft
  - zero_force
  - push_right_soft
  - push_right_hard
  task_manifest_path: /home/lixinyuan/latency-sensitive-bench/configs/examples/gymnasium/inverted_pendulum/task_manifest.json
  source: hf
  root: OpenVLA/zero-latency/inverted_pendulum_rgb_state_l0_return_gt900_100ep_openvla_native_sft_2k
  checkpoint: checkpoints/steps_2000_pytorch_model.pt
  model_config: config.full.yaml
  hf_repo: latency-sensitive-bench/extra-envs-checkpoints
evaluation:
  episodes: 10
  max_env_steps: 1000
logging:
  output_dir: outputs/profiling
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
profiling:
  model_id: qwenoft
  workload_id: inverted_pendulum
  repeats: 5
  calibration: null
