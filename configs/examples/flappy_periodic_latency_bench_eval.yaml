__base__: ../base/flappy.yaml

experiment:
  name: flappy_sf_same_latency_l0_seed0_periodic_eval
  seed: 0

backend:
  algo: APPO
  device: cuda
  train_dir: results/checkpoints
  restart_behavior: resume
  run_mode: train

env:
  name: flappy
  env_fps: 30
  obs_fps: 30
  gym_id: FlappyBird-v0
  use_lidar: false
  normalize_obs: true
  audio_on: false
  frame_stack: 4
  obs_resize:
    - 84
    - 84
  use_gpu_render: true
  gpu_render_device: auto
  gpu_render_profile: false
  gpu_render_profile_interval: 200

latency:
  method: zero
  add_latency_info: false

scheduler:
  hold_policy: one_frame_then_noop
  ordering_policy: latest_ready

training:
  train_for_env_steps: 15000000
  num_workers: 2
  num_envs_per_worker: 64
  worker_num_splits: 1
  num_policies: 1
  batch_size: 4096
  rollout: 256
  recurrence: 1
  num_epochs: 8
  num_batches_per_epoch: 8
  learning_rate: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.5
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5

evaluation:
  eval_interval_steps: 1000000
  eval_raw_reward: false
  episodes: 20
  max_env_steps: 3600
  suites:
  - name: fixed_0
    latency:
      method: zero
  - name: fixed_1
    latency:
      method: fixed
      fixed_latency_ms: 33.333333333333336
  - name: fixed_2
    latency:
      method: fixed
      fixed_latency_ms: 66.66666666666667
  - name: fixed_3
    latency:
      method: fixed
      fixed_latency_ms: 100.0
  - name: fixed_4
    latency:
      method: fixed
      fixed_latency_ms: 133.33333333333334
  - name: fixed_5
    latency:
      method: fixed
      fixed_latency_ms: 166.66666666666666
  - name: fixed_6
    latency:
      method: fixed
      fixed_latency_ms: 200.0
  - name: fixed_7
    latency:
      method: fixed
      fixed_latency_ms: 233.33333333333334
  - name: fixed_8
    latency:
      method: fixed
      fixed_latency_ms: 266.6666666666667
  - name: fixed_9
    latency:
      method: fixed
      fixed_latency_ms: 300.0
  - name: fixed_10
    latency:
      method: fixed
      fixed_latency_ms: 333.3333333333333
  - name: fixed_11
    latency:
      method: fixed
      fixed_latency_ms: 366.6666666666667
  - name: fixed_12
    latency:
      method: fixed
      fixed_latency_ms: 400.0
  - name: fixed_13
    latency:
      method: fixed
      fixed_latency_ms: 433.3333333333333
  - name: fixed_14
    latency:
      method: fixed
      fixed_latency_ms: 466.6666666666667
  - name: fixed_15
    latency:
      method: fixed
      fixed_latency_ms: 500.0
  - name: normal_mean_2_std_1_min_0_max_15
    latency:
      method: normal
      mean_latency_ms: 66.66666666666667
      std_latency_ms: 33.333333333333336
      min_latency_ms: 0.0
      max_latency_ms: 500.00000000000006
      seed: 0
  - name: normal_mean_4_std_2_min_0_max_15
    latency:
      method: normal
      mean_latency_ms: 133.33333333333334
      std_latency_ms: 66.66666666666667
      min_latency_ms: 0.0
      max_latency_ms: 500.00000000000006
      seed: 0
  - name: uniform_min_0_max_5
    latency:
      method: uniform
      min_latency_ms: 0.0
      max_latency_ms: 166.66666666666669
      seed: 0
logging:
  output_dir: outputs/train/flappy/latency_0/seed_0_periodic_eval
  wandb_project: latency-sensitive-bench
  wandb_group: flappy-new(remove training episode limit)
  wandb_job_type: sample_factory
  wandb_name: flappy-bird-l0-s0-periodic-eval
executor:
  parallel_envs: 100
policy:
  deterministic: true
