__base__: small_model_train.yaml

backend:
  run_mode: eval

policy:
  type: sample_factory
  checkpoint_kind: latest
  deterministic: true

  source: local
  root: .
evaluation:
  episodes: 20
  max_env_steps: 200
logging:
  output_dir: outputs/examples/gymnasium_pendulum/eval
  video:
    enabled: true
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
executor:
  inference_devices:
  - cuda
  parallel_envs: 1
