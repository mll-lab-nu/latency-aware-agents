experiment:
  name: gymnasium_pendulum_discrete_latency_bench_eval
  seed: 0

executor:
  mode: simulated

  parallel_envs: 1
env:
  name: pendulum_discrete
  make_kwargs:
    base_env_id: Pendulum-v1
    render_mode: rgb_array
    torque_values: [-2.0, -1.0, 0.0, 1.0, 2.0]
    base_make_kwargs:
      g: 10.0
  env_fps: 20
  obs_fps: 20
  frame_stack: 1
  noop_action: zero_torque
  action_map:
    torque_clockwise_hard: 0
    torque_clockwise_soft: 1
    zero_torque: 2
    torque_counterclockwise_soft: 3
    torque_counterclockwise_hard: 4
  action_order:
    - torque_clockwise_hard
    - torque_clockwise_soft
    - zero_torque
    - torque_counterclockwise_soft
    - torque_counterclockwise_hard
  base_prompt: >-
    Swing the pendulum upright and keep it balanced by applying torque. Choose exactly one action from:
    torque_clockwise_hard, torque_clockwise_soft, zero_torque, torque_counterclockwise_soft,
    torque_counterclockwise_hard.

latency:
  method: fixed
  fixed_latency_ms: 50.0

scheduler:
  hold_policy: hold
  ordering_policy: issue_order_fifo

policy:
  type: random
  actions:
    - torque_clockwise_hard
    - torque_clockwise_soft
    - zero_torque
    - torque_counterclockwise_soft
    - torque_counterclockwise_hard

evaluation:
  episodes: 5
  max_env_steps: 200
logging:
  output_dir: outputs/examples/gymnasium_pendulum/latency_bench_eval
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
