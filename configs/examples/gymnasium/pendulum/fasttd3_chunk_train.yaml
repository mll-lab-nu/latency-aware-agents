__base__: ../../../training/algorithms/fasttd3_chunk.yaml
experiment:
  name: pendulum_fasttd3_chunk_h8
  seed: 0
backend:
  type: sample_factory
  device: gpu
  train_dir: outputs/examples/pendulum_fasttd3_chunk/checkpoints
  restart_behavior: restart
  run_mode: train
  initial_model_path: null
executor:
  mode: simulated
env:
  name: gymnasium
  task_name: pendulum_continuous
  env_id: Pendulum-v1
  registration_imports: []
  make_kwargs:
    render_mode: null
  env_fps: 20
  obs_fps: 10
  frame_stack: 1
  action_space:
    type: box
    labels:
    - torque
    low:
    - -2.0
    high:
    - 2.0
    dtype: float32
  noop_action:
  - 0.0
  base_prompt: Swing the pendulum upright and keep it balanced using a torque in [-2,
    2].
latency:
  method: zero
  add_latency_info: false
policy:
  type: random
training:
  train_for_env_steps: 1000000
  save_every_sec: 600
  keep_checkpoints: 5
evaluation:
  eval_interval_steps: null
  eval_episodes: 5
  eval_parallel_envs: 1
  eval_max_steps: 1000
  eval_deterministic: true
logging:
  output_dir: outputs/examples/pendulum_fasttd3_chunk/train
  video:
    enabled: false
    num_bins: 1
  save_step_records: false
  save_action_records: false
  save_latency_records: false
