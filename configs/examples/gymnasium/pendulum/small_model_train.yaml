experiment:
  name: gymnasium_pendulum_discrete_fixed_l1
  seed: 0

backend:
  type: sample_factory
  algo: APPO
  device: cuda
  train_dir: outputs/examples/gymnasium_pendulum/checkpoints
  restart_behavior: overwrite
  run_mode: train

executor:
  mode: simulated
  simulated_worker_capacity: null

env:
  name: gymnasium
  task_name: pendulum_discrete
  env_id: LatencyBench/PendulumDiscrete-v0
  registration_imports:
    - latency_bench.envs.tasks.pendulum
  make_kwargs:
    base_env_id: Pendulum-v1
    render_mode: rgb_array
    torque_values: [-2.0, -1.0, 0.0, 1.0, 2.0]
    base_make_kwargs:
      g: 10.0
  env_fps: 20
  obs_fps: 20
  frame_stack: 1
  noop_action: zero_torque
  action_map:
    torque_clockwise_hard: 0
    torque_clockwise_soft: 1
    zero_torque: 2
    torque_counterclockwise_soft: 3
    torque_counterclockwise_hard: 4
  action_order:
    - torque_clockwise_hard
    - torque_clockwise_soft
    - zero_torque
    - torque_counterclockwise_soft
    - torque_counterclockwise_hard
  base_prompt: >-
    Swing the pendulum upright and keep it balanced by applying torque. Choose exactly one action from:
    torque_clockwise_hard, torque_clockwise_soft, zero_torque, torque_counterclockwise_soft,
    torque_counterclockwise_hard.

latency:
  method: fixed
  fixed_latency_ms: 50.0
  add_latency_info: false

scheduler:
  hold_policy: hold
  ordering_policy: issue_order_fifo

policy:
  type: random
  actions:
    - torque_clockwise_hard
    - torque_clockwise_soft
    - zero_torque
    - torque_counterclockwise_soft
    - torque_counterclockwise_hard

training:
  train_for_env_steps: 1000000
  num_workers: 1
  num_envs_per_worker: 16
  worker_num_splits: 1
  num_policies: 1
  batch_size: 1024
  rollout: 64
  recurrence: 32
  num_epochs: 2
  num_batches_per_epoch: 8
  max_policy_lag: 300
  learning_rate: 0.000303
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.0
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  save_every_sec: 600
  keep_checkpoints: 5

evaluation:
  eval_interval_steps: null
  eval_episodes: 5
  eval_parallel_envs: 1
  eval_max_steps: 200
  eval_deterministic: true

logging:
  output_dir: outputs/examples/gymnasium_pendulum/train
  video:
    enabled: false
    num_bins: 1
  save_step_records: false
  save_action_records: false
  save_latency_records: false
