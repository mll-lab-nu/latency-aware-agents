    action_dim: 17
    action_hidden_dim: 2560
    future_action_window_size: 0
    past_action_window_size: 0
    loss_type: l1
    state_dim: 376
    action_horizon: 1
    action_env_dim: 17
  kv_memory:
    enabled: false
    window: 4
    rollout_len: 8
    packed_train: false
    rebased_sink: true
