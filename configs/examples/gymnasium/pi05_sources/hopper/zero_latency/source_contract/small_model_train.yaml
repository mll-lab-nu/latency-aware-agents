__base__: state_contract.yaml

experiment:
  name: gymnasium_hopper_zero_latency_10m
  seed: 3333

backend:
  type: sample_factory
  algo: APPO
  device: cuda
  train_dir: /mnt/checkpoints/latency-sensitive-bench/small_models/hopper
  restart_behavior: overwrite
  run_mode: train

executor:
  mode: simulated

env:
  name: gymnasium
  task_name: hopper
  env_id: LatencyBench/Hopper-v0
  registration_imports: [latency_bench.envs.gymnasium_hopper]
  make_kwargs:
    base_env_id: Hopper-v4
    render_mode: rgb_array
    base_make_kwargs:
      forward_reward_weight: 1.0
      ctrl_cost_weight: 0.001
      healthy_reward: 1.0
      terminate_when_unhealthy: true
      reset_noise_scale: 0.005
      exclude_current_positions_from_observation: true
  env_fps: 125.0
  obs_fps: 125.0
  frame_stack: 1
  action_space:
    type: box
    labels: [thigh_torque, leg_torque, foot_torque]
    low: [-1.0, -1.0, -1.0]
    high: [1.0, 1.0, 1.0]
    dtype: float32
  noop_action: [0.0, 0.0, 0.0]
  base_prompt: >-
    Move the Hopper robot forward while keeping its torso upright. Predict three continuous torques
    in [-1, 1] ordered as thigh, leg, and foot.

latency:
  method: zero
  add_latency_info: false

scheduler:
  hold_policy: hold
  ordering_policy: issue_order_fifo

policy:
  type: random

training:
  train_for_env_steps: 10000000
  num_workers: 8
  num_envs_per_worker: 8
  worker_num_splits: 2
  num_policies: 1
  batch_size: 1024
  rollout: 64
  recurrence: 1
  num_epochs: 2
  num_batches_per_epoch: 4
  num_batches_to_accumulate: 2
  policy_workers_per_policy: 1
  max_policy_lag: 10000
  learning_rate: 0.00295
  lr_schedule: linear_decay
  lr_schedule_kl_threshold: 0.008
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.2
  ppo_clip_value: 1.0
  value_loss_coeff: 1.3
  max_grad_norm: 3.5
  exploration_loss: entropy
  exploration_loss_coeff: 0.0
  kl_loss_coeff: 0.1
  reward_scale: 1.0
  reward_clip: 1000.0
  async_rl: false
  serial_mode: false
  batched_sampling: false
  with_vtrace: false
  use_rnn: false
  env_framestack: 4
  encoder_mlp_layers: [64, 64]
  nonlinearity: tanh
  adaptive_stddev: false
  policy_initialization: torch_default
  initial_stddev: 1.0
  actor_critic_share_weights: true
  shuffle_minibatches: false
  value_bootstrap: false
  normalize_input: true
  normalize_returns: true
  decorrelate_experience_max_seconds: 10
  decorrelate_envs_on_one_worker: true
  set_workers_cpu_affinity: true
  force_envs_single_thread: true
  save_every_sec: 600
  keep_checkpoints: 3
  save_best_every_sec: 60
  save_best_after: 100000

evaluation:
  eval_interval_steps: null
  eval_episodes: 10
  eval_parallel_envs: 1
  eval_max_steps: 1000
  eval_deterministic: true

logging:
  output_dir: /mnt/results/latency-sensitive-bench/tasks/hopper/small_model_train
  video:
    enabled: false
    num_bins: 1
  save_step_records: false
  save_action_records: false
  save_latency_records: false
