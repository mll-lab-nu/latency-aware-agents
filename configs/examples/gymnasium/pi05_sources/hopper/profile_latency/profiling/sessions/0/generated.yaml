env:
  state_space:
    labels:
    - torso_height
    - torso_angle
    - thigh_angle
    - leg_angle
    - foot_angle
    - torso_x_velocity
    - torso_z_velocity
    - torso_angular_velocity
    - thigh_angular_velocity
    - leg_angular_velocity
    - foot_angular_velocity
  name: gymnasium
  task_name: hopper
  env_id: LatencyBench/Hopper-v0
  registration_imports:
  - latency_bench.envs.gymnasium_hopper
  make_kwargs:
    base_env_id: Hopper-v4
    render_mode: rgb_array
    base_make_kwargs:
      forward_reward_weight: 1.0
      ctrl_cost_weight: 0.001
      healthy_reward: 1.0
      terminate_when_unhealthy: true
      reset_noise_scale: 0.005
      exclude_current_positions_from_observation: true
  env_fps: 10
  obs_fps: 10.0
  frame_stack: 1
  action_space:
    type: box
    labels:
    - thigh_torque
    - leg_torque
    - foot_torque
    low:
    - -1.0
    - -1.0
    - -1.0
    high:
    - 1.0
    - 1.0
    - 1.0
    dtype: float32
  noop_action:
  - 0.0
  - 0.0
  - 0.0
  base_prompt: Move the Hopper robot forward while keeping its torso upright. Predict
    three continuous torques in [-1, 1] ordered as thigh, leg, and foot.
  obs_resize:
  - 224
  - 224
experiment:
  name: hopper_P_20260911T023128Z-p-only4
  seed: 42
backend:
  type: sample_factory
  algo: APPO
  device: cuda
  train_dir: /path/to/mount/placeholder/small_models/hopper
  restart_behavior: overwrite
  run_mode: eval
executor:
  mode: realtime
  simulated_worker_capacity: null
  inference_devices:
  - cuda:0
latency:
  method: measured
  device: cuda:0
  sync_cuda: true
  model_id: qwenoft
  gpu_class: 1x-rtx3090
  workload_id: hopper
  instance_id: instance_859cf1e47bca6046
scheduler:
  hold_policy: hold
  ordering_policy: issue_order_fifo
policy:
  type: starvla
  checkpoint_path: /workspace/tasks/20260911T023128Z-p-only4/hopper/bundle/checkpoints/steps_5000_pytorch_model.pt
  model_config_path: /workspace/tasks/20260911T023128Z-p-only4/hopper/bundle/config.full.yaml
  task_manifest_path: /workspace/tasks/20260911T023128Z-p-only4/hopper/bundle/manifest.json
  device: cuda:0
  latency_prompt_map_path: /workspace/tasks/20260911T023128Z-p-only4/hopper/bundle/latency_prompt_map.json
  latency_prompt_key: 0
  prompt_mode: raw
  worker_python_executable: /venv/starvla_rl_games_openvla/bin/python
training:
  train_for_env_steps: 10000000
  num_workers: 8
  num_envs_per_worker: 8
  worker_num_splits: 2
  num_policies: 1
  batch_size: 1024
  rollout: 64
  recurrence: 1
  num_epochs: 2
  num_batches_per_epoch: 4
  num_batches_to_accumulate: 2
  policy_workers_per_policy: 1
  max_policy_lag: 10000
  learning_rate: 0.00295
  lr_schedule: linear_decay
  lr_schedule_kl_threshold: 0.008
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.2
  ppo_clip_value: 1.0
  value_loss_coeff: 1.3
  max_grad_norm: 3.5
  exploration_loss: entropy
  exploration_loss_coeff: 0.0
  kl_loss_coeff: 0.1
  reward_scale: 1.0
  reward_clip: 1000.0
  async_rl: false
  serial_mode: false
  batched_sampling: false
  with_vtrace: false
  use_rnn: false
  env_framestack: 4
  encoder_mlp_layers:
  - 64
  - 64
  nonlinearity: tanh
  adaptive_stddev: false
  policy_initialization: torch_default
  initial_stddev: 1.0
  actor_critic_share_weights: true
  shuffle_minibatches: false
  value_bootstrap: false
  normalize_input: true
  normalize_returns: true
  decorrelate_experience_max_seconds: 10
  decorrelate_envs_on_one_worker: true
  set_workers_cpu_affinity: true
  force_envs_single_thread: true
  save_every_sec: 600
  keep_checkpoints: 3
  save_best_every_sec: 60
  save_best_after: 100000
evaluation:
  eval_interval_steps: null
  eval_episodes: 10
  eval_parallel_envs: 1
  eval_max_steps: 600
  eval_deterministic: true
  eval_latency_values: null
logging:
  output_dir: /workspace/tasks/20260911T023128Z-p-only4/hopper/profiling/runs/qwenoft/1x-rtx3090/hopper/instance_859cf1e47bca6046/20260911T034939618615Z/sessions/0
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  realtime_pipeline_profile: true
provenance:
  model_provenance:
    source: local
    repo_id: placeholder/extra-envs-checkpoints
    path_in_repo: OpenVLA/zero-latency/hopper_rgb_state_l0_return_gt3000_100ep_openvla_native_continuous_projector_sft_5k
    checkpoint: checkpoints/steps_5000_pytorch_model.pt
    model_config: config.full.yaml
