experiment:
  name: air_raid_P_20260911T023128Z-p-only4
  seed: 42
backend:
  type: sample_factory
  algo: APPO
  device: cuda
  train_dir: outputs/examples/gymnasium_air_raid/checkpoints
  restart_behavior: overwrite
  run_mode: eval
  extra_args:
  - --encoder_conv_architecture
  - convnet_atari
executor:
  mode: realtime
  simulated_worker_capacity: null
  inference_devices:
  - cuda:0
env:
  name: gymnasium
  task_name: air_raid
  env_id: LatencyBench/AirRaid-v0
  registration_imports:
  - latency_bench.envs.gymnasium_air_raid
  make_kwargs:
    base_env_id: ALE/AirRaid-v5
    render_mode: rgb_array
    screen_size: 84
    noop_max: 30
    base_make_kwargs:
      obs_type: rgb
      frameskip: 1
      repeat_action_probability: 0.0
      full_action_space: false
      mode: 1
      difficulty: 0
      max_num_frames_per_episode: 108000
    fire_reset: true
  env_fps: 50.0
  obs_fps: 12.5
  frame_stack: 4
  noop_action: noop
  action_map:
    noop: 0
    fire: 1
    right: 2
    left: 3
    rightfire: 4
    leftfire: 5
  action_order:
  - noop
  - fire
  - right
  - left
  - rightfire
  - leftfire
  base_prompt: 'Protect both buildings from flying saucers. Choose exactly one action
    from: noop, fire, right, left, rightfire, leftfire.'
  obs_resize:
  - 224
  - 224
latency:
  method: measured
  device: cuda:0
  sync_cuda: true
  model_id: qwenoft
  gpu_class: 1x-rtx3090
  workload_id: air_raid
  instance_id: instance_859cf1e47bca6046
scheduler:
  hold_policy: hold
  ordering_policy: issue_order_fifo
policy:
  type: starvla
  actions:
  - noop
  - fire
  - right
  - left
  - rightfire
  - leftfire
  checkpoint_path: /workspace/tasks/20260911T023128Z-p-only4/air_raid/bundle/checkpoints/steps_5000_pytorch_model.pt
  model_config_path: /workspace/tasks/20260911T023128Z-p-only4/air_raid/bundle/config.full.yaml
  task_manifest_path: /workspace/tasks/20260911T023128Z-p-only4/air_raid/bundle/manifest.json
  device: cuda:0
  latency_prompt_map_path: /workspace/tasks/20260911T023128Z-p-only4/air_raid/bundle/latency_prompt_map.json
  latency_prompt_key: 0
  prompt_mode: raw
  worker_python_executable: /venv/starvla_rl_games_openvla/bin/python
training:
  train_for_env_steps: 10000000
  num_workers: 16
  num_envs_per_worker: 8
  worker_num_splits: 2
  num_policies: 1
  batch_size: 1024
  rollout: 32
  recurrence: 1
  env_framestack: 4
  num_epochs: 4
  num_batches_per_epoch: 4
  max_policy_lag: 300
  learning_rate: 0.00025
  lr_schedule: linear_decay
  nonlinearity: relu
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.5
  exploration_loss: entropy
  exploration_loss_coeff: 0.01
  obs_scale: 255.0
  adam_eps: 1.0e-05
  adaptive_stddev: false
  with_vtrace: false
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  save_every_sec: 600
  keep_checkpoints: 5
evaluation:
  eval_interval_steps: null
  eval_episodes: 10
  eval_parallel_envs: 1
  eval_max_steps: 3000
  eval_deterministic: true
  eval_latency_values: null
logging:
  output_dir: /workspace/tasks/20260911T023128Z-p-only4/air_raid/profiling/runs/qwenoft/1x-rtx3090/air_raid/instance_859cf1e47bca6046/20260911T023704401836Z/sessions/0
