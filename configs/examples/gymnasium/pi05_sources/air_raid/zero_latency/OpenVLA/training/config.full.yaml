framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /path/to/mount/placeholder/openvla/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
  action_model:
    action_model_type: MLP
    action_dim: 6
    action_hidden_dim: 2560
    future_action_window_size: 0
    past_action_window_size: 0
    loss_type: discrete_ce
    state_dim: 1
    action_horizon: 1
    action_env_dim: 6
  kv_memory:
    enabled: false
    window: 4
    rollout_len: 8
    packed_train: false
    rebased_sink: true
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /path/to/mount/placeholder/vla_datasets/rl_games
    data_mix: air_raid_l0_random_noop_fire_reset_return_gt2500_100ep
    eval_data_mix: air_raid_l0_random_noop_fire_reset_return_gt2500_100ep__val
    custom_mixtures_path: /path/to/mount/placeholder/vla_datasets/rl_games/_generated_mixtures/air_raid_l0_random_noop_fire_reset_return_gt2500_100ep.json
    action_type: discrete
    sequential_step_sampling: false
    eval_sequential_step_sampling: null
    num_workers: 8
    eval_num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    shuffle: true
    action_balance:
      enabled: false
      strategy: balanced_epoch
      action_key: action_id
      target_flap_fraction: 0.3
      noop_id: 0
      flap_id: 1
    latency_curriculum:
      enabled: false
      strategy: exclusive
      latencies: null
      phase_steps: null
      phase_distributions: null
      new_latency_passes: 1.0
      replay_passes: 0.25
      target_total_passes: 2.0
      final_equalization: true
      step_budget_mode: auto
      eval_at_phase_end: false
      save_at_phase_end: false
      computed_plan: null
    per_device_batch_size: 16
    load_all_data_for_training: true
    num_obs_frames: 1
    image_mode: single
    prompt_mode: raw
    stitch_grid:
    - 2
    - 2
    obs_image_size: null
    video_backend: torchvision_av
    gymnasium_task_contract:
      action_labels:
      - noop
      - fire
      - right
      - left
      - rightfire
      - leftfire
      action_values:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      base_prompt: 'Protect both buildings from flying saucers. Choose exactly one
        action from: noop, fire, right, left, rightfire, leftfire.'
      env_fps: 50.0
      env_id: LatencyBench/AirRaid-v0
      frame_stack: 4
      make_kwargs:
        base_env_id: ALE/AirRaid-v5
        base_make_kwargs:
          difficulty: 0
          frameskip: 1
          full_action_space: false
          max_num_frames_per_episode: 108000
          mode: 1
          obs_type: rgb
          repeat_action_probability: 0.0
        fire_reset: true
        noop_max: 30
        render_mode: rgb_array
        screen_size: 84
      noop_action_id: 0
      obs_fps: 12.5
      registration_imports:
      - latency_bench.envs.gymnasium_air_raid
      task_name: air_raid
    active_action_dim: 6
dataset:
  source_hf: ''
  config_name: null
  source_subdir: null
  converted_name: air_raid_l0_random_noop_fire_reset_return_gt2500_100ep
  single_source_hf: ''
  mixed_source_hf: ''
  single_converted_name: air_raid_l0_random_noop_fire_reset_return_gt2500_100ep
  mixed_converted_name: air_raid_l0_random_noop_fire_reset_return_gt2500_100ep
  single_latency_filter: null
  mixed_latency_filter: null
  force_download: false
  setup_force: false
  skip_verification: false
  target_latency_unit: observation_steps
  verify_rows: 200
  max_episodes: null
  episodes_per_latency: null
  latency_filter: null
  debug_subset:
    enabled: false
    max_episodes: 5
    suffix: debug
base_model:
  repo_id: Qwen/Qwen3-VL-4B-Instruct
initialization:
  checkpoint_local_dir: null
  checkpoint_hf_repo_id: null
  checkpoint_filename: null
trainer:
  max_train_steps: 5000
  num_warmup_steps: 100
  save_interval: 5000
  eval_interval: 500
  eval_num_batches: 200
  per_latency_eval_num_batches: null
  eval_action_classification: true
  eval_action_classification_interval: null
  cc_f1_tolerance: 1
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  freeze_vit: false
  freeze_tied_embedding: false
  freeze_llm_layers: []
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 1
  profile_timing:
    enabled: true
    log_interval: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  distributed_backend: deepspeed
  is_resume: false
  pretrained_checkpoint: null
  resume_step: 0
  reload_modules: null
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
    fused: true
  save_format: pt
workspace_dir: /path/to/user/code/placeholder
run_root_dir: /path/to/mount/placeholder/openvla_runs
seed: 42
wandb_entity: placeholder
wandb_project: placeholder
auth:
