    latency_seed_stride: 0
    task_seed_stride: 0
    task_description: ''
    eval_parallel_envs: 5
    action_chunk_execution:
      enabled: false
      chunk_size: null
    enabled: false
    gymnasium:
      make_kwargs: {}
    mid_train:
      enabled: false
      interval_steps: 100
      latencies:
      - 0
      num_episodes: 5
      max_steps_per_episode: 3600
    post_train:
      enabled: false
      latencies:
      - 0
      - 1
      - 2
      - 3
      - 4
      num_episodes: 5
      max_steps_per_episode: 3600
    eval_backend: latency_bench
    distributed_mode: none
    vectorized:
      enabled: false
      batch_size: 1
    latency:
      prompt_map_path: null
      mode: single
      values:
      - 0
  task: gymnasium
  gymnasium:
    task_contract:
      action_labels:
      - noop
      - fire
      - right
      - left
      - rightfire
      - leftfire
      action_values:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      base_prompt: 'Protect both buildings from flying saucers. Choose exactly one
        action from: noop, fire, right, left, rightfire, leftfire.'
      env_fps: 50.0
      env_id: LatencyBench/AirRaid-v0
      frame_stack: 4
      make_kwargs:
        base_env_id: ALE/AirRaid-v5
        base_make_kwargs:
          difficulty: 0
          frameskip: 1
          full_action_space: false
          max_num_frames_per_episode: 108000
          mode: 1
          obs_type: rgb
          repeat_action_probability: 0.0
        fire_reset: true
        noop_max: 30
        render_mode: rgb_array
        screen_size: 84
      noop_action_id: 0
      obs_fps: 12.5
      registration_imports:
      - latency_bench.envs.gymnasium_air_raid
      task_name: air_raid
    task_name: air_raid
  initialization_mode: scratch
  action_carrier: native
model: openvla
env: gymnasium
init: scratch
mode: single
checkpoint:
