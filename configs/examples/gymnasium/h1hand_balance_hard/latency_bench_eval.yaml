__base__: small_model_train.yaml

experiment:
  name: gymnasium_h1hand_balance_hard_zero_latency_random_eval

backend:
  run_mode: eval

policy:
  type: random

evaluation:
  eval_episodes: 1
  eval_parallel_envs: 1
  eval_max_steps: 1000
  eval_latency_values: [0]

logging:
  output_dir: outputs/examples/gymnasium/h1hand_balance_hard/random_eval
  video:
    enabled: true
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
