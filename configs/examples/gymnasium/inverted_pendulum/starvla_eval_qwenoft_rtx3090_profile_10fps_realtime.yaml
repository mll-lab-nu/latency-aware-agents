experiment:
  name: inverted_pendulum_profile_latency_openvla_realtime_10fps
  seed: 0

executor:
  mode: realtime
  inference_devices: [cuda:0]

env:
  name: gymnasium
  task_name: inverted_pendulum
  env_id: LatencyBench/InvertedPendulumDiscrete-v0
  registration_imports: [latency_bench.envs.tasks.inverted_pendulum]
  make_kwargs:
    base_env_id: InvertedPendulum-v4
    render_mode: rgb_array
    force_values: [-3.0, -1.5, 0.0, 1.5, 3.0]
    base_make_kwargs: {}
  env_fps: 10.0
  obs_fps: 10.0
  obs_resize: [224, 224]
  frame_stack: 1
  state_space:
    labels: [cart_position, pole_angle, cart_velocity, pole_angular_velocity]
  noop_action: zero_force
  action_map:
    push_left_hard: 0
    push_left_soft: 1
    zero_force: 2
    push_right_soft: 3
    push_right_hard: 4
  action_order:
    - push_left_hard
    - push_left_soft
    - zero_force
    - push_right_soft
    - push_right_hard
  base_prompt: >-
    Keep the pole upright by applying horizontal cart forces. Choose exactly one action from:
    push_left_hard, push_left_soft, zero_force, push_right_soft, push_right_hard.

latency:
  method: measured
  device: cuda:0
  sync_cuda: true

scheduler:
  hold_policy: hold
  ordering_policy: latest_ready

policy:
  type: starvla
  actions:
    - push_left_hard
    - push_left_soft
    - zero_force
    - push_right_soft
    - push_right_hard
  checkpoint_path: /workspace/artifacts/extra-envs-checkpoints/OpenVLA/profile-latency/inverted_pendulum_rgb_state_qwenoft_rtx3090_profile_10fps_return_gt900_100ep_openvla_native_sft_2k/checkpoints/steps_2000_pytorch_model.pt
  model_config_path: /workspace/artifacts/extra-envs-checkpoints/OpenVLA/profile-latency/inverted_pendulum_rgb_state_qwenoft_rtx3090_profile_10fps_return_gt900_100ep_openvla_native_sft_2k/config.full.yaml
  task_manifest_path: /workspace/runtime/inverted_pendulum_profile_latency_openvla_10fps/task_manifest.json
  device: cuda:0
  prompt_mode: raw

evaluation:
  eval_episodes: 5
  eval_parallel_envs: 1
  eval_max_steps: 1000

logging:
  output_dir: /workspace/runtime/inverted_pendulum_profile_latency_openvla_10fps/outputs
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  realtime_pipeline_profile: true
