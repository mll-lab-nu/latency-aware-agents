__base__: small_model_train.yaml

experiment:
  name: gymnasium_humanoid_latency_bench_eval

backend:
  run_mode: eval

evaluation:
  episodes: 10
  max_env_steps: 1000
  suites:
  - name: eval_latency_0
    latency:
      method: zero
  - name: eval_latency_1
    latency:
      method: fixed
      fixed_latency_ms: 14.999999999999998
  - name: eval_latency_2
    latency:
      method: fixed
      fixed_latency_ms: 29.999999999999996
  - name: eval_latency_3
    latency:
      method: fixed
      fixed_latency_ms: 45.0
  - name: eval_latency_4
    latency:
      method: fixed
      fixed_latency_ms: 59.99999999999999

logging:
  output_dir: /mnt/results/latency-sensitive-bench/tasks/humanoid/latency_bench_eval
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
executor:
  parallel_envs: 1
