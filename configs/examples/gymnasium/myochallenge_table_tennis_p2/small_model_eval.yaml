__base__: small_model_train.yaml

backend:
  run_mode: eval

policy:
  type: gymnasium_sf
  checkpoint_path: ''
  checkpoint_kind: latest
  device: cpu
  deterministic: true

# One deterministic episode per delay verifies the pipeline, not policy robustness.
evaluation:
  eval_episodes: 1
  eval_parallel_envs: 1
  eval_max_steps: 300
  eval_deterministic: true
  eval_latency_values: [0, 1, 2, 5, 10]

logging:
  output_dir: outputs/examples/gymnasium/myochallenge_table_tennis_p2/zero_eval
  video:
    enabled: true
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
