  base_prompt: Return the incoming ping-pong ball with the paddle so it contacts
    the paddle exactly once and lands on the opponent side without touching the
    agent side. Predict 275 continuous muscle and actuator controls in [-1, 1]
    in the native MuJoCo actuator order.
latency:
  method: zero
  add_latency_info: false
scheduler:
  hold_policy: hold
  ordering_policy: issue_order_fifo
policy:
  type: random
# Fast integration smoke budget; use a separate experiment config for converged runs.
training:
  train_for_env_steps: 4096
  num_workers: 1
  num_envs_per_worker: 1
  worker_num_splits: 1
  num_policies: 1
  batch_size: 256
  rollout: 64
  recurrence: 1
  num_epochs: 1
  num_batches_per_epoch: 1
  max_policy_lag: 300
  learning_rate: 0.000303
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 4.0
  exploration_loss_coeff: 0.0
  kl_loss_coeff: 0.1
  async_rl: false
  batched_sampling: false
  use_rnn: false
  encoder_mlp_layers:
  - 64
  - 64
  normalize_input: true
  normalize_returns: true
  save_every_sec: 600
  keep_checkpoints: 5
evaluation:
  eval_interval_steps: null
  eval_episodes: 1
  eval_parallel_envs: 1
  eval_max_steps: 300
  eval_deterministic: true
logging:
  output_dir: outputs/examples/gymnasium/myochallenge_table_tennis_p2/zero_train
  video:
    enabled: false
    num_bins: 1
  save_step_records: false
  save_action_records: false
  save_latency_records: false
