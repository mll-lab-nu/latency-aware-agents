__base__: small_model_train.yaml

experiment:
  name: gymnasium_myochallenge_table_tennis_p2_random_latency_eval

backend:
  run_mode: eval

policy:
  type: random

# One deterministic episode per delay verifies the pipeline, not policy robustness.
evaluation:
  eval_episodes: 1
  eval_parallel_envs: 1
  eval_max_steps: 300
  eval_latency_values: [0, 1, 2, 5, 10]

logging:
  output_dir: outputs/examples/gymnasium/myochallenge_table_tennis_p2/random_eval
  video:
    enabled: true
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
