__base__: small_model_train.yaml

experiment:
  name: gymnasium_atlantis_starvla_fixed_l1

backend:
  run_mode: eval

policy:
  type: starvla
  checkpoint_path: ""
  device: cuda
  deterministic: true

evaluation:
  eval_episodes: 5
  eval_parallel_envs: 1
  eval_max_steps: 5000
  eval_deterministic: true

logging:
  output_dir: outputs/examples/gymnasium_atlantis/starvla_eval
  video:
    enabled: true
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
