__base__: small_model_train.yaml

experiment:
  name: gymnasium_air_raid_latency_bench_eval

backend:
  run_mode: eval

policy:
  type: random

evaluation:
  episodes: 5
  max_env_steps: 3600
logging:
  output_dir: outputs/examples/gymnasium_air_raid/latency_bench_eval
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
executor:
  parallel_envs: 1
