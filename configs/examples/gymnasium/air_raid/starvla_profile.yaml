__base__: latency_bench_eval.yaml

experiment:
  name: gymnasium_air_raid_starvla_profile

env:
  make_kwargs:
    noop_max: 30
    fire_reset: true

policy:
  type: starvla
  task_manifest_path:
    /ABSOLUTE/DATASET/manifest.json
  latency_prompt_map_path:
    /ABSOLUTE/DATASET/latency_prompt_map.json
  latency_prompt_key: 0

  source: local
  root: outputs/models/air_raid_l0_random_noop_fire_reset_return_gt2500_100ep_openvla_native_sft_5k
  checkpoint: checkpoints/steps_5000_pytorch_model.pt
  model_config: config.full.yaml
logging:
  output_dir: outputs/examples/gymnasium_air_raid/starvla_profile
executor:
  inference_devices:
  - cuda
