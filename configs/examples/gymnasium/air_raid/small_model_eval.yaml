__base__: small_model_train.yaml

backend:
  run_mode: eval

policy:
  type: gymnasium_sf
  checkpoint_path: ""
  checkpoint_kind: latest
  device: cuda
  deterministic: true

evaluation:
  eval_episodes: 10
  eval_parallel_envs: 1
  eval_max_steps: 3600
  eval_deterministic: true

logging:
  output_dir: outputs/examples/gymnasium_air_raid/eval
  video:
    enabled: true
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
