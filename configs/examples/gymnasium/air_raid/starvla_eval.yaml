__base__: latency_bench_eval.yaml

experiment:
  name: gymnasium_air_raid_starvla_l0

env:
  make_kwargs:
    noop_max: 30
    fire_reset: true

policy:
  type: starvla
  checkpoint_path: third_party/starVLA/results/Checkpoints/air_raid_l0_openvla_sft/checkpoints/steps_2000_model.safetensors
  model_config_path: third_party/starVLA/results/Checkpoints/air_raid_l0_openvla_sft/config.full.yaml
  task_manifest_path: third_party/starVLA/playground/Datasets/rl_games/air_raid_l0/manifest.json
  device: cuda
  latency_prompt_map_path: third_party/starVLA/playground/Datasets/rl_games/air_raid_l0/latency_prompt_map.json
  latency_prompt_key: 1

evaluation:
  eval_episodes: 10
  eval_parallel_envs: 1
  eval_max_steps: 3600

logging:
  output_dir: outputs/examples/gymnasium_air_raid/starvla_eval
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
