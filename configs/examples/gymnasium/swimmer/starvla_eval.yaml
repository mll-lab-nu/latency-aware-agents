__base__: latency_bench_eval.yaml

experiment:
  name: gymnasium_swimmer_starvla_eval

policy:
  type: starvla
  task_manifest_path: ''
  latency_prompt_map_path: ''
  latency_prompt_key: 0

  source: local
  root: .
evaluation:
  episodes: 20
  suites:
  - name: eval_latency_0
    latency:
      method: zero
  - name: eval_latency_2
    latency:
      method: fixed
      fixed_latency_ms: 80.0

logging:
  output_dir: /mnt/results/latency-sensitive-bench/tasks/swimmer/starvla_eval
executor:
  inference_devices:
  - cuda
