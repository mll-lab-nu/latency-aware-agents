__base__: small_model_train.yaml

experiment:
  name: gymnasium_mountain_car_fixed_l3

backend:
  run_mode: eval

policy:
  type: gymnasium_sf
  checkpoint_path: ""
  checkpoint_kind: latest
  device: cpu
  deterministic: true

evaluation:
  eval_episodes: 5
  eval_parallel_envs: 1
  eval_max_steps: 200
  eval_deterministic: true
  eval_raw_reward: true

logging:
  output_dir: outputs/examples/gymnasium_mountain_car/eval
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
