experiment:
  name: balance_h16_fixed100_mcppo_s1
  seed: 1

backend:
  type: sample_factory
  algo: PPO
  device: cuda
  train_dir: outputs/tasks/humanoidbench_balance_simple/ppo_fixed100
  restart_behavior: overwrite
  run_mode: train
  actor_worker_gpus: []
  initial_model_path: outputs/tasks/humanoidbench_balance_simple/h16_fixed100_delayed_imitation/20260916T061955Z/followup_20260916T070429Z/student_correction_2000.pth

executor:
  mode: simulated
  simulated_worker_capacity: 1

env:
  name: gymnasium
  task_name: g1_sonic_balance_simple
  env_id: LatencyBench/G1SonicBalanceSimple-v0
  registration_imports:
    - latency_bench.envs.tasks.humanoidbench.sonic
  make_kwargs:
    max_episode_steps: 1000
    render_mode: null
    width: 256
    height: 256
    scene_path: ./results/humanoidbench_g1_sonic_assets/assets/sonic_g1/envs/scene_balance_simple.xml
    control_mode: raw_body_target
    raw_learn_hands: true
  env_fps: 50
  obs_fps: 50
  frame_stack: 1
  action_space:
    type: box
    labels:
      - body_0
      - body_1
      - body_2
      - body_3
      - body_4
      - body_5
      - body_6
      - body_7
      - body_8
      - body_9
      - body_10
      - body_11
