__base__: fasttd3_train.yaml

backend:
  run_mode: eval
  extra_args: [--load_checkpoint_kind, best]

policy:
  type: sample_factory
  checkpoint_kind: best
  deterministic: true

evaluation:
  suites:
  - name: eval_latency_0
    latency:
      method: zero

logging:
  output_dir: outputs/tasks/humanoidbench_balance_simple/eval_best_l0
  video:
    enabled: true
  save_step_records: true
  save_action_records: true
executor:
  inference_devices:
  - cuda
