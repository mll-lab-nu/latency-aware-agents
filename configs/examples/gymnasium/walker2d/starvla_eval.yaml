__base__: latency_bench_eval.yaml
experiment:
  name: gymnasium_walker2d_continuous_starvla
policy:
  type: starvla
  checkpoint_path: /mnt/checkpoints/latency-sensitive-bench/walker2d/starvla/checkpoint.safetensors
  model_config_path: /mnt/checkpoints/latency-sensitive-bench/walker2d/starvla/config.full.yaml
  task_manifest_path: /mnt/data/latency-sensitive-bench/walker2d/vla/manifest.json
  device: cuda
  latency_prompt_map_path: /mnt/data/latency-sensitive-bench/walker2d/vla/latency_prompt_map.json
  latency_prompt_key: 0
  action_carrier: bridge_continuous_7d
evaluation:
  eval_episodes: 10
  eval_parallel_envs: 1
  eval_max_steps: 1000
  eval_latency_values:
  - 0
  - 1
  - 2
  - 3
  - 4
logging:
  output_dir: /mnt/data/latency-sensitive-bench/walker2d/starvla_eval
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
