__base__: small_model_train_sf_official_10m.yaml

backend:
  run_mode: eval

policy:
  type: sample_factory
  checkpoint_kind: best
  deterministic: true

  source: local
  root: .
evaluation:
  episodes: 10
  max_env_steps: 1000
  suites:
  - name: eval_latency_0
    latency:
      method: zero
  - name: eval_latency_1
    latency:
      method: fixed
      fixed_latency_ms: 8.0
  - name: eval_latency_2
    latency:
      method: fixed
      fixed_latency_ms: 16.0
  - name: eval_latency_3
    latency:
      method: fixed
      fixed_latency_ms: 24.0
  - name: eval_latency_4
    latency:
      method: fixed
      fixed_latency_ms: 32.0

logging:
  output_dir: /mnt/data/latency-sensitive-bench/walker2d/continuous_sf_official_10m_best_eval
  video:
    enabled: true
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
executor:
  inference_devices:
  - cuda
  parallel_envs: 1
