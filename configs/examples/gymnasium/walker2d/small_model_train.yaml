__base__: small_model_train_sf_official_10m.yaml

experiment:
  name: gymnasium_walker2d_zero_latency_sf_official_10m

env:
  task_name: walker2d
  state_space:
    labels:
      - torso_height
      - torso_angle
      - right_thigh_angle
      - right_leg_angle
      - right_foot_angle
      - left_thigh_angle
      - left_leg_angle
      - left_foot_angle
      - torso_x_velocity
      - torso_z_velocity
      - torso_angular_velocity
      - right_thigh_angular_velocity
      - right_leg_angular_velocity
      - right_foot_angular_velocity
      - left_thigh_angular_velocity
      - left_leg_angular_velocity
      - left_foot_angular_velocity

logging:
  output_dir: /path/to/mount/placeholder/tasks/walker2d/small_model_train
