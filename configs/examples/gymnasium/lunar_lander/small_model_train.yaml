experiment:
  name: gymnasium_lunar_lander_discrete_fixed_l1
  seed: 0

backend:
  type: sample_factory
  algo: APPO
  device: cuda
  train_dir: outputs/examples/gymnasium_lunar_lander/checkpoints
  restart_behavior: overwrite
  run_mode: train

executor:
  mode: simulated

env:
  name: gymnasium
  task_name: lunar_lander_discrete
  env_id: LunarLander-v2
  registration_imports: []
  make_kwargs:
    render_mode: rgb_array
    continuous: false
    gravity: -10.0
    enable_wind: false
    wind_power: 15.0
    turbulence_power: 1.5
  env_fps: 50
  obs_fps: 50
  frame_stack: 1
  noop_action: do_nothing
  action_map:
    do_nothing: 0
    fire_left_orientation_engine: 1
    fire_main_engine: 2
    fire_right_orientation_engine: 3
  action_order:
    - do_nothing
    - fire_left_orientation_engine
    - fire_main_engine
    - fire_right_orientation_engine
  base_prompt: >-
    Land the spacecraft safely between the flags. Choose exactly one action from:
    do_nothing, fire_left_orientation_engine, fire_main_engine, fire_right_orientation_engine.

latency:
  method: fixed
  fixed_latency_ms: 20.0
  add_latency_info: false

scheduler:
  hold_policy: hold
  ordering_policy: issue_order_fifo

policy:
  type: random
  actions:
    - do_nothing
    - fire_left_orientation_engine
    - fire_main_engine
    - fire_right_orientation_engine

training:
  train_for_env_steps: 1000000
  num_workers: 1
  num_envs_per_worker: 16
  worker_num_splits: 1
  num_policies: 1
  batch_size: 1024
  rollout: 64
  recurrence: 32
  num_epochs: 2
  num_batches_per_epoch: 8
  max_policy_lag: 300
  learning_rate: 0.000303
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.0
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  save_every_sec: 600
  keep_checkpoints: 5

evaluation:
  eval_interval_steps: null
  eval_episodes: 5
  eval_parallel_envs: 1
  eval_max_steps: 1000
  eval_deterministic: true

logging:
  output_dir: outputs/examples/gymnasium_lunar_lander/train
  video:
    enabled: false
    num_bins: 1
  save_step_records: false
  save_action_records: false
  save_latency_records: false
