experiment:
  name: gymnasium_lunar_lander_discrete_latency_bench_eval
  seed: 0

executor:
  mode: simulated

  parallel_envs: 1
env:
  name: lunar_lander_discrete
  make_kwargs:
    render_mode: rgb_array
    continuous: false
    gravity: -10.0
    enable_wind: false
    wind_power: 15.0
    turbulence_power: 1.5
  env_fps: 50
  obs_fps: 50
  frame_stack: 1
  noop_action: do_nothing
  action_map:
    do_nothing: 0
    fire_left_orientation_engine: 1
    fire_main_engine: 2
    fire_right_orientation_engine: 3
  action_order:
    - do_nothing
    - fire_left_orientation_engine
    - fire_main_engine
    - fire_right_orientation_engine
  base_prompt: >-
    Land the spacecraft safely between the flags. Choose exactly one action from:
    do_nothing, fire_left_orientation_engine, fire_main_engine, fire_right_orientation_engine.

latency:
  method: fixed
  fixed_latency_ms: 20.0

scheduler:
  hold_policy: hold
  ordering_policy: issue_order_fifo

policy:
  type: random
  actions:
    - do_nothing
    - fire_left_orientation_engine
    - fire_main_engine
    - fire_right_orientation_engine

evaluation:
  episodes: 5
  max_env_steps: 1000
logging:
  output_dir: outputs/examples/gymnasium_lunar_lander/latency_bench_eval
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
