__base__: task.yaml
experiment:
  name: starvla_demon_attack_profile
  seed: 42
backend:
  algo: APPO
  device: cpu
  train_dir: results/sample_factory
  restart_behavior: resume
  run_mode: eval
executor:
  mode: realtime
  simulated_worker_capacity: null
  parallel_envs: 1
  inference_devices:
  - cuda:0
  sync_cuda: true
policy:
  type: starvla
  actions:
  - NOOP
  - FIRE
  - RIGHT
  - LEFT
  - RIGHTFIRE
  - LEFTFIRE
  deterministic: true
  unnorm_key: new_embodiment
  prompt_mode: latency_neutral
  source: hf
  root: zero-latency/demon-attack/vla/starvla-qwenoft-h1/demon_attack_fix_latency_0_200ep
  checkpoint: checkpoints/steps_7000_model.safetensors
  model_config: config.full.yaml
  revision: a4099f759f71ffa72d967be3695c8e054cfc377c
  hf_repo: MLL-Lab/LAGEN-models
training:
  train_for_env_steps: 25000000
  num_workers: 1
  num_envs_per_worker: 512
  worker_num_splits: 1
  num_policies: 1
  batch_size: 1024
  batched_sampling: true
  rollout: 64
  recurrence: 32
  num_epochs: 2
  num_batches_per_epoch: 8
  max_policy_lag: 300
  learning_rate: 0.000303
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.0
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5
evaluation:
  eval_interval_steps: 1000000
  eval_raw_reward: true
  episodes: 10
  max_env_steps: 14400
  suites: []
logging:
  output_dir: outputs/profiling
  video:
    enabled: false
    num_bins: 10
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  wandb_project: latency-sensitive-bench
  wandb_group: demon_attack-new(remove training episode limit)
  wandb_job_type: sample_factory
  wandb_tags: ''
profiling:
  model_id: openvla
  workload_id: demon_attack
  repeats: 5
  calibration: null
