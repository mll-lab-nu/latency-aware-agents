models:
  openvla:
    workloads:
      flappy:
        base_config: configs/experiments/flappy/realtime/starvla_openvla_fix_latency_2_16fps_l2_2gpu_warmup200_3ep.yaml
        checkpoint_path: /mnt/data/latency_data/openvla_flappy_fix_latency_2/checkpoints/steps_5000_pytorch_model.pt
        checkpoint_kind: best
        session_count: 5
        n_episodes: 100
        evaluation_seed: 0
        calibrate_env_fps: true
        target_latency_frames: 2
        worker_utilization_cap: 0.8
        simulation_parallel_envs: 1
        simulation_env:
          simulator: cpu
          use_gpu_render: false
  official_gr00t:
    workloads:
      g1_sonic_balance_simple:
        base_config: configs/examples/gymnasium/g1_sonic_balance_simple/official_gr00t_eval.yaml
