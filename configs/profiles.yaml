models:
  openvla:
    workloads:
      flappy:
        base_config: configs/experiments/flappy/realtime/starvla_openvla_fix_latency_2_16fps_l2_2gpu_warmup200_3ep.yaml
        model_artifact:
          local_root: /mnt/data/latency_data/openvla_flappy_fix_latency_2
          checkpoint: checkpoints/steps_5000_pytorch_model.pt
          model_config: config.full.yaml
          hf_repo: latency-sensitive-bench/openvla_flappy_fix_latency_2
          hf_path: .
        checkpoint_kind: best
        session_count: 5
        eval_episodes: 10
        evaluation_seed: 0
        calibrate_env_fps: true
        target_latency_frames: 2
        worker_utilization_cap: 0.8
        simulation_parallel_envs: 1
        simulation_gpu: null
        simulation_env:
          simulator: cpu
          use_gpu_render: false
  qwenoft:
