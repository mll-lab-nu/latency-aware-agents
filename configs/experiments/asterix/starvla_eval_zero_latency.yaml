__base__: ../../base/asterix.yaml

experiment:
  name: starvla_asterix_zero_latency_eval
  seed: 42

backend:
  run_mode: eval

env:
  obs_resize: [224, 224]
  simulator: gpu
  gpu_env_device: auto
  noop_max: 30
  clip_reward: false
  terminal_on_life_loss: false

latency:
  method: zero
  add_latency_info: false

policy:
  type: starvla
  task_manifest_path: ""
  unnorm_key: new_embodiment
  prompt_mode: raw
  action_layout: factorized_6

  source: local
  root: .
evaluation:
  eval_raw_reward: true
  episodes: 100
  max_env_steps: 5000
  suites: []

logging:
  output_dir: outputs/starvla_asterix_zero_latency_eval
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  wandb_project: null
  wandb_group: null
  wandb_job_type: null
executor:
  inference_devices:
  - cuda
  parallel_envs: 10
  env_backend: asterix_gpu_batched
