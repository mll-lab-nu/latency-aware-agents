__base__: ../../base/asterix.yaml

experiment:
  name: asterix_sf_zero_latency
  seed: 42

backend:
  run_mode: eval

env:
  frame_stack: 4
  simulator: cpu

latency:
  method: zero
  add_latency_info: false

policy:
  type: sample_factory
  checkpoint_kind: latest
  deterministic: true

  source: local
  root: .
evaluation:
  episodes: 100
  max_env_steps: 5000
  suites: []

logging:
  output_dir: outputs/asterix_sf_eval_zero_latency
  video:
    enabled: false
    num_bins: 1
  save_step_records: false
  save_action_records: false
  save_latency_records: false
executor:
  inference_devices:
  - auto
  parallel_envs: 32
