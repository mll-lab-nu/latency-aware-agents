experiment:
  name: demon_attack-qwenpi_v3-hist8-scratch-s42-v2-vlm3e-6-step5000-history01-profile-par32
  seed: 1000000
backend:
  type: sample_factory
  algo: APPO
  device: cpu
  train_dir: results/sample_factory
  restart_behavior: resume
  run_mode: eval
executor:
  mode: simulated
  simulated_worker_capacity: 1
  simulated_inference_pool: true
  inference_devices:
  - cuda:0
  - cuda:1
  inference_batch_size: 16
env:
  name: demon_attack
  env_id: ALE/DemonAttack-v5
  env_fps: 60
  obs_fps: 15
  screen_size: 84
  noop_max: 30
  reset_mode: fire
  frame_stack: 1
  terminal_on_life_loss: true
  clip_reward: false
  repeat_action_probability: 0.0
  full_action_space: false
  max_episode_steps: 25000
  noop_action: 0
  simulator: gpu
  gpu_env_device: auto
  obs_resize:
  - 224
  - 224
  action_history_decisions: 8
latency:
  method: temporal
  profile_path: profiles/profile.json
  profile_worker_slot: 0
  seed: 271828
  add_latency_info: false
scheduler:
  hold_policy: hold
  ordering_policy: latest_ready
policy:
  type: starvla
  actions:
  - NOOP
  - FIRE
  - RIGHT
  - LEFT
  - RIGHTFIRE
  - LEFTFIRE
  checkpoint_path: checkpoints/model.pt
  model_config_path: config.yaml
  device: cuda:0
  unnorm_key: new_embodiment
  prompt_mode: latency_neutral
  backbone_path: BACKBONE_SNAPSHOT
  worker_python_executable: python
  state_source: transport
training:
  train_for_env_steps: 25000000
  num_workers: 1
  num_envs_per_worker: 512
  worker_num_splits: 1
  num_policies: 1
  batch_size: 1024
  batched_sampling: true
  rollout: 64
  recurrence: 32
  num_epochs: 2
  num_batches_per_epoch: 8
  max_policy_lag: 300
  learning_rate: 0.000303
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.0
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5
evaluation:
  eval_interval_steps: 1000000
  eval_episodes: 100
  eval_parallel_envs: 32
  eval_max_steps: 7200
  eval_deterministic: true
  eval_raw_reward: true
  eval_suites:
    fixed: []
    normal: []
    uniform: []
  latency_bench_env_backend: demon_attack_gpu_batched
  eval_latency_values: null
logging:
  output_dir: replay_outputs/profile
  video:
    enabled: false
    num_bins: 10
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  wandb_project: null
  wandb_group: null
  wandb_job_type: null
  wandb_tags: ''
