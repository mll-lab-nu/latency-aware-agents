experiment:
  name: inverted_pendulum_F_newV_10fps_20260911T010114Z-ip10
  seed: 42
executor:
  mode: realtime
  inference_devices:
  - cuda:0
  sync_cuda: true
  parallel_envs: 1
env:
  name: inverted_pendulum
  make_kwargs:
    base_env_id: InvertedPendulum-v4
    render_mode: rgb_array
    force_values:
    - -3.0
    - -1.5
    - 0.0
    - 1.5
    - 3.0
    base_make_kwargs: {}
  env_fps: 10.0
  obs_fps: 10.0
  frame_stack: 1
  state_space:
    labels:
    - cart_position
    - pole_angle
    - cart_velocity
    - pole_angular_velocity
  noop_action: zero_force
  action_map:
    push_left_hard: 0
    push_left_soft: 1
    zero_force: 2
    push_right_soft: 3
    push_right_hard: 4
  action_order:
  - push_left_hard
  - push_left_soft
  - zero_force
  - push_right_soft
  - push_right_hard
  base_prompt: 'Keep the pole upright by applying horizontal cart forces. Choose exactly
    one action from: push_left_hard, push_left_soft, zero_force, push_right_soft,
    push_right_hard.'
  obs_resize:
  - 224
  - 224
scheduler:
  hold_policy: hold
  ordering_policy: issue_order_fifo
policy:
  type: starvla
  actions:
  - push_left_hard
  - push_left_soft
  - zero_force
  - push_right_soft
  - push_right_hard
  task_manifest_path: /workspace/tasks/20260911T010114Z-ip10/final_bundle/manifest.json
  latency_prompt_map_path: /workspace/tasks/20260911T010114Z-ip10/final_bundle/latency_prompt_map.json
  latency_prompt_key: 1
  prompt_mode: raw
  worker_python_executable: /venv/starvla_rl_games_openvla/bin/python
  source: local
  root: /workspace/tasks/20260911T010114Z-ip10/final_bundle
  checkpoint: checkpoints/steps_2000_pytorch_model.pt
  model_config: config.full.yaml
evaluation:
  episodes: 20
  max_env_steps: 1000
logging:
  output_dir: /workspace/tasks/20260911T010114Z-ip10/F
  video:
    enabled: false
    num_bins: 1
  save_step_records: true
  save_action_records: true
  save_latency_records: true
provenance:
  model_provenance:
    source: huggingface
    repo_id: latency-sensitive-bench/extra-envs-checkpoints
    revision: c897f1e74bfecb000532b4cca7c846ab6bb2451a
    path_in_repo: OpenVLA/profile-latency-new/inverted_pendulum/20260911T010114Z-ip10
    checkpoint: checkpoints/steps_2000_pytorch_model.pt
    model_config: config.full.yaml
