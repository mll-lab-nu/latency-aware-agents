__base__:
  - ../../base/flappy.yaml

experiment:
  name: starvla_openvla_flappy_fix_latency_0_200ep
  seed: 42

executor:
  mode: simulated

env:
  env_fps: 30
  obs_fps: 30
  frame_stack: 1
  obs_resize: [224, 224]

policy:
  type: starvla
  checkpoint_path: /workspace/starVLA/results/Checkpoints/flappy_fix_latency_0_200ep/checkpoints/steps_5000_state/model.safetensors
  device: cuda
  unnorm_key: new_embodiment
  latency_prompt_map_path: /workspace/latency-sensitive-bench/prompt_map/flappy_fix_latency_prompt_map.json
  actions:
    - noop
    - flap

latency:
  type: zero

evaluation:
  eval_episodes: 20
  eval_parallel_envs: 4
  eval_max_steps: 3600
  eval_suites:
    fixed:
      - [0, 4]
    normal: []
    uniform: []

logging:
  output_dir: outputs/starvla_openvla_flappy_fix_latency_0_200ep
  save_step_records: false
  save_action_records: false
  save_latency_records: false
  video:
    enabled: false
