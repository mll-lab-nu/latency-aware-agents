__base__: ../../base/flappy.yaml
experiment_family: flappy_decision_history_temporal_25m_seed42
generated_root: configs/train/flappy/decision_history_temporal_25m_seed42
train_dir: results/checkpoints/flappy/decision_history_temporal_25m_seed42
output_root: outputs/tasks/flappy/decision_history_temporal_25m_seed42
device: cuda
restart_behavior: resume

env:
  env_fps: 10
  obs_fps: 10
  action_history_decisions: 8

executor:
  simulated_worker_capacity: 1

  parallel_envs: 100
seeds: [42]

training:
  train_for_env_steps: 25000000
  lr_schedule: linear_decay

evaluation:
  checkpoint_interval_steps: 5000000
  episodes: 100
  max_env_steps: 18000
  suites:
  - name: fixed_0
    latency:
      method: zero
  - name: fixed_1
    latency:
      method: fixed
      fixed_latency_ms: 100.0
  - name: fixed_2
    latency:
      method: fixed
      fixed_latency_ms: 200.0
  - name: fixed_3
    latency:
      method: fixed
      fixed_latency_ms: 300.0
  - name: normal_mean_2_std_1_min_0_max_15
    latency:
      method: normal
      mean_latency_ms: 200.0
      std_latency_ms: 100.0
      min_latency_ms: 0.0
      max_latency_ms: 1500.0
      seed: 0
  - name: uniform_min_1_max_3
    latency:
      method: uniform
      min_latency_ms: 100.0
      max_latency_ms: 300.0
      seed: 0
logging:
  wandb_project: starvla_tasks
  wandb_job_type: flappy_decision_history_temporal
  wandb_tags: [decision_v1]

latency_settings:
  qwenoft_rtx3090_temporal_hist8_capacity1:
    kind: temporal
    profile_path: results/profiling/profiles/openvla/1x-rtx3090/flappy/instance_a5037b165aa0cedc/profile.json
    profile_worker_slot: 0
  gr00t_rtx3090_temporal_hist8_capacity1:
    kind: temporal
    profile_path: results/profiling/profiles/gr00t/1x-rtx3090/flappy/instance_a5037b165aa0cedc/profile.json
    profile_worker_slot: 0
  pi05_rtx3090_temporal_hist8_capacity1:
    kind: temporal
    profile_path: results/profiling/profiles/pi05/1x-rtx3090/flappy/instance_a5037b165aa0cedc/profile.json
    profile_worker_slot: 0

sweeps:
  profile:
    frame_stack: [4]
    obs_fps: [10]
