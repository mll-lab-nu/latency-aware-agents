experiment:
  name: starvla_flappy_simulated_16fps_l2_warmup200_3ep
  seed: 42

executor:
  mode: simulated

  inference_devices:
  - cuda
  parallel_envs: 1
env:
  name: flappy
  gym_id: FlappyBird-v0
  env_fps: 16
  obs_fps: 16
  render_mode: rgb_array
  observation_mode: image
  use_lidar: false
  normalize_obs: true
  audio_on: false
  frame_stack: 1
  obs_resize: [224, 224]
  use_gpu_render: false
  gpu_render_device: auto
  gpu_render_profile: false
  gpu_render_profile_interval: 200
  noop_action: noop
  action_map:
    noop: 0
    flap: 1
  oneshot_actions:
    - flap

latency:
  method: zero

scheduler:
  hold_policy: one_frame_then_noop
  ordering_policy: latest_ready

policy:
  type: starvla
  unnorm_key: new_embodiment
  # Real and simulated runs share the same latency-neutral model prompt.
  prompt_mode: latency_neutral
  actions:
    - noop
    - flap

  source: local
  root: /mnt/data/latency_data/openvla_flappy_fix_latency_2/checkpoints
  checkpoint: steps_5000_pytorch_model.pt
evaluation:
  episodes: 3
  max_env_steps: 3600
  suites:
  - name: eval_latency_2
    latency:
      method: fixed
      fixed_latency_ms: 125.0
logging:
  output_dir: outputs/starvla_realtime_equivalence_warmup2gpu_3ep/simulated_16fps_l2_warmup200_3ep
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  video:
    enabled: false
