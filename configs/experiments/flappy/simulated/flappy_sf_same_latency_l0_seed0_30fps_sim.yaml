experiment:
  name: flappy_sf_same_latency_l0_seed0
  seed: 0
backend:
  type: sample_factory
  algo: APPO
  device: cuda
  train_dir: results/checkpoints
  restart_behavior: resume
  run_mode: eval
executor:
  mode: simulated
env:
  name: flappy
  gym_id: FlappyBird-v0
  env_fps: 30
  obs_fps: 30
  render_mode: rgb_array
  observation_mode: image
  use_lidar: false
  normalize_obs: true
  audio_on: false
  frame_stack: 4
  obs_resize:
  - 84
  - 84
  use_gpu_render: true
  gpu_render_device: auto
  gpu_render_profile: false
  gpu_render_profile_interval: 200
  noop_action: noop
  action_map:
    noop: 0
    flap: 1
  oneshot_actions:
  - flap
latency:
  method: zero
  add_latency_info: false
scheduler:
  hold_policy: one_frame_then_noop
  ordering_policy: latest_ready
policy:
  type: flappy_sf
  actions:
  - noop
  - flap
  checkpoint_path: ''
  device: auto
  deterministic: true
training:
  train_for_env_steps: 15000000
  num_workers: 2
  num_envs_per_worker: 64
  worker_num_splits: 1
  num_policies: 1
  batch_size: 4096
  rollout: 256
  recurrence: 1
  num_epochs: 8
  num_batches_per_epoch: 8
  learning_rate: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.5
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5
evaluation:
  eval_episodes: 10
  eval_parallel_envs: 100
  eval_latency_values:
  - 1
  eval_max_steps: 3600
  eval_deterministic: true
  eval_raw_reward: false
logging:
  output_dir: outputs/simulated/flappy_l0_seed0_best
