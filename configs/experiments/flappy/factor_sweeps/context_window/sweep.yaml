train_dir: results/checkpoints_factor_sweeps/flappy/context_window
output_root: outputs/factor_sweeps/flappy/context_window
device: cuda
restart_behavior: resume
train_upload_repo_id: latency-sensitive-bench/factor-sweeps-models
train_upload_repo_type: model
train_upload_path_prefix: factor_sweeps/flappy/context_window
eval_upload_repo_id: latency-sensitive-bench/factor-sweeps-evals
