__base__: ../../frame_stack/base.yaml
experiment_family: factor_sweep
generated_root: configs/train/factor_sweeps/flappy/context_window
train_dir: results/checkpoints_factor_sweeps/flappy/context_window
output_root: outputs/factor_sweeps/flappy/context_window
device: cuda
restart_behavior: resume
train_upload_repo_id: latency-sensitive-bench/factor-sweeps-models
train_upload_repo_type: model
train_upload_path_prefix: factor_sweeps/flappy/context_window
eval_upload_repo_id: latency-sensitive-bench/factor-sweeps-evals
eval_upload_repo_type: dataset
eval_upload_path_prefix: factor_sweeps/flappy/context_window
seeds:
  - 10
  - 11
  - 12
  - 13
  - 14

evaluation:
  eval_episodes: 100

latency_settings:
  fixed_l2:
    kind: fixed
    frames: 2
  uniform_u1_3:
    kind: uniform
    min: 1
    max: 3

sweeps:
  frame_stack:
    frame_stack:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    obs_fps:
      - 30
