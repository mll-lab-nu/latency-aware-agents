__base__:
  - ../../base/flappy.yaml

# Eval for a QwenOFT checkpoint trained with temporal multi-image input
# (image_mode=multiframe or stitch, num_obs_frames=4). image_mode / num_obs_frames /
# stitch_grid are read from the checkpoint's own config, so only the env's frame_stack
# needs to match here: it must supply num_obs_frames frames per step.

experiment:
  name: starvla_qwenoft_flappy_multiframe4
  seed: 42

executor:
  mode: simulated

  inference_devices:
  - cuda
  parallel_envs: 4
env:
  env_fps: 30
  obs_fps: 30
  frame_stack: 4          # must equal the trained num_obs_frames
  obs_resize: [224, 224]

policy:
  type: starvla
  unnorm_key: new_embodiment
  latency_prompt_map_path: /workspace/latency-sensitive-bench/prompt_map/flappy_fix_latency_prompt_map.json
  actions:
    - noop
    - flap

  source: local
  root: /workspace/starVLA/results/Checkpoints/flappy_qwenoft_multiframe4/checkpoints/steps_5000_state
  checkpoint: model.safetensors
latency:
  method: zero

evaluation:
  episodes: 20
  max_env_steps: 3600
  suites:
  - name: fixed_0
    latency:
      method: zero
  - name: fixed_1
    latency:
      method: fixed
      fixed_latency_ms: 33.333333333333336
  - name: fixed_2
    latency:
      method: fixed
      fixed_latency_ms: 66.66666666666667
  - name: fixed_3
    latency:
      method: fixed
      fixed_latency_ms: 100.0
  - name: fixed_4
    latency:
      method: fixed
      fixed_latency_ms: 133.33333333333334

logging:
  output_dir: outputs/starvla_qwenoft_flappy_multiframe4
  save_step_records: false
  save_action_records: false
  save_latency_records: false
  video:
    enabled: false
