__base__: ../../base/flappy.yaml
experiment_family: flappy_temporal_alternatives_25m
generated_root: outputs/temporal_profiles/policy_comparison/configs
train_dir: outputs/temporal_profiles/policy_comparison/checkpoints
output_root: outputs/temporal_profiles/policy_comparison/teacher_runs
device: cuda
restart_behavior: resume

env:
  env_fps: 10
  obs_fps: 10
  action_history_decisions: 8
executor:
  simulated_worker_capacity: 1
  parallel_envs: 100
seeds: [42]
training:
  train_for_env_steps: 25000000
  lr_schedule: linear_decay
evaluation:
  checkpoint_interval_steps: 5000000
  episodes: 100
  max_env_steps: 3600
  suites: []
logging:
  wandb_project: flappy-teachers
  wandb_entity: null  # Supplied by the launcher's WANDB_ENTITY.
  wandb_job_type: flappy_temporal_alternatives
  wandb_tags: [decision_v1, temporal_alternatives]
  video:
    enabled: false

# Fit these bundles from the SAME selected raw sessions. Candidate HMM/block
# settings must be selected on fitting/validation data before the final fit.
latency_settings:
  temporal:
    kind: temporal
    profile_path: outputs/temporal_profiles/policy_comparison/profiles/temporal/profile.json
    profile_worker_slot: 0
  hmm:
    kind: hmm
    profile_path: outputs/temporal_profiles/policy_comparison/profiles/hmm/profile.json
    profile_worker_slot: 0
  block:
    kind: block
    profile_path: outputs/temporal_profiles/policy_comparison/profiles/block/profile.json
    profile_worker_slot: 0
sweeps:
  profile:
    frame_stack: [4]
    obs_fps: [10]
