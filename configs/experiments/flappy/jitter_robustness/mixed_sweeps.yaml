__base__: ../../../base/flappy.yaml
experiment_family: jitter_robustness
generated_root: configs/train/jitter_robustness/flappy/mixed
train_dir: results/checkpoints_jitter_robustness/flappy/mixed
output_root: outputs/jitter_robustness/flappy/mixed
device: cuda
restart_behavior: resume
seeds:
  - 911
  - 922
  - 933

evaluation:
  eval_episodes: 50

latency_settings:
  mixed_normal_n2_s1:
    kind: mixed_normal
    mean: 2.0
    std: 1.0
    min: 0
    max: 4
    eval_suites:
      fixed:
        - [1, 2, 3]
      normal:
        - [2.0, 1.0, 0, 4]
      uniform:
        - [1, 3]
  mixed_uniform_u1_3:
    kind: mixed_uniform
    min: 1
    max: 3
    eval_suites:
      fixed:
        - [1, 2, 3]
      normal:
        - [2.0, 1.0, 0, 4]
      uniform:
        - [1, 3]

sweeps:
  jitter_robustness:
    frame_stack:
      - 4
    obs_fps:
      - 15
