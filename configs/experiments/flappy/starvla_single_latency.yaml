__base__:
  - ../../base/flappy.yaml

experiment:
  name: starvla_openvla_flappy_single_raw2
  seed: 42

executor:
  mode: simulated

  inference_devices:
  - cuda
  parallel_envs: 1
env:
  env_fps: 30
  obs_fps: 30
  frame_stack: 4
  obs_resize: [84, 84]

policy:
  type: starvla
  unnorm_key: new_embodiment
  latency_prompt_map_path: /mnt/data/latency_data/playground/Datasets/rl_games/flappy_train/latency_prompt_map.json
  actions:
    - noop
    - flap

  source: local
  root: results/Checkpoints/openvla_flappy_single
  checkpoint: final_model
latency:
  method: fixed
  fixed_latency_ms: 66.66666666666667

evaluation:
  episodes: 5
  max_env_steps: 2000
  suites:
  - name: fixed_2
    latency:
      method: fixed
      fixed_latency_ms: 66.66666666666667

logging:
  output_dir: outputs/starvla_openvla_flappy_single_raw2
  save_step_records: false
  save_action_records: false
  save_latency_records: false
