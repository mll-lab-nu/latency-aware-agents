__base__:
  - ../../base/flappy.yaml

experiment:
  name: starvla_openvla_flappy_single_raw2
  seed: 42

executor:
  mode: simulated

env:
  env_fps: 30
  obs_fps: 30
  frame_stack: 4
  obs_resize: [84, 84]

policy:
  type: starvla
  checkpoint_path: results/Checkpoints/openvla_flappy_single/final_model
  device: cuda
  unnorm_key: new_embodiment
  latency_prompt_map_path: /path/to/mount/latency_data/playground/Datasets/rl_games/flappy_train/latency_prompt_map.json
  actions:
    - noop
    - flap

latency:
  method: fixed
  fixed_latency_ms: 66.66666666666667

evaluation:
  eval_episodes: 5
  eval_parallel_envs: 1
  eval_max_steps: 2000
  eval_suites:
    fixed:
      - [2]
    normal: []
    uniform: []

logging:
  output_dir: outputs/starvla_openvla_flappy_single_raw2
  save_step_records: false
  save_action_records: false
  save_latency_records: false
