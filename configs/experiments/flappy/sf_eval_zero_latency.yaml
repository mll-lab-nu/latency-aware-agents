__base__: ../../base/flappy.yaml

experiment:
  name: flappy_sf_zero_latency
  seed: 42

backend:
  run_mode: eval

latency:
  method: zero
  add_latency_info: false

policy:
  type: sample_factory
  checkpoint_kind: best
  deterministic: true

  source: local
  root: .
evaluation:
  eval_raw_reward: false
  episodes: 100
  max_env_steps: 3600
  suites: []

logging:
  output_dir: outputs/flappy_sf_eval_zero_latency
  video:
    enabled: false
    num_bins: 1
  save_step_records: false
  save_action_records: false
  save_latency_records: false
executor:
  inference_devices:
  - auto
  parallel_envs: 100
