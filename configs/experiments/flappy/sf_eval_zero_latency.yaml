__base__: ../../base/flappy.yaml

experiment:
  name: flappy_sf_zero_latency
  seed: 42

backend:
  run_mode: eval

latency:
  method: zero
  add_latency_info: false

policy:
  type: flappy_sf
  checkpoint_path: ""
  checkpoint_kind: best
  device: auto
  deterministic: true

evaluation:
  eval_episodes: 100
  eval_parallel_envs: 100
  eval_max_steps: 3600
  eval_deterministic: true
  eval_raw_reward: false
  eval_suites:
    fixed: []
    normal: []
    uniform: []

logging:
  output_dir: outputs/flappy_sf_eval_zero_latency
  video:
    enabled: false
    num_bins: 1
  save_step_records: false
  save_action_records: false
  save_latency_records: false
