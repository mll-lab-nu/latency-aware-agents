__base__: ../../base/flappy.yaml

experiment:
  name: flappy_sf_zero_latency
  num_episodes: 10
  max_env_steps: 10000

latency:
  type: zero

policy:
  type: flappy_sf
  checkpoint_path: ""
  device: auto
  deterministic: true
  actions:
    - noop
    - flap

logging:
  output_dir: outputs/flappy_sf_eval_zero_latency
