__base__:
  - ../../../base/flappy.yaml

executor:
  mode: realtime
  inference_devices:
    - cuda:0

experiment:
  name: flappy_openvla_sft_eval
  seed: 0
  num_episodes: 100

env:
  name: flappy
  gym_id: FlappyBird-v0
  env_fps: 30
  obs_fps: 30
  render_mode: rgb_array
  observation_mode: image
  use_lidar: false
  normalize_obs: true
  audio_on: false
  frame_stack: 4
  obs_resize: [84, 84]
  use_gpu_render: false
  gpu_render_device: auto
  gpu_render_profile: false
  gpu_render_profile_interval: 200
  noop_action: noop
  action_map:
    noop: 0
    flap: 1
  oneshot_actions:
  - flap

policy:
  type: flappy_openvla
  base_model_path: /workspace/openvla-7b-rlvla-warmup
  checkpoint_path: /workspace/flappy_openvla_sft_checkpoints/global_step_1500
  prompt: "You are playing Flappy Bird from a single image. Choose exactly one action from: NOOP, FLAP. Navigate through pipes without crashing to maximize score."
  image_size: 224
  action_dim: 2
  num_action_chunks: 1
  add_value_head: false
  max_prompt_length: 50
  num_images_in_input: 1
  center_crop: true
  trust_remote_code: true
  unnorm_key: flappy_bird
  device: cuda
  actions:
    - noop
    - flap


latency:
  type: measured
  device: cuda:0
  sync_cuda: true

evaluation:
  eval_parallel_envs: 1
  eval_latency_values: null
  eval_max_steps: 3600

scheduler:
  ordering_policy: latest_ready


logging:
  output_dir: outputs/flappy_openvla_realtime_measured_30fps
  save_step_records: true
  save_action_records: true
  save_latency_records: true
