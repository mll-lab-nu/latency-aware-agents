experiment:
  name: starvla_flappy_realtime_30fps_zero_ckpt_measured_warmup200_3ep
  seed: 42

executor:
  mode: realtime

  inference_devices:
  - cuda:0
  sync_cuda: true
  parallel_envs: 1
env:
  name: flappy
  gym_id: FlappyBird-v0
  env_fps: 30
  obs_fps: 30
  render_mode: rgb_array
  observation_mode: image
  use_lidar: false
  normalize_obs: true
  audio_on: false
  frame_stack: 1
  obs_resize: [224, 224]
  use_gpu_render: false
  gpu_render_device: auto
  gpu_render_profile: false
  gpu_render_profile_interval: 200
  noop_action: noop
  action_map:
    noop: 0
    flap: 1
  oneshot_actions:
    - flap

scheduler:
  hold_policy: one_frame_then_noop
  ordering_policy: latest_ready

policy:
  type: starvla
  unnorm_key: new_embodiment
  prompt_mode: latency_neutral
  actions:
    - noop
    - flap

  source: local
  root: .
evaluation:
  episodes: 3
  max_env_steps: 3600
logging:
  output_dir: outputs/starvla_realtime_equivalence_warmup2gpu_3ep/realtime_30fps_zero_ckpt_measured_warmup200_3ep
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  video:
    enabled: false
