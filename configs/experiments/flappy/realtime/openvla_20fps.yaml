__base__:
  - ../../../base/flappy.yaml

executor:
  mode: realtime
  inference_devices:
    - cuda:0

experiment:
  name: flappy_openvla_sft_eval
  seed: 0
  num_episodes: 10

env:
  obs_resize: [84, 84]
  env_fps: 20

  obs_fps: 20
policy:
  type: flappy_openvla
  base_model_path: /root/openvla-7b
  checkpoint_path: /root/flappy_openvla_sft_checkpoints/global_step_1500
  prompt: "You are playing Flappy Bird from a single image. Choose exactly one action from: NOOP, FLAP. Navigate through pipes without crashing to maximize score."
  image_size: 224
  action_dim: 2
  num_action_chunks: 1
  add_value_head: false
  max_prompt_length: 50
  num_images_in_input: 1
  center_crop: true
  trust_remote_code: true
  unnorm_key: flappy_bird
  device: cuda
  actions:
    - noop
    - flap

latency:
  type: measured
  device: cuda:0
  sync_cuda: true

evaluation:
  eval_parallel_envs: 1
  eval_latency_values: null
  eval_max_steps: 3600

scheduler:
  ordering_policy: latest_ready


logging:
  output_dir: outputs/flappy_openvla_realtime_measured_20fps
  save_step_records: true
  save_action_records: true
  save_latency_records: true
