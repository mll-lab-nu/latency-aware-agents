experiment:
  name: starvla_flappy_realtime_8fps_l1_2gpu_warmup200_3ep
  seed: 42

executor:
  mode: realtime

env:
  name: flappy
  gym_id: FlappyBird-v0
  env_fps: 8
  obs_fps: 8
  render_mode: rgb_array
  observation_mode: image
  use_lidar: false
  normalize_obs: true
  audio_on: false
  frame_stack: 1
  obs_resize: [224, 224]
  use_gpu_render: false
  gpu_render_device: auto
  gpu_render_profile: false
  gpu_render_profile_interval: 200
  noop_action: noop
  action_map:
    noop: 0
    flap: 1
  oneshot_actions:
    - flap

latency:
  type: measured
  device: cuda:0
  sync_cuda: true

scheduler:
  hold_policy: one_frame_then_noop
  ordering_policy: latest_ready

policy:
  type: starvla
  checkpoint_path: /mnt/data/latency_data/openvla_flappy_fix_latency_2/checkpoints/steps_5000_pytorch_model.pt
  device: cuda
  unnorm_key: new_embodiment
  actions:
    - noop
    - flap

evaluation:
  eval_episodes: 3
  eval_parallel_envs: 1
  eval_latency_values: null
  eval_max_steps: 3600

logging:
  output_dir: outputs/starvla_realtime_equivalence_warmup2gpu_3ep/realtime_8fps_l1_2gpu_warmup200_3ep
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  video:
    enabled: false
