__base__:
  - ../../base/flappy.yaml

# Eval for a QwenOFT checkpoint trained with the fixed-size streaming KV memory
# (framework.kv_memory.enabled=true). The memory is read from the checkpoint config,
# so only the newest frame is encoded each step and the per-slot cache supplies the
# history; frame_stack can stay 1. The per-slot memory is reset at episode boundaries
# automatically (executor -> policy.reset_state(slot_id) -> framework.reset_memory).

experiment:
  name: starvla_qwenoft_flappy_kv_memory
  seed: 42

executor:
  mode: simulated

  inference_devices:
  - cuda
  parallel_envs: 4
env:
  env_fps: 30
  obs_fps: 30
  frame_stack: 1          # KV memory holds history; only the newest frame is fed
  obs_resize: [224, 224]

policy:
  type: starvla
  unnorm_key: new_embodiment
  latency_prompt_map_path: /workspace/latency-sensitive-bench/prompt_map/flappy_fix_latency_prompt_map.json
  actions:
    - noop
    - flap

  source: local
  root: /workspace/starVLA/results/Checkpoints/flappy_qwenoft_kv_memory_w4_r8/checkpoints/steps_5000_state
  checkpoint: model.safetensors
latency:
  method: zero

evaluation:
  episodes: 20
  max_env_steps: 3600
  suites:
  - name: fixed_0
    latency:
      method: zero
  - name: fixed_1
    latency:
      method: fixed
      fixed_latency_ms: 33.333333333333336
  - name: fixed_2
    latency:
      method: fixed
      fixed_latency_ms: 66.66666666666667
  - name: fixed_3
    latency:
      method: fixed
      fixed_latency_ms: 100.0
  - name: fixed_4
    latency:
      method: fixed
      fixed_latency_ms: 133.33333333333334

logging:
  output_dir: outputs/starvla_qwenoft_flappy_kv_memory
  save_step_records: false
  save_action_records: false
  save_latency_records: false
  video:
    enabled: false
