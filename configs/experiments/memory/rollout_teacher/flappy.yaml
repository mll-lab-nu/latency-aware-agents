__base__: ../../../base/flappy.yaml
experiment_family: memory_rollout_teacher
generated_root: configs/train/memory/rollout_teacher/flappy
train_dir: results/checkpoints/memory/rollout_teacher
output_root: outputs/memory/rollout_teacher/flappy
device: cuda
restart_behavior: resume
train_upload_repo_id: latency-sensitive-bench/paper-experiment-models
train_upload_repo_type: model
train_upload_path_prefix: memory/rollout_teachers/flappy

seeds:
  - 0

evaluation:
  eval_episodes: 100
  eval_parallel_envs: 50
  eval_max_steps: 7200

latency_settings:
  fixed_l3:
    kind: fixed
    frames: 3
    eval_suites:
      fixed: [[3]]
      normal: []
      uniform: []

sweeps:
  teacher:
    frame_stack:
      - 4
    obs_fps:
      - 30
