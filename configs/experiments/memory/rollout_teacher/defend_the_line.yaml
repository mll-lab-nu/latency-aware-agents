__base__: ../../../base/defend_the_line.yaml
experiment_family: memory_rollout_teacher
generated_root: configs/train/memory/rollout_teacher/defend_the_line
train_dir: results/checkpoints/memory/rollout_teacher
output_root: outputs/memory/rollout_teacher/defend_the_line
device: cuda
restart_behavior: resume
train_upload_repo_id: latency-sensitive-bench/paper-experiment-models
train_upload_repo_type: model
train_upload_path_prefix: memory/rollout_teachers/defend_the_line

seeds:
  - 0

evaluation:
  eval_episodes: 100
  eval_parallel_envs: 1
  eval_max_steps: 7200

latency_settings:
  fixed_l0:
    kind: fixed
    frames: 0
    eval_suites:
      fixed: [[0, 2, 4, 6]]
      normal: []
      uniform: []
  fixed_l2:
    kind: fixed
    frames: 2
    eval_suites:
      fixed: [[2]]
      normal: []
      uniform: []
  fixed_l4:
    kind: fixed
    frames: 4
    eval_suites:
      fixed: [[4]]
      normal: []
      uniform: []
  fixed_l6:
    kind: fixed
    frames: 6
    eval_suites:
      fixed: [[6]]
      normal: []
      uniform: []

sweeps:
  teacher:
    frame_stack:
      - 4
    obs_fps:
      - 8.75
