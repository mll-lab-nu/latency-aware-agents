__base__: ../../../base/asterix.yaml
experiment_family: memory_small_model
generated_root: configs/train/memory/small_model/asterix/latency_8_16
train_dir: results/checkpoints/memory/small_model/asterix
output_root: outputs/memory/small_model/asterix/latency_8_16
device: cuda
restart_behavior: resume
train_upload_repo_id: placeholder/paper-experiment-models
train_upload_repo_type: model
train_upload_path_prefix: memory/small_model/asterix/latency_8_16_10m_fs4_1min_eval
eval_upload_repo_id: placeholder/paper-experiment-evals
eval_upload_repo_type: dataset
eval_upload_path_prefix: memory/small_model/asterix/latency_8_16_10m_fs4_1min_eval
seeds:
  - 10
  - 11
  - 12
  - 13
  - 14

evaluation:
  eval_episodes: 100
  eval_parallel_envs: 1
  eval_max_steps: 3600

training:
  train_for_env_steps: 10000000

latency_settings:
  fixed_l8:
    kind: fixed
    frames: 8
    eval_suites:
      fixed:
        - [8]
      normal: []
      uniform: []
  fixed_l16:
    kind: fixed
    frames: 16
    eval_suites:
      fixed:
        - [16]
      normal: []
      uniform: []

sweeps:
  frame_stack:
    frame_stack:
      - 4
    obs_fps:
      - 15
