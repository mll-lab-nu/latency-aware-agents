__base__: ../../../base/asterix.yaml
experiment_family: memory_small_model
generated_root: configs/train/memory/small_model/asterix/zero_latency
train_dir: results/checkpoints/memory/small_model/asterix
output_root: outputs/memory/small_model/asterix/zero_latency
device: cuda
restart_behavior: resume
train_upload_repo_id: MLL-Lab/LAGEN-models
train_upload_repo_type: model
train_upload_path_prefix: archive/experiment-runs/memory/small_model/asterix/zero_latency_10m_fs4_1min_eval
eval_upload_repo_id: MLL-Lab/LAGEN-datasets
eval_upload_repo_type: dataset
eval_upload_path_prefix: evaluations/archive/paper-experiment-evals/memory/small_model/asterix/zero_latency_10m_fs4_1min_eval
seeds:
- 10
- 11
- 12
- 13
- 14

evaluation:
  episodes: 100
  max_env_steps: 3600
training:
  train_for_env_steps: 10000000

latency_settings:
  fixed_l0:
    kind: fixed
    frames: 0
    suites:
    - name: fixed_0
      latency:
        method: zero

sweeps:
  frame_stack:
    frame_stack:
    - 4
    obs_fps:
    - 15
executor:
  parallel_envs: 1
