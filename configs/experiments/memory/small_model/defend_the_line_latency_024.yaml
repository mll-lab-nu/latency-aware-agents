__base__: ../../../base/defend_the_line.yaml
experiment_family: memory_small_model
generated_root: configs/train/memory/small_model/defend_the_line/latency_024
train_dir: results/checkpoints/memory/small_model/defend_the_line
output_root: outputs/memory/small_model/defend_the_line/latency_024
device: cuda
restart_behavior: resume
train_upload_repo_id: placeholder/paper-experiment-models
train_upload_repo_type: model
train_upload_path_prefix: memory/small_model/defend_the_line/latency_024_25m_fs4_1min_eval
eval_upload_repo_id: placeholder/paper-experiment-evals
eval_upload_repo_type: dataset
eval_upload_path_prefix: memory/small_model/defend_the_line/latency_024_25m_fs4_1min_eval
seeds:
  - 0

evaluation:
  eval_episodes: 100
  eval_parallel_envs: 1
  eval_max_steps: 3600

training:
  train_for_env_steps: 25000000

latency_settings:
  fixed_l0:
    kind: fixed
    frames: 0
    eval_suites:
      fixed:
        - [0, 2, 4]
      normal: []
      uniform: []
  fixed_l2:
    kind: fixed
    frames: 2
    eval_suites:
      fixed:
        - [2]
      normal: []
      uniform: []
  fixed_l4:
    kind: fixed
    frames: 4
    eval_suites:
      fixed:
        - [4]
      normal: []
      uniform: []

sweeps:
  frame_stack:
    frame_stack:
      - 4
    obs_fps:
      - 8.75
