__base__: ../../flappy/frame_stack/base.yaml
experiment_family: memory_small_model
generated_root: configs/train/memory/small_model/flappy/extended
train_dir: results/checkpoints/memory/small_model/flappy
output_root: outputs/memory/small_model/flappy/extended
device: cuda
restart_behavior: resume
train_upload_repo_id: placeholder/paper-experiment-models
train_upload_repo_type: model
train_upload_path_prefix: memory/small_model/flappy
eval_upload_repo_id: placeholder/paper-experiment-evals
eval_upload_repo_type: dataset
eval_upload_path_prefix: memory/small_model/flappy/extended
seeds:
  - 10
  - 11
  - 12
  - 13
  - 14

evaluation:
  eval_episodes: 100
  eval_max_steps: 36000

latency_settings:
  fixed_l2:
    kind: fixed
    frames: 2
  uniform_u1_3:
    kind: uniform
    min: 1
    max: 3

sweeps:
  frame_stack:
    frame_stack:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    obs_fps:
      - 30
