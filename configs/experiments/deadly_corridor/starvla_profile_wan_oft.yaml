__base__:
  - ../../base/deadly_corridor.yaml

experiment:
  name: starvla_wan_oft_deadly_corridor_profile
  seed: 42

backend:
  run_mode: eval

executor:
  mode: simulated

  inference_devices:
  - cuda
  parallel_envs: 1
env:
  env_fps: 35
  obs_fps: 8.75
  frame_stack: 4
  obs_resize: [224, 224]

policy:
  type: starvla
  unnorm_key: new_embodiment
  prompt_mode: latency_neutral
  action_layout: multibinary_7
  multibinary_threshold: 0.0
  latency_prompt_map_path:
    /home/lixinyuan/latency-sensitive-bench/third_party/starVLA/data/deadly_corridor_fix_latency_6_1000ep_context5/deadly_corridor_train__bridge/latency_prompt_map.json
  latency_prompt_key: 6

  source: local
  root: .
latency:
  method: fixed
  fixed_latency_ms: 171.42857142857142

evaluation:
  eval_raw_reward: true
  episodes: 10
  max_env_steps: 3600
  suites: []

logging:
  output_dir: outputs/starvla_wan_oft_deadly_corridor_profile
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  video:
    enabled: false
