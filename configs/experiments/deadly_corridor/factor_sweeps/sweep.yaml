base_config: configs/base/deadly_corridor.yaml
generated_root: configs/train/deadly_corridor_factor_sweeps
train_dir: results/checkpoints_deadly_corridor_factor_sweeps
output_root: outputs/deadly_corridor_factor_sweeps
device: cuda
restart_behavior: resume
seeds:
  - 0

latency_settings:
  fixed_l2:
    kind: fixed
    frames: 2
  fixed_l4:
    kind: fixed
    frames: 4
  fixed_l6:
    kind: fixed
    frames: 6
  normal_n2_s1:
    kind: normal
    mean: 4.0
    std: 1.0
    min: 0
    max: 15
  uniform_u2_6:
    kind: uniform
    min: 2
    max: 6

sweeps:
  frame_stack:
    wandb_group: deadly-corridor-frame_stack
    frame_stack:
      - 4
      - 6
      - 8
    obs_fps:
      - 15
  obs_fps:
    wandb_group: deadly-corridor-obs_fps
    frame_stack:
      - 4
    obs_fps:
      - 30
      - 15
      - 10