__base__:
  - ../../base/deadly_corridor.yaml

experiment:
  name: starvla_openvla_deadly_corridor_single_factorized11
  seed: 42

executor:
  mode: simulated

env:
  env_fps: 35
  obs_fps: 8.75
  frame_stack: 4
  noop_action: [0, 0, 0, 0]
  action_map:
    noop: [0, 0, 0, 0]
    move_forward: [0, 1, 0, 0]
    move_backward: [0, 2, 0, 0]
    move_left: [0, 0, 1, 0]
    move_right: [0, 0, 2, 0]
    turn_left: [1, 0, 0, 0]
    turn_right: [2, 0, 0, 0]
    attack: [0, 0, 0, 1]

policy:
  type: starvla
  checkpoint_path: results/Checkpoints/openvla_deadly_corridor_single_factorized11/final_model
  device: cuda
  unnorm_key: new_embodiment
  latency_prompt_map_path: /mnt/data/latency_data/playground/Datasets/rl_games/deadly_corridor_train_factorized11/latency_prompt_map.json
  actions:
    - MOVE_FORWARD
    - MOVE_BACKWARD
    - MOVE_LEFT
    - MOVE_RIGHT
    - TURN_LEFT
    - TURN_RIGHT
    - ATTACK

latency:
  method: fixed
  fixed_latency_ms: 57.1428571    # 2 frames latency for env_fps=35

evaluation:
  eval_parallel_envs: 4
  eval_max_steps: 2000
  eval_suites:
    fixed:
      - [2]
    normal: []
    uniform: []

logging:
  output_dir: outputs/starvla_openvla_deadly_corridor_single_factorized11
