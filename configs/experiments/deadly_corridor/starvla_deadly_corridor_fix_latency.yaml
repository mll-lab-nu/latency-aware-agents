__base__:
  - ../../base/deadly_corridor.yaml

experiment:
  name: starvla_openvla_deadly_corridor_fix_latency_0_1000ep
  seed: 42

executor:
  mode: simulated

env:
  env_fps: 35
  obs_fps: 8.75
  frame_stack: 4
  obs_resize: [224, 224]
  noop_action: [0, 0, 0, 0]
  action_map:
    noop: [0, 0, 0, 0]
    move_forward: [0, 1, 0, 0]
    move_backward: [0, 2, 0, 0]
    move_left: [0, 0, 1, 0]
    move_right: [0, 0, 2, 0]
    turn_left: [1, 0, 0, 0]
    turn_right: [2, 0, 0, 0]
    attack: [0, 0, 0, 1]

policy:
  type: starvla
  checkpoint_path: /workspace/starVLA/results/Checkpoints/openvla_bridge_deadly_corridor_single_latency_clean_data_fl1_exp1/checkpoints/steps_500_state/model.safetensors
  device: cuda
  unnorm_key: new_embodiment
  latency_prompt_map_path: /workspace/latency-sensitive-bench/prompt_map/deadly_corridor_fix_latency_prompt_map.json
  actions:
    - MOVE_FORWARD
    - MOVE_BACKWARD
    - MOVE_LEFT
    - MOVE_RIGHT
    - TURN_LEFT
    - TURN_RIGHT
    - ATTACK

latency:
  method: zero

evaluation:
  eval_episodes: 20
  eval_parallel_envs: 4
  eval_max_steps: 3600
  eval_suites:
    fixed:
      - [0, 4, 8, 12, 16, 20, 24, 28, 32]
    normal: []
    uniform: []

logging:
  output_dir: outputs/starvla_openvla_deadly_corridor_fix_latency_0_1000ep
  video:
    enabled: false
