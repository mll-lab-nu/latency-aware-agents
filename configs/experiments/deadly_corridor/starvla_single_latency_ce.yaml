__base__:
  - ../../base/deadly_corridor.yaml

experiment:
  name: starvla_openvla_deadly_corridor_single_factorized11_ce
  seed: 42

executor:
  mode: simulated

  inference_devices:
  - cuda
  parallel_envs: 4
env:
  env_fps: 35
  obs_fps: 8.75
  frame_stack: 4
  noop_action: [0, 0, 0, 0]
  action_map:
    noop: [0, 0, 0, 0]
    move_forward: [0, 1, 0, 0]
    move_backward: [0, 2, 0, 0]
    move_left: [0, 0, 1, 0]
    move_right: [0, 0, 2, 0]
    turn_left: [1, 0, 0, 0]
    turn_right: [2, 0, 0, 0]
    attack: [0, 0, 0, 1]

policy:
  type: starvla
  unnorm_key: new_embodiment
  latency_prompt_map_path: /mnt/data/latency_data/playground/Datasets/rl_games/deadly_corridor_train_factorized11/latency_prompt_map.json
  actions:
    - TURN_NOOP
    - TURN_LEFT
    - TURN_RIGHT
    - MOVE_NOOP
    - MOVE_FORWARD
    - MOVE_BACKWARD
    - STRAFE_NOOP
    - MOVE_LEFT
    - MOVE_RIGHT
    - ATTACK_NOOP
    - ATTACK

  source: local
  root: results/Checkpoints/openvla_deadly_corridor_single_factorized11_ce
  checkpoint: final_model
latency:
  method: fixed
  fixed_latency_ms: 57.1428571

evaluation:
  max_env_steps: 2000
  suites:
  - name: fixed_2
    latency:
      method: fixed
      fixed_latency_ms: 57.142857142857146

logging:
  output_dir: outputs/starvla_openvla_deadly_corridor_single_factorized11_ce
