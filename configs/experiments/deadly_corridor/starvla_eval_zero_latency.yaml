__base__:
  - ../../base/deadly_corridor.yaml

experiment:
  name: starvla_deadly_corridor_zero_latency_eval
  seed: 42

backend:
  run_mode: eval

executor:
  mode: simulated

  inference_devices:
  - cuda
  parallel_envs: 4
env:
  frame_stack: 4
  obs_resize: [224, 224]
  noop_action: [0, 0, 0, 0]
  action_map:
    noop: [0, 0, 0, 0]
    move_forward: [0, 1, 0, 0]
    move_backward: [0, 2, 0, 0]
    move_left: [0, 0, 1, 0]
    move_right: [0, 0, 2, 0]
    turn_left: [1, 0, 0, 0]
    turn_right: [2, 0, 0, 0]
    attack: [0, 0, 0, 1]

policy:
  type: starvla
  unnorm_key: new_embodiment
  prompt_mode: raw
  action_layout: multibinary_7
  multibinary_threshold: 0.0
  actions:
    - MOVE_FORWARD
    - MOVE_BACKWARD
    - MOVE_LEFT
    - MOVE_RIGHT
    - TURN_LEFT
    - TURN_RIGHT
    - ATTACK

  source: local
  root: .
latency:
  method: zero

evaluation:
  eval_raw_reward: true
  episodes: 100
  max_env_steps: 30000
  suites: []

logging:
  output_dir: outputs/starvla_deadly_corridor_zero_latency_eval
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  video:
    enabled: false
  wandb_project: null
  wandb_group: null
  wandb_job_type: null
