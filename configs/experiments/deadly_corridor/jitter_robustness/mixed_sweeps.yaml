__base__: ../../../base/deadly_corridor.yaml
experiment_family: jitter_robustness
generated_root: configs/train/jitter_robustness/deadly_corridor/mixed
train_dir: results/checkpoints_jitter_robustness/deadly_corridor/mixed
output_root: outputs/jitter_robustness/deadly_corridor/mixed
device: cuda
restart_behavior: resume

# Base deadly_corridor.yaml uses env_fps=35/obs_fps=8.75 (native Doom rate).
# The jitter_robustness sweep overrides obs_fps=15, which requires env_fps to be an
# integer multiple of 15. Override env_fps=60 here (60/15=4) to match the existing
# deadly-corridor-obs15 runs; otherwise base env_fps=35 with obs_fps=15 fails
# validate_clock_rates (35/15 is non-integer).
env:
  env_fps: 35
  obs_fps: 8.75

seeds:
  - 0
  - 42
  - 114514

evaluation:
  eval_episodes: 20
  eval_parallel_envs: 32

latency_settings:
  mixed_normal_n2_s1:
    kind: mixed_normal
    mean: 4.0
    std: 1.0
    min: 0
    max: 15
    eval_suites:
      fixed:
        - [2, 4, 6]
      normal:
        - [4.0, 1.0, 0, 15]
      uniform:
        - [2, 6]
  mixed_uniform_u2_6:
    kind: mixed_uniform
    min: 2
    max: 6
    eval_suites:
      fixed:
        - [2, 4, 6]
      normal:
        - [4.0, 1.0, 0, 15]
      uniform:
        - [2, 6]

sweeps:
  jitter_robustness:
    frame_stack:
      - 4
    obs_fps:
      - 8.75
