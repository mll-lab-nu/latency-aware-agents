__base__: ../../base/demon_attack.yaml
experiment_family: jitter_destructiveness
generated_root: configs/train/jitter_destructiveness/demon_attack
train_dir: results/checkpoints/jitter_destructiveness/trained/small
output_root: outputs/jitter_destructiveness/trained/small/demon_attack
device: cuda
restart_behavior: resume

seeds:
  - 10
  - 11
  - 12

evaluation:
  eval_episodes: 100
  eval_max_steps: 3600
  eval_suites:
    fixed:
      - [4]
    normal:
      - [4.0, 1.0, 0, 15]
    uniform:
      - [2, 6]

latency_settings:
  fixed_l4:
    kind: fixed
    frames: 4
    eval_suites:
      fixed: [[4]]
      normal: [[4.0, 1.0, 0, 15]]
      uniform: [[2, 6]]

sweeps:
  baseline:
    frame_stack:
      - 4
    obs_fps:
      - 15
