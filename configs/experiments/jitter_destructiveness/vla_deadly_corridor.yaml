__base__: ../../base/deadly_corridor.yaml

experiment:
  name: jitter_destructiveness_vla_deadly_corridor
  seed: 42

executor:
  mode: simulated

env:
  env_fps: 35
  obs_fps: 8.75
  frame_stack: 4
  obs_resize: [224, 224]
  noop_action: [0, 0, 0, 0]
  action_map:
    noop: [0, 0, 0, 0]
    move_forward: [0, 1, 0, 0]
    move_backward: [0, 2, 0, 0]
    move_left: [0, 0, 1, 0]
    move_right: [0, 0, 2, 0]
    turn_left: [1, 0, 0, 0]
    turn_right: [2, 0, 0, 0]
    attack: [0, 0, 0, 1]

policy:
  type: starvla
  checkpoint_path: results/checkpoints/jitter_destructiveness/released/vla/deadly_corridor_fix_latency_2/checkpoints/best_state/model.safetensors
  device: cuda
  unnorm_key: new_embodiment
  action_layout: multibinary_7
  actions:
    - MOVE_FORWARD
    - MOVE_BACKWARD
    - MOVE_LEFT
    - MOVE_RIGHT
    - TURN_LEFT
    - TURN_RIGHT
    - ATTACK

latency:
  method: fixed
  fixed_latency_ms: 57.142857142857146

evaluation:
  eval_episodes: 100
  eval_parallel_envs: 1
  eval_max_steps: 3600
  eval_suites:
    fixed:
      - [2]
    normal:
      - [2.0, 1.0, 0, 4]
    uniform:
      - [1, 3]
      - [0, 4]

logging:
  output_dir: outputs/jitter_destructiveness/released/vla/deadly_corridor
  video:
    enabled: false
  save_step_records: false
  save_action_records: false
  save_latency_records: true
