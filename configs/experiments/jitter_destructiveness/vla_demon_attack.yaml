__base__: ../../base/demon_attack.yaml

experiment:
  name: jitter_destructiveness_vla_demon_attack
  seed: 42

backend:
  run_mode: eval

executor:
  mode: simulated

env:
  env_fps: 60
  obs_fps: 15
  frame_stack: 4
  obs_resize: [224, 224]
  terminal_on_life_loss: true
  clip_reward: false

policy:
  type: starvla
  checkpoint_path: results/checkpoints/jitter_destructiveness/released/vla/demon_attack_fix_latency_2_200ep/checkpoints/steps_7000_state/model.safetensors
  device: cuda
  unnorm_key: new_embodiment
  actions:
    - NOOP
    - FIRE
    - RIGHT
    - LEFT
    - RIGHTFIRE
    - LEFTFIRE

latency:
  method: fixed
  fixed_latency_ms: 33.333333333333336

evaluation:
  eval_episodes: 100
  eval_parallel_envs: 1
  eval_max_steps: 3600
  eval_raw_reward: true
  eval_suites:
    fixed:
      - [2]
    normal:
      - [2.0, 1.0, 0, 4]
    uniform:
      - [1, 3]
      - [0, 4]

logging:
  output_dir: outputs/jitter_destructiveness/released/vla/demon_attack
  video:
    enabled: false
  save_step_records: false
  save_action_records: false
  save_latency_records: false
