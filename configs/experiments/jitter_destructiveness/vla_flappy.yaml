__base__: ../../base/flappy.yaml

experiment:
  name: jitter_destructiveness_vla_flappy
  seed: 42

executor:
  mode: simulated

env:
  env_fps: 30
  obs_fps: 30
  frame_stack: 4
  obs_resize: [224, 224]

policy:
  type: starvla
  checkpoint_path: results/checkpoints/jitter_destructiveness/released/vla/flappy_fix_latency_2_200ep/checkpoints/steps_5000_state/model.safetensors
  device: cuda
  unnorm_key: new_embodiment
  actions:
    - noop
    - flap

latency:
  method: fixed
  fixed_latency_ms: 66.66666666666667

evaluation:
  eval_episodes: 100
  eval_parallel_envs: 1
  eval_max_steps: 3600
  eval_suites:
    fixed:
      - [2]
    normal:
      - [2.0, 1.0, 0, 4]
    uniform:
      - [1, 3]
      - [0, 4]

logging:
  output_dir: outputs/jitter_destructiveness/released/vla/flappy
  video:
    enabled: false
  save_step_records: false
  save_action_records: false
  save_latency_records: false
