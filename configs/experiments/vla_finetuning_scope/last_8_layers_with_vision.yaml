__base__:
  - ../../base/flappy.yaml

experiment:
  name: vla_finetuning_scope_last_8_layers_with_vision
  seed: 42

executor:
  mode: simulated

  inference_devices:
  - cuda
  parallel_envs: 4
env:
  env_fps: 30
  obs_fps: 30
  frame_stack: 1
  obs_resize: [224, 224]

policy:
  type: starvla
  # Historical artifact ID retained for the published checkpoint.
  unnorm_key: new_embodiment
  # Exact fixed-latency-2 prompt used by the published training dataset.
  latency_prompt_map_path: /home/lixinyuan/latency-sensitive-bench/third_party/starVLA/prompt/flappy_latency_prompt_map.json
  latency_prompt_key: 2
  actions:
    - noop
    - flap

  source: local
  root: results/Checkpoints/openvla_flappy_fixed_l2_200ep_last_8_layers_corrected
  checkpoint: final_model
latency:
  method: fixed
  fixed_latency_ms: 66.66666666666667

evaluation:
  episodes: 50
  max_env_steps: 3600
  suites:
  - name: fixed_2
    latency:
      method: fixed
      fixed_latency_ms: 66.66666666666667

logging:
  output_dir: outputs/vla_finetuning_scope/last_8_layers_with_vision
  save_step_records: false
  save_action_records: false
  save_latency_records: false
