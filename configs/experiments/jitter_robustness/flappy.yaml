__base__: ../../base/flappy.yaml
experiment_family: jitter_robustness
generated_root: configs/train/jitter_robustness/flappy
train_dir: results/checkpoints_jitter_robustness/flappy
output_root: outputs/jitter_robustness/flappy
device: cuda
restart_behavior: resume
train_upload_repo_id: latency-sensitive-bench/paper-experiment-models
train_upload_repo_type: model
train_upload_path_prefix: jitter_robustness/flappy
eval_upload_repo_id: latency-sensitive-bench/paper-experiment-evals
eval_upload_repo_type: dataset
eval_upload_path_prefix: jitter_robustness/flappy
seeds:
  - 911
  - 922
  - 933

evaluation:
  eval_episodes: 50
  eval_max_steps: 3600
  eval_suites:
    fixed:
      - [1, 2, 3]
    normal:
      - [2.0, 1.0, 0, 4]
    uniform:
      - [1, 3]

latency_settings:
  fixed_l1:
    kind: fixed
    frames: 1
    eval_suites:
      fixed: [[1, 2, 3]]
      normal: [[2.0, 1.0, 0, 4]]
      uniform: [[1, 3]]
  fixed_l2:
    kind: fixed
    frames: 2
    eval_suites:
      fixed: [[1, 2, 3]]
      normal: [[2.0, 1.0, 0, 4]]
      uniform: [[1, 3]]
  fixed_l3:
    kind: fixed
    frames: 3
    eval_suites:
      fixed: [[1, 2, 3]]
      normal: [[2.0, 1.0, 0, 4]]
      uniform: [[1, 3]]
  normal_n2_s1:
    kind: normal
    mean: 2.0
    std: 1.0
    min: 0
    max: 4
    eval_suites:
      fixed: [[1, 2, 3]]
      normal: [[2.0, 1.0, 0, 4]]
      uniform: [[1, 3]]
  uniform_u1_3:
    kind: uniform
    min: 1
    max: 3
    eval_suites:
      fixed: [[1, 2, 3]]
      normal: [[2.0, 1.0, 0, 4]]
      uniform: [[1, 3]]
  mixed_normal_n2_s1:
    kind: mixed_normal
    mean: 2.0
    std: 1.0
    min: 0
    max: 4
    eval_suites:
      fixed: [[1, 2, 3]]
      normal: [[2.0, 1.0, 0, 4]]
      uniform: [[1, 3]]
  mixed_uniform_u1_3:
    kind: mixed_uniform
    min: 1
    max: 3
    eval_suites:
      fixed: [[1, 2, 3]]
      normal: [[2.0, 1.0, 0, 4]]
      uniform: [[1, 3]]

sweeps:
  jitter_robustness:
    frame_stack:
      - 4
    obs_fps:
      - 15
