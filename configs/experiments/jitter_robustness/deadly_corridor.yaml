__base__: ../../base/deadly_corridor.yaml
experiment_family: jitter_robustness
generated_root: configs/train/jitter_robustness/deadly_corridor
train_dir: results/checkpoints_jitter_robustness/deadly_corridor
output_root: outputs/jitter_robustness/deadly_corridor
device: cuda
restart_behavior: resume
train_upload_repo_id: placeholder/paper-experiment-models
train_upload_repo_type: model
train_upload_path_prefix: jitter_robustness/deadly_corridor
eval_upload_repo_id: placeholder/paper-experiment-evals
eval_upload_repo_type: dataset
eval_upload_path_prefix: jitter_robustness/deadly_corridor

env:
  env_fps: 35
  obs_fps: 8.75

seeds:
  - 0
  - 42
  - 114514

evaluation:
  eval_episodes: 20
  eval_parallel_envs: 32
  eval_max_steps: 30000
  eval_suites:
    fixed:
      - [2, 4, 6]
    normal:
      - [4.0, 1.0, 0, 15]
    uniform:
      - [2, 6]

latency_settings:
  fixed_l2:
    kind: fixed
    frames: 2
    eval_suites: &full_eval_suites
      fixed: [[2, 4, 6]]
      normal: [[4.0, 1.0, 0, 15]]
      uniform: [[2, 6]]
  fixed_l4:
    kind: fixed
    frames: 4
    eval_suites: *full_eval_suites
  fixed_l6:
    kind: fixed
    frames: 6
    eval_suites: *full_eval_suites
  normal_n4_s1:
    kind: normal
    mean: 4.0
    std: 1.0
    min: 0
    max: 15
    eval_suites: *full_eval_suites
  uniform_u2_6:
    kind: uniform
    min: 2
    max: 6
    eval_suites: *full_eval_suites
  mixed_normal_n4_s1:
    kind: mixed_normal
    mean: 4.0
    std: 1.0
    min: 0
    max: 15
    eval_suites: *full_eval_suites
  mixed_uniform_u2_6:
    kind: mixed_uniform
    min: 2
    max: 6
    eval_suites: *full_eval_suites

sweeps:
  jitter_robustness:
    frame_stack:
      - 4
    obs_fps:
      - 8.75
