__base__: ../../base/flappy.yaml
experiment_family: observation_stride
generated_root: configs/train/observation_stride/flappy/extended
train_dir: results/checkpoints/observation_stride/flappy
output_root: outputs/observation_stride/flappy/extended
device: cuda
restart_behavior: resume
seeds:
  - 10
  - 11
  - 12
  - 13
  - 14

evaluation:
  episodes: 100
  max_env_steps: 36000
latency_settings:
  fixed_l2:
    kind: fixed
    frames: 2
  uniform_u1_3:
    kind: uniform
    min: 1
    max: 3

sweeps:
  observation_stride:
    frame_stack:
      - 4
    observation_stride:
      - 1
      - 2
      - 3
      - 4
      - 5
