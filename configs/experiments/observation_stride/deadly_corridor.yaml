__base__: ../../base/deadly_corridor.yaml
experiment_family: observation_stride
generated_root: configs/train/observation_stride/deadly_corridor
train_dir: results/checkpoints/observation_stride/deadly_corridor
output_root: outputs/observation_stride/deadly_corridor
device: cuda
restart_behavior: resume
seeds:
  - 10
  - 11
  - 12
  - 13
  - 14

evaluation:
  episodes: 100
  max_env_steps: 30000
latency_settings:
  fixed_l4:
    kind: fixed
    frames: 4
  uniform_u2_6:
    kind: uniform
    min: 2
    max: 6

sweeps:
  observation_stride:
    frame_stack:
      - 4
    observation_stride:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
executor:
  parallel_envs: 32
