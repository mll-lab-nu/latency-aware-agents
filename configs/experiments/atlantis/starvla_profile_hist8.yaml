__base__: starvla_eval_zero_latency.yaml

env:
  simulator: cpu
  frame_stack: 1
  action_history_decisions: 8

policy:
  task_manifest_path: manifest.json
  state_source: transport
  prompt_mode: latency_neutral

evaluation:
  episodes: 10
  max_env_steps: 7200
executor:
  parallel_envs: 1
  env_backend: serial
  mode: realtime
  inference_devices:
  - cuda
  sync_cuda: true
