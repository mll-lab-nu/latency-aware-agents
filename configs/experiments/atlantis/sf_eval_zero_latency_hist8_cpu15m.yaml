__base__: sf_eval_zero_latency.yaml

experiment:
  name: atlantis_sf_zero_latency_hist8_cpu15m_seed0
  seed: 42

backend:
  train_dir: results/checkpoints/atari_zero_hist8_cpu15m
  extra_args:
    - --encoder_conv_architecture
    - convnet_simple
    - --load_checkpoint_kind
    - best

env:
  frame_stack: 4
  simulator: cpu
  action_history_decisions: 8

policy:
  type: sample_factory
  checkpoint_kind: best
  deterministic: true

  source: local
  root: .
evaluation:
  episodes: 100
  max_env_steps: 14400
logging:
  output_dir: outputs/atari_zero_hist8_cpu15m/atlantis/eval_best_cpu
executor:
  inference_devices:
  - auto
  parallel_envs: 32
