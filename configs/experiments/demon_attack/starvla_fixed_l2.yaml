__base__:
  - ../../base/demon_attack.yaml

experiment:
  name: starvla_openvla_demon_attack_fixed_l2
  seed: 42

executor:
  mode: simulated

env:
  env_fps: 60
  obs_fps: 15
  frame_stack: 4
  clip_reward: false

policy:
  type: starvla
  checkpoint_path: results/Checkpoints/openvla_demon_attack_fixed_l2/final_model
  device: cuda
  unnorm_key: new_embodiment
  latency_prompt_map_path: /mnt/data/latency_data/playground/Datasets/rl_games/demon_attack_train/latency_prompt_map.json
  actions:
    - NOOP
    - FIRE
    - RIGHT
    - LEFT
    - RIGHTFIRE
    - LEFTFIRE

latency:
  type: fixed
  fixed_latency_ms: 33.333333333333336

evaluation:
  eval_parallel_envs: 4
  eval_max_steps: 2000
  eval_suites:
    fixed:
      - [2]
    normal: []
    uniform: []

logging:
  output_dir: outputs/starvla_openvla_demon_attack_fixed_l2
