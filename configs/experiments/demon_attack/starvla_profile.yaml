__base__:
- ../../base/demon_attack.yaml

experiment:
  name: starvla_demon_attack_profile
  seed: 42

backend:
  run_mode: eval

executor:
  mode: realtime

  inference_devices:
  - cuda
  parallel_envs: 1
  sync_cuda: true
env:
  env_fps: 60
  obs_fps: 15
  frame_stack: 4
  obs_resize: [224, 224]
  clip_reward: false

policy:
  type: starvla
  unnorm_key: new_embodiment
  prompt_mode: latency_neutral
  actions:
  - NOOP
  - FIRE
  - RIGHT
  - LEFT
  - RIGHTFIRE
  - LEFTFIRE

  source: local
  root: .
evaluation:
  eval_raw_reward: true
  episodes: 10
  max_env_steps: 14400
  suites: []

logging:
  output_dir: outputs/starvla_demon_attack_profile
  video:
    enabled: false
  save_step_records: true
  save_action_records: true
  save_latency_records: true
