__base__:
  - ../../base/demon_attack.yaml

experiment:
  name: starvla_openvla_demon_attack_fix_latency_0_200ep
  seed: 42

executor:
  mode: simulated

env:
  env_fps: 60
  obs_fps: 15
  frame_stack: 0
  obs_resize: [224, 224]
  terminal_on_life_loss: false
  clip_reward: false
  reset_mode: noop

policy:
  type: starvla
  checkpoint_path: /workspace/starVLA/results/Checkpoints/demon_attack_fix_latency_0_200ep/checkpoints/steps_7000_state/model.safetensors
  device: cuda
  unnorm_key: new_embodiment
  latency_prompt_map_path: /workspace/latency-sensitive-bench/prompt_map/demon_attack_fix_latency_prompt_map.json
  actions:
    - NOOP
    - FIRE
    - RIGHT
    - LEFT
    - RIGHTFIRE
    - LEFTFIRE

latency:
  type: zero

evaluation:
  eval_episodes: 20
  eval_parallel_envs: 4
  latency_bench_env_backend: subproc
  eval_max_steps: 14400
  eval_suites:
    fixed:
      - [20]
    normal: []
    uniform: []

logging:
  output_dir: outputs/starvla_openvla_demon_attack_fix_latency_0_200ep
  simulated_pipeline_profile: true
  save_step_records: false
  save_action_records: false
  save_latency_records: false
  video:
    enabled: false
