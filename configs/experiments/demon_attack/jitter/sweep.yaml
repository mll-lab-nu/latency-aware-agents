base_config: configs/base/demon_attack.yaml
generated_root: configs/train/demon_attack_jitter_sweeps
train_dir: results/checkpoints_demon_attack_jitter_sweeps
output_root: outputs/demon_attack_jitter_sweeps
device: cuda
restart_behavior: resume
seeds:
  - 0

latency_settings:
  fixed_l2:
    kind: fixed
    frames: 2
  normal_n2_s1:
    kind: normal
    mean: 2.0
    std: 1.0
    min: 0
    max: 5
  uniform_u1_3:
    kind: uniform
    min: 1
    max: 3
  uniform_u0_4:
    kind: uniform
    min: 0
    max: 4

sweeps:
  jitter:
    frame_stack:
      - 4
    obs_fps:
      - 15
