__base__: ../../../base/demon_attack.yaml
experiment_family: jitter_robustness
generated_root: configs/train/jitter_robustness/demon_attack/nonmix
train_dir: results/checkpoints_jitter_robustness/demon_attack/nonmix
output_root: outputs/jitter_robustness/demon_attack/nonmix
device: cuda
restart_behavior: resume
seeds:
  - 0
  - 42
  - 114514

evaluation:
  eval_episodes: 100
  eval_suites:
    fixed:
      - [2, 4, 6]
    normal:
      - [4.0, 1.0, 0, 15]
    uniform:
      - [2, 6]

# Each setting carries the FULL eval suite so every trained model is evaluated
# across all eval latencies (the figure needs the complete train x eval matrix).
# Without an explicit per-setting eval_suites, the generator restricts eval to
# the training latency only (diagonal), which is not what we want here.
latency_settings:
  fixed_l2:
    kind: fixed
    frames: 2
    eval_suites:
      fixed:
        - [2, 4, 6]
      normal:
        - [4.0, 1.0, 0, 15]
      uniform:
        - [2, 6]
  fixed_l4:
    kind: fixed
    frames: 4
    eval_suites:
      fixed:
        - [2, 4, 6]
      normal:
        - [4.0, 1.0, 0, 15]
      uniform:
        - [2, 6]
  fixed_l6:
    kind: fixed
    frames: 6
    eval_suites:
      fixed:
        - [2, 4, 6]
      normal:
        - [4.0, 1.0, 0, 15]
      uniform:
        - [2, 6]
  normal_n2_s1:
    kind: normal
    mean: 4.0
    std: 1.0
    min: 0
    max: 15
    eval_suites:
      fixed:
        - [2, 4, 6]
      normal:
        - [4.0, 1.0, 0, 15]
      uniform:
        - [2, 6]
  uniform_u2_6:
    kind: uniform
    min: 2
    max: 6
    eval_suites:
      fixed:
        - [2, 4, 6]
      normal:
        - [4.0, 1.0, 0, 15]
      uniform:
        - [2, 6]

sweeps:
  jitter_robustness:
    frame_stack:
      - 4
    obs_fps:
      - 15
