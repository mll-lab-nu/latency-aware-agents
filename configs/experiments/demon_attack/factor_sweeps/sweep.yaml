base_config: configs/base/demon_attack.yaml
generated_root: configs/train/demon_attack_factor_sweeps
train_dir: results/checkpoints_demon_attack_factor_sweeps
output_root: outputs/demon_attack_factor_sweeps
device: gpu
restart_behavior: resume
seeds:
  - 0

latency_settings:
  fixed_l1:
    kind: fixed
    frames: 1
  fixed_l2:
    kind: fixed
    frames: 2
  fixed_l3:
    kind: fixed
    frames: 3
  normal_n2_s1:
    kind: normal
    mean: 2.0
    std: 1.0
    min: 0
    max: 15
  uniform_u1_3:
    kind: uniform
    min: 1
    max: 3

sweeps:
  frame_stack:
    wandb_group: demon-attack-frame_stack
    frame_stack:
      - 4
      - 6
      - 8
      - 10
    obs_fps:
      - 30
  obs_fps:
    wandb_group: demon-attack-obs_fps
    frame_stack:
      - 4
    obs_fps:
      - 30
      - 15
      - 10
      - 7.5
