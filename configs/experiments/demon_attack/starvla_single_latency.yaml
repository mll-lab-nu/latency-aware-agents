__base__:
  - ../../base/demon_attack.yaml

experiment:
  name: starvla_openvla_demon_attack_single_raw2
  seed: 42

executor:
  mode: simulated

  inference_devices:
  - cuda
  parallel_envs: 4
env:
  env_fps: 60
  obs_fps: 15
  frame_stack: 4
  clip_reward: false

policy:
  type: starvla
  unnorm_key: new_embodiment
  latency_prompt_map_path: /mnt/data/latency_data/playground/Datasets/rl_games/demon_attack_train/latency_prompt_map.json
  actions:
    - NOOP
    - FIRE
    - RIGHT
    - LEFT
    - RIGHTFIRE
    - LEFTFIRE

  source: local
  root: results/Checkpoints/openvla_demon_attack_single
  checkpoint: final_model
latency:
  method: fixed
  fixed_latency_ms: 33.333333333333336

evaluation:
  max_env_steps: 2000
  suites:
  - name: fixed_2
    latency:
      method: fixed
      fixed_latency_ms: 33.333333333333336

logging:
  output_dir: outputs/starvla_openvla_demon_attack_single_raw2
