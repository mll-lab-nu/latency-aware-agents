__base__: ../../base/demon_attack.yaml

experiment:
  name: demon_attack_sf_zero_latency
  seed: 42

env:
  terminal_on_life_loss: true
  clip_reward: false

evaluation:
  episodes: 100
  max_env_steps: 14400
  suites: []

latency:
  method: zero

policy:
  type: sample_factory
  deterministic: true

  source: local
  root: .
logging:
  output_dir: outputs/demon_attack_sf_eval_zero_latency
  video:
    enabled: false
    num_bins: 1
  save_step_records: false
  save_action_records: false
  save_latency_records: false
executor:
  inference_devices:
  - auto
  parallel_envs: 100
  env_backend: demon_attack_gpu_batched
