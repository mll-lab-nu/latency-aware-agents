artifact_root: results/cross_device
checkpoint_kind: best
n_episodes: 100
sim_parallel_envs: 1
evaluation_seed: 0

calibration:
  worker_utilization_cap: 0.8

hf_repo: latency-sensitive-bench/profiles
hf_repo_type: dataset

devices:
  - id: a100
    display_name: A100
    profile_id: L_A100
    aliases:
      - A100
      - NVIDIA A100
      - NVIDIA A100-SXM4-80GB
      - NVIDIA A100-SXM4-40GB
      - NVIDIA A100-PCIE-80GB
      - NVIDIA A100-PCIE-40GB
  - id: l40s
    display_name: L40S
    profile_id: L_L40S
    aliases:
      - L40S
      - NVIDIA L40S
  - id: rtx4090
    display_name: RTX 4090
    profile_id: L_4090
    aliases:
      - RTX 4090
      - NVIDIA GeForce RTX 4090
  - id: rtx5090
    display_name: RTX 5090
    profile_id: L_5090
    aliases:
      - RTX 5090
      - NVIDIA GeForce RTX 5090

workload:
  id: openvla-flappy
  policy_type: starvla
  model_type: openvla
  env_name: flappy
  target_latency_frames: 2
  base_config: configs/experiments/flappy/realtime/starvla_openvla_fix_latency_2_16fps_l2_2gpu_warmup200_3ep.yaml
  sim_env:
    simulator: cpu
    use_gpu_render: false
