artifact_root: results/cross_device
checkpoint_kind: best
n_episodes: 100
sim_parallel_envs: 1
evaluation_seed: 0

measurement:
  episode_lifecycle: consecutive

calibration:
  worker_utilization_cap: 0.8

hf_repo: latency-sensitive-bench/profiles
hf_repo_type: dataset

devices:
  - id: a100-sxm4-80gb
    display_name: A100 SXM4 80GB
    profile_id: L_A100_SXM4_80GB
    aliases:
      - NVIDIA A100-SXM4-80GB
  - id: a100-sxm4-40gb
    display_name: A100 SXM4 40GB
    profile_id: L_A100_SXM4_40GB
    aliases:
      - NVIDIA A100-SXM4-40GB
  - id: a100-pcie-80gb
    display_name: A100 PCIe 80GB
    profile_id: L_A100_PCIE_80GB
    aliases:
      - NVIDIA A100-PCIE-80GB
  - id: a100-pcie-40gb
    display_name: A100 PCIe 40GB
    profile_id: L_A100_PCIE_40GB
    aliases:
      - NVIDIA A100-PCIE-40GB
  - id: l40s
    display_name: L40S
    profile_id: L_L40S
    aliases:
      - L40S
      - NVIDIA L40S
  - id: rtx3090
    display_name: RTX 3090
    profile_id: L_3090
    aliases:
      - RTX 3090
      - NVIDIA GeForce RTX 3090
  - id: rtx4090
    display_name: RTX 4090
    profile_id: L_4090
    aliases:
      - RTX 4090
      - NVIDIA GeForce RTX 4090
  - id: rtx5090
    display_name: RTX 5090
    profile_id: L_5090
    aliases:
      - RTX 5090
      - NVIDIA GeForce RTX 5090
  - id: rtx-pro-6000-blackwell-ws
    display_name: RTX PRO 6000 Blackwell Workstation Edition
    profile_id: L_RTX_PRO_6000_BLACKWELL_WS
    aliases:
      - NVIDIA RTX PRO 6000 Blackwell Workstation Edition
  - id: rtx-pro-6000-blackwell-server
    display_name: RTX PRO 6000 Blackwell Server Edition
    profile_id: L_RTX_PRO_6000_BLACKWELL_SERVER
    aliases:
      - NVIDIA RTX PRO 6000 Blackwell Server Edition
  - id: rtx-pro-6000-blackwell-maxq-ws
    display_name: RTX PRO 6000 Blackwell Max-Q Workstation Edition
    profile_id: L_RTX_PRO_6000_BLACKWELL_MAXQ_WS
    aliases:
      - NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition

workload:
  id: openvla-flappy
  policy_type: starvla
  model_type: openvla
  env_name: flappy
  target_latency_frames: 2
  base_config: configs/experiments/flappy/realtime/starvla_openvla_fix_latency_2_16fps_l2_2gpu_warmup200_3ep.yaml
  sim_env:
    simulator: cpu
    use_gpu_render: false
