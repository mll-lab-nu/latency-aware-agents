__base__:
  - ../../base/defend_the_line.yaml

experiment:
  name: starvla_defend_the_line_profile
  seed: 42

backend:
  run_mode: eval

executor:
  mode: simulated

env:
  env_fps: 35
  obs_fps: 8.75
  frame_stack: 4
  obs_resize: [224, 224]
  noop_action: [0, 0]

policy:
  type: starvla
  checkpoint_path: ""
  model_config_path: ""
  device: cuda
  unnorm_key: new_embodiment
  prompt_mode: latency_neutral
  actions:
    - NOOP
    - ATTACK
    - TURN_LEFT
    - TURN_LEFT + ATTACK
    - TURN_RIGHT
    - TURN_RIGHT + ATTACK

latency:
  method: zero

evaluation:
  eval_episodes: 10
  eval_parallel_envs: 1
  eval_latency_values: null
  eval_max_steps: 3600
  eval_deterministic: true
  eval_raw_reward: true
  eval_suites:
    fixed: []
    normal: []
    uniform: []

logging:
  output_dir: outputs/starvla_defend_the_line_profile
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  video:
    enabled: false
