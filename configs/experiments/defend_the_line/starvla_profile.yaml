__base__:
- ../../base/defend_the_line.yaml

experiment:
  name: starvla_defend_the_line_profile
  seed: 42

backend:
  run_mode: eval

executor:
  mode: realtime

  inference_devices:
  - cuda
  parallel_envs: 1
  sync_cuda: true
env:
  env_fps: 60
  obs_fps: 15
  frame_stack: 4
  obs_resize: [224, 224]
  noop_action: [0, 0]

policy:
  type: starvla
  unnorm_key: new_embodiment
  prompt_mode: latency_neutral
  actions:
  - [0, 0]
  - [0, 1]
  - [1, 0]
  - [1, 1]
  - [2, 0]
  - [2, 1]

  source: local
  root: .
evaluation:
  eval_raw_reward: true
  episodes: 10
  max_env_steps: 3600
  suites: []

logging:
  output_dir: outputs/starvla_defend_the_line_profile
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  video:
    enabled: false
