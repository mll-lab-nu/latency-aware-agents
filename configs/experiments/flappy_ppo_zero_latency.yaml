__base__: ../base/flappy.yaml

experiment:
  name: flappy_ppo_fs0_zero_latency
  num_episodes: 10
  max_env_steps: 10000

latency:
  type: zero

policy:
  type: flappy_ppo
  checkpoint_path: results/checkpoints/flappy_ppo_fs0/flappy_ppo_fs0.pt
  device: auto
  deterministic: true
  actions:
    - noop
    - flap

logging:
  output_dir: outputs/flappy_ppo_fs0_zero_latency
