protocol_id: cross_device_latency_v1
output_root: results/cross_device
checkpoint_kind: best
n_episodes: 100
sim_parallel_envs: 8
sim_worker_count: auto
env_fps_calibration:
  worker_utilization_cap: 0.8
seed_set:
  - 0

runtime_env:
  name: openvla
  conda_env: starvla_rl_games_openvla

devices:
  - id: rtx3090
    display_name: RTX 3090
    profile_id: L_3090
    aliases:
      - RTX 3090
      - NVIDIA GeForce RTX 3090
  - id: rtx4090
    display_name: RTX 4090
    profile_id: L_4090
    aliases:
      - RTX 4090
      - NVIDIA GeForce RTX 4090
  - id: rtx5090
    display_name: RTX 5090
    profile_id: L_5090
    aliases:
      - RTX 5090
      - NVIDIA GeForce RTX 5090
  - id: l40s
    display_name: L40S
    profile_id: L_L40S
    aliases:
      - L40S
      - NVIDIA L40S
  - id: a100
    display_name: A100
    profile_id: L_A100
    aliases:
      - A100
      - NVIDIA A100
      - NVIDIA A100-SXM4-80GB
      - NVIDIA A100-SXM4-40GB
      - NVIDIA A100-PCIE-80GB
      - NVIDIA A100-PCIE-40GB
  - id: h200
    display_name: H200
    profile_id: L_H200
    aliases:
      - H200
      - NVIDIA H200
  - id: b200
    display_name: B200
    profile_id: L_B200
    aliases:
      - B200
      - NVIDIA B200
  - id: rtxpro6000blackwell
    display_name: RTX PRO 6000
    profile_id: L_RTX_PRO_6000_BLACKWELL
    aliases:
      - RTX PRO 6000
      - NVIDIA RTX PRO 6000 Blackwell Workstation Edition

experiments:
  exp1_latency_profile_summary:
    panel: a
    rows:
      - policy: openvla-flappy
        env: Flappy
        policy_type: starvla
        model_type: openvla
        env_name: flappy
        fps: 16
        target_latency_frames: 2
        base_config: configs/experiments/flappy/realtime/starvla_openvla_fix_latency_2_16fps_l2_2gpu_warmup200_3ep.yaml
      - policy: demon-attack-openvla
        env: Demon Attack
        policy_type: starvla
        model_type: openvla
        env_name: demon_attack
        fps: 60
        target_latency_frames: 2
        base_config: configs/experiments/demon_attack/starvla_fixed_l2.yaml
      - policy: deadly-corridor-openvla
        env: Deadly Corridor
        policy_type: starvla
        model_type: openvla
        env_name: deadly_corridor
        fps: 35
        target_latency_frames: 2
        base_config: configs/experiments/deadly_corridor/starvla_single_latency.yaml

  exp2_same_device_calibration:
    panel: b
    rows:
      - policy: openvla-flappy
        env: Flappy
        policy_type: starvla
        model_type: openvla
        env_name: flappy
        fps: 16
        target_latency_frames: 2
        base_config: configs/experiments/flappy/realtime/starvla_openvla_fix_latency_2_16fps_l2_2gpu_warmup200_3ep.yaml
      - policy: demon-attack-openvla
        env: Demon Attack
        policy_type: starvla
        model_type: openvla
        env_name: demon_attack
        fps: 60
        target_latency_frames: 2
        base_config: configs/experiments/demon_attack/starvla_fixed_l2.yaml
      - policy: deadly-corridor-openvla
        env: Deadly Corridor
        policy_type: starvla
        model_type: openvla
        env_name: deadly_corridor
        fps: 35
        target_latency_frames: 2
        base_config: configs/experiments/deadly_corridor/starvla_single_latency.yaml

  exp3_cross_device_prediction:
    panel: c
    rows:
      - policy: openvla-flappy
        env: Flappy
        policy_type: starvla
        model_type: openvla
        env_name: flappy
        fps: 16
        target_latency_frames: 2
        base_config: configs/experiments/flappy/realtime/starvla_openvla_fix_latency_2_16fps_l2_2gpu_warmup200_3ep.yaml
      - policy: demon-attack-openvla
        env: Demon Attack
        policy_type: starvla
        model_type: openvla
        env_name: demon_attack
        fps: 60
        target_latency_frames: 2
        base_config: configs/experiments/demon_attack/starvla_fixed_l2.yaml
      - policy: deadly-corridor-openvla
        env: Deadly Corridor
        policy_type: starvla
        model_type: openvla
        env_name: deadly_corridor
        fps: 35
        target_latency_frames: 2
        base_config: configs/experiments/deadly_corridor/starvla_single_latency.yaml
    replay_pairs:
      - target_device: rtx3090
        replay_device: b200
      - target_device: rtx3090
        replay_device: h200
      - target_device: rtx4090
        replay_device: b200
      - target_device: rtx4090
        replay_device: h200
      - target_device: rtx5090
        replay_device: b200
      - target_device: rtx5090
        replay_device: h200
      - target_device: l40s
        replay_device: b200
      - target_device: l40s
        replay_device: h200
      - target_device: a100
        replay_device: b200
      - target_device: a100
        replay_device: h200
      - target_device: rtxpro6000blackwell
        replay_device: b200
      - target_device: rtxpro6000blackwell
        replay_device: h200
