experiment:
  name: deadly_corridor_base
  seed: 42

backend:
  algo: APPO
  device: cpu
  train_dir: results/sample_factory
  restart_behavior: resume
  run_mode: train

executor:
  mode: simulated
  simulated_worker_capacity: null

  parallel_envs: 1
env:
  name: deadly_corridor
  env_id: doom_deadly_corridor
  env_fps: 35
  obs_fps: 8.75
  noop_action: 0
  frame_stack: 4
  res_w: 128
  res_h: 72
  wide_aspect_ratio: false
  simulator: cpu


latency:
  method: zero
  add_latency_info: false

scheduler:
  hold_policy: hold
  ordering_policy: latest_ready

policy:
  type: random
  actions:
    - 0

  deterministic: true
training:
  train_for_env_steps: 25000000
  num_workers: 32
  num_envs_per_worker: 4
  worker_num_splits: 2
  num_policies: 1
  batch_size: 1024
  rollout: 128
  recurrence: 128
  num_epochs: 2
  num_batches_per_epoch: 2
  learning_rate: 0.0001
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  exploration_loss: symmetric_kl
  exploration_loss_coeff: 0.001
  value_loss_coeff: 0.5
  max_grad_norm: 4.0
  async_rl: true
  use_rnn: true
  rnn_type: gru
  rnn_size: 512
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5

evaluation:
  eval_interval_steps: 1000000
  eval_raw_reward: true
  episodes: 20
  max_env_steps: 30000
  suites:
  - name: fixed_0
    latency:
      method: zero
  - name: fixed_2
    latency:
      method: fixed
      fixed_latency_ms: 57.142857142857146
  - name: fixed_4
    latency:
      method: fixed
      fixed_latency_ms: 114.28571428571429
  - name: fixed_6
    latency:
      method: fixed
      fixed_latency_ms: 171.42857142857142
  - name: normal_mean_4_std_1_min_0_max_15
    latency:
      method: normal
      mean_latency_ms: 114.28571428571429
      std_latency_ms: 28.571428571428573
      min_latency_ms: 0.0
      max_latency_ms: 428.5714285714286
      seed: 42
  - name: uniform_min_2_max_6
    latency:
      method: uniform
      min_latency_ms: 57.142857142857146
      max_latency_ms: 171.42857142857144
      seed: 42
logging:
  output_dir: outputs/deadly_corridor_base
  video:
    enabled: true
    num_bins: 10
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  wandb_project: null
  wandb_group: deadly_corridor-new(remove training episode limit)
  wandb_job_type: sample_factory
  wandb_tags: ""
