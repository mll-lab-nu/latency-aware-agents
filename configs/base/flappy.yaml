experiment:
  name: flappy_base
  seed: 0
  num_episodes: 10

backend:
  type: sample_factory
  algo: APPO
  device: cuda
  train_dir: results/checkpoints
  restart_behavior: resume
  run_mode: train

executor:
  mode: simulated

env:
  name: flappy
  # note that env_fps must be an integer multiple of obs_fps!
  env_fps: 30
  obs_fps: 30
  gym_id: FlappyBird-v0
  render_mode: rgb_array
  observation_mode: image
  use_lidar: false
  normalize_obs: true
  audio_on: false
  frame_stack: 4
  obs_resize:
    - 84
    - 84
  # for training it could be true, but for realtime mode, THIS MUST BE FALSE!
  use_gpu_render: true
  gpu_render_device: auto
  gpu_render_profile: false
  gpu_render_profile_interval: 200
  noop_action: noop
  action_map:
    noop: 0
    flap: 1
  oneshot_actions:
    - flap

latency:
  type: normal_distribution
  mean_latency_ms: 66.7
  std_latency_ms: 33.3
  min_latency_ms: 0
  max_latency_ms: null


scheduler:
  # [one_frame_then_noop, hold]
  # if hold, default hold duration is: env_fps / obs_fps
  hold_policy: one_frame_then_noop
  # can be either `issue_order_fifo` or `latest ready`
  ordering_policy: latest_ready

policy:
  type: random
  actions:
    - noop
    - flap

training:
  train_for_env_steps: 25000000
  num_workers: 2
  num_envs_per_worker: 64
  worker_num_splits: 1
  num_policies: 1
  batch_size: 4096
  rollout: 256
  recurrence: 1
  num_epochs: 8
  num_batches_per_epoch: 8
  learning_rate: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.5
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5

evaluation:
  eval_interval_steps: 500000
  eval_episodes: 15
  eval_parallel_envs: 100
  eval_max_steps: 3600
  eval_deterministic: true
  eval_raw_reward: false
  eval_suites:
    fixed:
      - [0, 3]    # [start, end]
    normal:
      # - [2.0, 0.5, 0, 15]   # low latency, low jitter
      - [2.0, 1.0, 0, 15]   # low latency, medium jitter
      # - [4.0, 0.5, 0, 15]   # high latency, low jitter
      # - [4.0, 1.0, 0, 15]   # high latency, medium jitter
      # - [4.0, 2.0, 0, 15]   # high latency, high jitter
    uniform:
      - [1, 3]  # low latency, low jitter
      # - [0, 4]  # low latency, high jitter
      # - [3, 5]  # high latency, low jitter
      # - [2, 6]  # high latency, high jitter

logging:
  output_dir: outputs/flappy_base
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  wandb_project: latency-sensitive-bench
  wandb_group: flappy-new(remove training episode limit)
  wandb_job_type: sample_factory
  wandb_tags: ""
