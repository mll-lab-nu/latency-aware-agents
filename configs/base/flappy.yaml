experiment:
  name: flappy_base
  seed: 0
  num_episodes: 10
  max_env_steps: 10000

executor:
  mode: simulated

env:
  name: flappy
  gym_id: FlappyBird-v0
  fps_env: 30
  render_mode: rgb_array
  observation_mode: image
  use_lidar: false
  normalize_obs: true
  audio_on: false
  noop_action: noop
  action_map:
    noop: 0
    flap: 1
  oneshot_actions:
    - flap

control:
  frequency_hz: 30
  observe_every_n_frames: 1

latency:
  type: zero

scheduler:
  persistence_mode: noop_after_oneshot
  stale_action_mode: latest_ready

policy:
  type: random
  actions:
    - noop
    - flap

logging:
  output_dir: outputs/flappy_base
  save_step_records: true
  save_action_records: true
  save_latency_records: true
