experiment:
  name: flappy_base
  seed: 0
  num_episodes: 10

backend:
  type: sample_factory
  algo: APPO
  device: gpu
  train_dir: results/sample_factory
  restart_behavior: overwrite
  run_mode: train

executor:
  mode: simulated

env:
  name: flappy
  gym_id: FlappyBird-v0
  fps_env: 30
  render_mode: rgb_array
  observation_mode: image
  use_lidar: false
  normalize_obs: true
  audio_on: false
  frame_stack: 4
  obs_resize:
    - 84
    - 84
  obs_mode: image_only
  use_gpu_render: true
  gpu_render_device: auto
  gpu_render_profile: false
  gpu_render_profile_interval: 200
  noop_action: noop
  action_map:
    noop: 0
    flap: 1
  oneshot_actions:
    - flap

control:
  frequency_hz: 30
  observe_every_n_frames: 1

latency:
  type: zero
  train_enabled: true
  train_values:
    - 0
  train_mode: episode_fixed
  train_sampling_mode: uniform_all
  episodes_per_stage: 10
  randomize_within_stage: false
  within_episode_change_interval: 1
  within_episode_change_prob: 1.0
  add_latency_info: false

scheduler:
  persistence_mode: noop_after_oneshot
  stale_action_mode: latest_ready

policy:
  type: random
  actions:
    - noop
    - flap

training:
  train_for_env_steps: 75000000
  num_workers: 2
  num_envs_per_worker: 64
  worker_num_splits: 1
  num_policies: 1
  batch_size: 4096
  rollout: 256
  recurrence: 1
  num_epochs: 8
  num_batches_per_epoch: 8
  learning_rate: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.5
  async_rl: false
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5

evaluation:
  eval_episodes: 20
  eval_latency_values:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
  eval_max_steps: 3600
  eval_deterministic: true
  eval_raw_reward: false

logging:
  output_dir: outputs/flappy_base
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  wandb_project: latency-sensitive-bench
  wandb_group: flappy
  wandb_job_type: sample_factory
  wandb_tags: ""
