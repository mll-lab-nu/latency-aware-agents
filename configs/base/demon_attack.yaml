experiment:
  name: demon_attack_base
  seed: 0

backend:
  type: sample_factory
  algo: APPO
  device: cpu
  train_dir: results/sample_factory
  restart_behavior: resume
  run_mode: train

executor:
  mode: simulated

env:
  name: demon_attack
  env_id: ALE/DemonAttack-v5
  # env_fps is raw-frame frequency; observations happen at the wrapped env cadence.
  env_fps: 60
  obs_fps: 15
  screen_size: 84
  noop_max: 30
  reset_mode: fire
  frame_stack: 4
  terminal_on_life_loss: true
  clip_reward: true
  repeat_action_probability: 0.0
  full_action_space: false
  max_episode_steps: 25000
  noop_action: 0
  simulator: gpu
  gpu_env_device: auto


latency:
  method: zero
  add_latency_info: false

scheduler:
  hold_policy: hold
  ordering_policy: latest_ready

policy:
  type: random
  actions:
    - 0

training:
  train_for_env_steps: 25000000
  num_workers: 1
  num_envs_per_worker: 512
  worker_num_splits: 1
  num_policies: 1
  batch_size: 1024
  batched_sampling: true
  rollout: 64
  recurrence: 32
  num_epochs: 2
  num_batches_per_epoch: 8
  max_policy_lag: 300
  learning_rate: 0.000303
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.0
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5

evaluation:
  eval_interval_steps: 1000000
  eval_episodes: 20
  eval_parallel_envs: 100
  eval_max_steps: 14400
  eval_deterministic: true
  eval_raw_reward: true
  eval_suites:
    fixed:
      - [0, 2, 4, 6]    # [start, end]
    normal:
      # - [4.0, 0.5, 0, 15]   # low jitter
      - [4.0, 1.0, 0, 15]   # medium jitter
      # - [4.0, 2.0, 0, 15]   # high jitter
    uniform:
      # - [3, 5]  # low jitter
      - [2, 6]  # medium jitter
      # - [0, 8]  # high jitter
logging:
  output_dir: outputs/demon_attack_base
  video:
    enabled: true
    num_bins: 10
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  wandb_project: latency-sensitive-bench
  wandb_group: demon_attack-new(remove training episode limit)
  wandb_job_type: sample_factory
  wandb_tags: ""
