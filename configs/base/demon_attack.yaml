experiment:
  name: demon_attack_base
  seed: 0
  num_episodes: 10
  max_env_steps: 10000

executor:
  mode: simulated

env:
  name: demon_attack
  env_id: ALE/DemonAttack-v5
  fps_env: 60
  screen_size: 84
  noop_max: 30
  terminal_on_life_loss: false
  clip_reward: true
  repeat_action_probability: 0.0
  full_action_space: false
  noop_action: 0

control:
  frequency_hz: 60
  observe_every_n_frames: 1

latency:
  type: zero

scheduler:
  persistence_mode: hold_previous
  stale_action_mode: latest_ready

policy:
  type: random
  actions:
    - 0

logging:
  output_dir: outputs/demon_attack_base
  save_step_records: true
  save_action_records: true
  save_latency_records: true
