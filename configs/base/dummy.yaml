experiment:
  name: dummy_base
  seed: 0
  num_episodes: 10

executor:
  mode: simulated

env:
  name: dummy
  fps_env: 30
  noop_action: noop
  action_map:
    noop: noop
    jump: jump

control:
  frequency_hz: 30
  observe_every_n_frames: 1

latency:
  type: zero

scheduler:
  persistence_mode: noop_after_oneshot
  stale_action_mode: latest_ready

policy:
  type: random

evaluation:
  eval_max_steps: 10000

logging:
  output_dir: outputs/dummy_base
  save_step_records: true
  save_action_records: true
  save_latency_records: true
