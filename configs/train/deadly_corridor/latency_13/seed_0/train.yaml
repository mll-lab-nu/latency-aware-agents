experiment:
  name: deadly_corridor_sf_same_latency_l13_seed0
  seed: 0
backend:
  type: sample_factory
  algo: APPO
  device: gpu
  train_dir: results/checkpoints
  restart_behavior: resume
  run_mode: train
env:
  name: deadly_corridor
  env_id: doom_deadly_corridor
  fps_env: 35
  env_frameskip: 4
  frame_stack: 4
  res_w: 128
  res_h: 72
  wide_aspect_ratio: false
  max_episode_steps: 2100
latency:
  train_values:
  - 13
  train_mode: episode_fixed
  train_sampling_mode: uniform_all
  episodes_per_stage: 10
  randomize_within_stage: false
  within_episode_change_interval: 1
  within_episode_change_prob: 1.0
  add_latency_info: false
training:
  train_for_env_steps: 25000000
  num_workers: 16
  num_envs_per_worker: 4
  worker_num_splits: 2
  num_policies: 1
  batch_size: 1024
  rollout: 128
  recurrence: 128
  num_epochs: 2
  num_batches_per_epoch: 2
  learning_rate: 0.0001
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  exploration_loss: symmetric_kl
  exploration_loss_coeff: 0.001
  value_loss_coeff: 0.5
  max_grad_norm: 4.0
  async_rl: true
  use_rnn: true
  rnn_type: gru
  rnn_size: 512
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5
evaluation:
  eval_episodes: 20
  eval_latency_values:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 10
  - 15
  - 40
  eval_max_steps: 30000
  eval_deterministic: true
  eval_raw_reward: true
logging:
  output_dir: outputs/train/deadly_corridor/latency_13/seed_0
  wandb_project: latency-sensitive-bench
  wandb_group: deadly_corridor
  wandb_job_type: sample_factory
  wandb_name: deadly-corridor-l13-s0
