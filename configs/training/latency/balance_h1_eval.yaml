__base__: balance_h1.yaml

backend:
  run_mode: eval

policy:
  type: sample_factory
  checkpoint_kind: latest
  deterministic: true

evaluation:
  episodes: 100
  max_env_steps: 1000
logging:
  output_dir: outputs/latency_rl/balance/h1/eval_profile
  save_action_records: true
  save_latency_records: true
executor:
  inference_devices:
  - cuda
  parallel_envs: 1
