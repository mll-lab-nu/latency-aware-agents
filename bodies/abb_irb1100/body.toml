# The RoboOlympics ABB IRB 1100 on a two-axis gantry (bodies/README.md, docs: olympiad_review/abb_irb1100_zh.md): the
# robot of Google DeepMind's table-tennis system ("a 6 DoF ABB 1100 arm mounted on top of two Festo linear gantries",
# S2; the variant IRB 1100-4/0.58, S3). The model is an APPROXIMATION FROM PUBLIC SPECIFICATIONS (no licensed model
# exists: tools/make_model.py): exact kinematics from ABB's product specification, simple solids, estimated masses.
# Every limit below is the manufacturer's where one is published (S1), DeepMind's measurement or model of the same
# robot where ABB publishes none (S2, S3), else derived or estimated and marked so. Data only: body.py reads it.

[body]
name = "abb_irb1100"
title = "ABB IRB 1100-4/0.58 on a two-axis gantry"
revision = "abb-1"                     # bump on any change that alters play
kind = "gantry"                        # a 6-axis arm on a Cartesian gantry (body.py): u = [gantry_x, gantry_y, -, -, -,
                                       # axis 1 .. axis 6, -]
model = "model.xml"                    # tools/make_model.py (provenance: no upstream model, ABB's dimensions)
meshes = { standard = "meshes", fine = "meshes_fine", "25k" = "meshes_25k" }   # all three the same simple solids
                                       # (make_model.py writes meshes/ and meshes_fine/, bodies/lod.py meshes_25k/)
license = "MIT (the repository's LICENSE; bodies/abb_irb1100/LICENSE): model.xml and the meshes are our own, written from ABB's published dimensions (S1) and DeepMind's description (S2); no ABB CAD, no third-party model"
mass_kg = 21.1                         # the arm (S1 2.1 "Weight, robot"); the gantry's moving parts 28 kg (estimate,
                                       # tools/make_model.py)
height_m = 1.42                        # the arm's top (axis 2 + lower arm + axis 4 offset) above the floor at the zero pose
mount_height_m = 0.76                  # the arm's mounting surface above the floor (the carriage plate's top): a
                                       # table-tennis table's height, as the Franka sports' pedestal (S2 does not say)

[dof]                                  # the controlled degrees of freedom (u): the library's layout, so that
names = ["base_x", "base_y", "base_yaw", "lift", "waist",   # bodies/conformance.py, bodies/control/wholebody.py and the
         "arm_0", "arm_1", "arm_2", "arm_3", "arm_4", "arm_5", "arm_6"]   # sports' command layers run unchanged
# base_x = gantry_x (the forward axis: towards / away from the table), base_y = gantry_y (the lateral axis: side to
# side), both in m from the gantry's home; base_yaw, lift, waist, arm_6: NOT on this robot (always 0; a row that
# moves them is refused by Rig.check); arm_0 .. arm_5 = axes 1 .. 6 (rad, ABB's signs).

[limits.base]                          # no mobile base: the gantry is a machine fixed to the floor ([limits.gantry])
kind = "absent"

[limits.gantry]                        # [forward (gantry_x), lateral (gantry_y)]: each axis its own drive, limited on
kind = "gantry"                        # its own (bodies/servo.py SetpointGenerator)
range_m = [[-1.5, 0.5], [-1.85, 1.85]] # model.xml (S2 Table VI: DeepMind's simulated ranges 2.06 and 3.77 m of the 2 m and
                                       # 4 m gantries)
speed_m_s = [2.0, 2.0]
accel_m_s2 = [8.0, 8.0]
jerk_m_s3 = [200.0, 200.0]
force_n = [4102.0, 1499.0]             # the drives' force limits (the output stage)
[limits.gantry.source]
range_m = "S2 (Fig. 1: 2 m and 4 m gantries; Table VI: actuator ranges -1.886..0.174 and -1.894..1.88 m)"
speed_m_s = "S3 (section II-A: 'The gantries can move up to 2 m/s in both axes')"
accel_m_s2 = "ESTIMATE: not published (S2, S3 give none; no Festo model numbers are published): the table-tennis sport's rail value (PR #42: 620 N on 76.8 kg), so that the arm is the only difference to the Franka + rail; DeepMind's simulated forces (force_n) on our estimated moving masses would allow 30 m/s^2 or more"
jerk_m_s3 = "ESTIMATE: 25 x the acceleration, as the table-tennis sport's rail (PR #42)"
force_n = "S2 (Table VI: forcerange 4102 N for the forward axis (DeepMind's SlideY), 1499 N for the lateral axis (SlideX))"

[limits.lift]                          # no lift
kind = "absent"
[limits.waist]                         # no waist
kind = "absent"

[limits.arm]                           # axes 1..6 (ABB's numbering and signs)
# ranges: model.xml, S1 2.6.1: +-230, -115/+113, -205/+55, +-230, -125/+120, +-400 (axis 6 default) degrees
speed_rad_s = [8.0285, 6.2832, 4.8869, 9.7738, 7.3304, 13.0900]     # 460, 360, 280, 560, 420, 750 deg/s
accel_rad_s2 = [30.88, 20.30, 22.21, 37.87, 28.40, 50.71]
jerk_rad_s3 = [1544.0, 1015.0, 1110.5, 1893.5, 1420.0, 2535.5]
torque_nm = [100.0, 100.0, 60.0, 20.0, 25.0, 100.0]
reach_m = 0.58                         # S1 1.1
payload_kg = 4.0                       # S1 1.1 (handling capacity; armload 0.5 kg)
tcp_accel_m_s2 = 71.0                  # S1 2.5.5: max Cartesian acceleration in controlled motion at the nominal load's
                                       # centre of gravity (137 at an emergency stop); not enforced: the joint
                                       # accelerations above keep the paddle well below it (bodies/abb_irb1100/README.md)
[limits.arm.source]
speed_rad_s = "S1 (2.8 'Maximum axis speed', IRB 1100-4/0.58)"
accel_rad_s2 = "DERIVED (axes 1-3): S1 2.9.4 category 0 stops of the IRB 1100-4/0.58 at maximum speed, arm stretched, maximum load: the smaller of v^2 / (2 d) and v / t (axis 1: 59.09 deg in 0.26 s from 460 deg/s -> 1769 deg/s^2; axis 2: 55.71 deg, 0.30 s, 360 deg/s -> 1163; axis 3: 29.81 deg, 0.22 s, 280 deg/s -> 1273), the worst-case inertia, so a lower bound of what the drives do; ESTIMATE (axes 4-6, no stop data published): each axis's speed x the mean acceleration / speed ratio of axes 1-3 (3.87 /s, i.e. full speed in 0.26 s)"
jerk_rad_s3 = "ESTIMATE: 50 x the acceleration (ABB publishes no jerk; the library's rule for arms without one, as the Marvin Pro and the KUKA iiwa)"
torque_nm = "S2 (Table VI: the actuators' forcerange of DeepMind's simulation of this robot, 100 / 100 / 60 / 20 / 25 / 100 N m; ABB publishes no axis torques: S1 2.1 bounds axis 1 by the foundation's Tz, 140 N m at an emergency stop)"

[controller]                           # body.py Rig.apply -> bodies/servo.py Servo (jerk-limited setpoints, PD +
[controller.kp]                        # inertia feed-forward + gravity/Coriolis, clipped at the torques, every 1 ms)
gantry = [20000.0, 20000.0]
arm = [3000.0, 3000.0, 2000.0, 400.0, 400.0, 100.0]
[controller.kd]
gantry = [800.0, 800.0]
arm = [80.0, 80.0, 50.0, 8.0, 8.0, 2.0]
[controller.step]
control_dt_s = 0.01                    # the library's 100 Hz target rows (ABB's EGM takes a position every 4 ms, S4;
physics_dt_s = 0.001                   # DeepMind's policy ran at 50 Hz, its low level at 248 Hz through EGM, S2, S3)
[controller.latency]                   # the real system's delays (S3 Table I, S2 Table X: mean, ms): for a sport that
                                       # models them; the servo itself adds none
command_s = 0.071                      # ABB action: a command until the arm moves (EGM: "usually around 20 ms" of
                                       # that is the controller's own lag, S4)
gantry_command_s = [0.084, 0.056]      # Festo action, forward / lateral (S2 Table X)
joint_observation_s = 0.029            # ABB observation
gantry_observation_s = 0.033           # Festo observation
ball_observation_s = 0.040             # the ball's position from the cameras

[perception]                           # what the real system observes (S2, S3)
ball_sample_s = 0.008                  # two Ximea MQ013CG-ON cameras at 125 Hz (S2 II-B; S3 II-D: 125 FPS, 4 ms exposure)
ball_noise_m = 0.002                   # ESTIMATE: not published; a stereo pair 2 m above the table at 1280 x 1024
ball_only = "position"                 # no velocity, no spin: the player estimates them from positions

[rest]                                 # the ready pose (u[0:2] gantry, u[5:11] axes 1..6): tools/rest_pose.py
gantry = [0.0, 0.0]
arm = [0.1552, 0.651, 0.0528, -0.9694, 1.2692, -2.4797]   # tools/rest_pose.py 0.40 -0.10 1.00: the paddle's centre
                                       # 0.40 m ahead of axis 1, 0.10 m to the right (forehand), 1.00 m above the floor
                                       # (0.24 m above a table at the mount height), its face forward; joints >= 0.83
                                       # rad from their ranges

[mounts]
wrist = "the body mount at the tool flange (64 mm beyond the wrist centre, axis 6), +z away from the wrist"
cameras = ["overview"]                 # a camera behind the gantry (the real system's cameras are the venue's, S2)


# ---------------------------------------------------------------------------------------------------------------------
# Self-collision (real limits B0, bodies/selfcollision.py): the arm cannot pass through the gantry or itself.
[self_collision]
parts.arm = "link_[1-6]"
parts.body = "base|gantry_[xy]|link_0"
rules = { arm_body = true, arm_arm = false, tool_own_arm = true, same_arm = false }
# same_arm off: ABB's axis ranges are the arm's mechanical design (S1 2.6.1; e.g. pos5 folds axis 3 to -205 deg), and
# the approximate solids are fatter than the real links at the elbow and the wrist, so link-against-link pairs would
# block poses the real arm reaches; the paddle against the arm (tool_own_arm) and the arm against the gantry stay on
warn_force_n = 20.0
[self_collision.source]
warn_force_n = "ESTIMATE: ABB publishes no force threshold for its collision detection, only a sensitivity in per cent of a model-based torque supervision (S5); the Franka's collision threshold (20 N, bodies/franka_panda S4) for every body, so one rule reads the same everywhere"

[sources]
S1 = "ABB, Product specification IRB 1100, document 3HAC064993-001 revision V (release 26B, 2026): 1.1 (reach 0.58 m, 4 kg), 2.1 (weight 21.1 kg; foundation loads), 2.3.2 (main dimensions of the IRB 1100-4/0.58: 327, 280, 10, 300, 64 mm), 2.5.5 (max TCP acceleration 137 / 71 m/s^2), 2.6.1 (working ranges), 2.8 (max axis speeds), 2.9.4 (stopping distances and times), https://search.abb.com/library/Download.aspx?DocumentID=3HAC064993-001&LanguageCode=en&DocumentPartId=&Action=Launch, read 2026-10-10"
S2 = "D. B. D'Ambrosio et al., 'Achieving Human Level Competitive Robot Table Tennis', arXiv 2408.03906v3 (Google DeepMind, 2024): Fig. 1 (ABB 1100 on two Festo linear gantries, 4 m and 2 m), II-B (50 Hz joint velocity policy, cameras 125 Hz), Appendix Table VI (the simulated robot's actuators), Table X (latencies)"
S3 = "D. B. D'Ambrosio et al., 'Robotic Table Tennis: A Case Study into a High Speed Learning System', RSS 2023, arXiv 2309.03315v2: II-A ('ABB IRB 120T or ABB IRB 1100-4/0.58'; 'The gantries can move up to 2 m/s in both axes'), II-B (EGM at 248 Hz; the Festo gantry through Modbus at about 125 Hz), II-D (cameras), Table I (latencies)"
S4 = "ABB, Application manual Externally Guided Motion (OmniCore), 3HAC073318-001 revision P: a position every 4 ms (4.032 ms measured), 'stable data exchange up to 250 Hz', a control lag of 10-20 ms, 'usually around 20 ms' until a new position starts to affect the robot"
S5 = "ABB, Application manual Controller software OmniCore RW 7, 3HAC066554-001 revision Y, 5.2 Collision Detection [3107-1]: model-based supervision, a sensitivity level in per cent (default 100 %), no force threshold published"
