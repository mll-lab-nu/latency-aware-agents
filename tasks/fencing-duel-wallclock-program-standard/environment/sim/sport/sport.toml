# fencing (epee): one FIE pool bout between two robot fencers (docs/framework_zh.md §4.2, §8). Migrated from the legacy
# tree in stage 3 (scripts/olympiad/fencing, scripts/olympiad/shared/fencing): the simulator (fencing.py: world,
# motion controllers, apparatus, phrase referee; bout.py: the pool-bout referee; opponent.py + strategies.py: the
# scripted opponent) is unchanged, so the legacy recordings replay bit-exactly (golden/convert.py). The declarations
# below are data: the core, tools/generate.py, tools/check and the prompt read them.

[sport]
name = "fencing"
title = "Robot epee fencing"
summary = "two identical Franka Panda arms (held to the real robot's joint velocity, acceleration, jerk, torque and torque-rate limits), each on a 0.90 m pedestal on a cart running on a rail (a Festo EGC-TB-185 axis held to 2 m/s, 6 m/s^2 and 150 m/s^3) along a regulation 14 m piste and holding an epee (0.90 m blade, 13.5 cm bell guard), fence one FIE pool bout (5 touches or 3 minutes, no draws; one minute without a touch is unwillingness to fight, FIE t.124) in MuJoCo; blades, guards and bodies collide physically and the electric apparatus is modelled on the point's force along the blade; format bout: you against a scripted fencer (levels 1-3, `game spec` opponent_level), format duel: two players"
protocol = "realtime"
revision = "fencing-6+core-0.2"       # bump on any change that alters play (the simulator, the rules, the observation); 6: the arms' setpoint generator brakes within the jerk in force (bodies/limits.JerkLimiter: no ringing at the torque-rate jerk caps)
physics = "mujoco"
image = "ghcr.io/mll-lab-nu/eai-olympiad:0.1.0"
status = "sport"
publish = true
category = "robotics-sports-arena"

[rulebook]
name = "FIE Technical Rules (t.) and Material Rules (m.), epee"
version = "August 2026"
url = "https://static.fie.org/uploads/40/204126-Technical%20rules%20August%202026%20ang.pdf"
articles = "piste 14 x 1.5 m, on-guard lines 2 m from the centre line, rear limits 7 m (t.18, t.19); on guard and placement after a halt (t.22, t.31); corps-a-corps halts (t.25), close quarters allowed (t.24); rear limit crossed with both feet = hit against (t.34); fencing time (t.37); pool bout to 5 hits or 3 minutes, at 4-4 a double hit is not counted, equal at time: one minute for a deciding hit with the winner drawn by lot before it (t.38); clock end (t.44); epee: point only, whole body target, double hits count for both (t.90-t.93); unwillingness to fight: one minute of fencing without a hit, P-red to both, then P-black (t.124, t.170 0.5); point pressure more than 750 g (m.19.2); apparatus: hits of 2-10 ms registered, none under 2 ms, double-hit window 40-50 ms (Material Rules Annexe B, B. Epee); blade at most 90 cm (m.16.3), guard through a 13.5 cm gauge (m.17.1)"
material_rules = "https://static.fie.org/uploads/40/204156-book%20material%20August%202026%20ang.pdf"
rules_check = "sports/fencing/rules_check.md (every article and value checked against the two PDFs)"

[arm]                                  # the real robot the arms are held to (bodies/franka_panda/body.toml, bodies/limits.py)
body = "franka_panda"                  # the scene's arm is MuJoCo Menagerie's Panda (panda_nohand): the Panda's limits, not the FR3's
joints = "^(?P<arm>[AB])_joint(?P<j>[1-7])$"   # tools/arm_limits.py: the arm joints of the scene

[[deviations]]
id = "D1"
rule = "t.28, t.33, t.35"
text = "footwork is a cart on a rail along the piste's centre line: no lateral boundaries and no passing"
affects_result = true
[[deviations]]
id = "D2"
rule = "t.91, m.19, Material Rules Annexe B"
text = "the robot's whole structure (cart, pedestal, arm) is the target; the apparatus measures the force on the point along the blade (> 7.35 N for >= 2 ms, three consecutive 1 ms samples; lockout 45 ms, inside the 40-50 ms tolerance)"
affects_result = true
[[deviations]]
id = "D3"
rule = "t.24, t.25"
text = "corps-a-corps needs a trunk (cart, pedestal, shoulder) in contact with the other robot; arm-on-arm and blade contact is fencing at close quarters and goes on"
affects_result = true
[[deviations]]
id = "D4"
rule = "t.31, t.32"
text = "after a corps-a-corps both fencers move back equally (t.31 instead of t.32)"
affects_result = true
[[deviations]]
id = "D5"
rule = "t.158-t.170"
text = "no cards or penalties (the robots cannot commit the faults they punish), except the P-cards for unwillingness to fight (t.124, D9)"
affects_result = false
[[deviations]]
id = "D6"
rule = "t.38 (competition formula)"
text = "one pool bout instead of a competition"
affects_result = false
[[deviations]]
id = "D7"
rule = "-"
text = "the arms are Franka Panda arms held to the manufacturer's joint limits (velocity 2.175 / 2.61 rad/s, acceleration 7.5-20 rad/s^2, jerk 3750-10000 rad/s^3, torque 87 / 12 N m, torque rate 1000 N m/s; Franka 'Control Interface Specification and Robot Limits', FER): a full extension from on guard takes 0.55-0.75 s, slower against the footwork than a fencer's arm (fencing-2 used 1.5 x the velocity and acceleration limits: 0.50-0.58 s)"
affects_result = true
[[deviations]]
id = "D8"
rule = "-"
text = "the footwork rail is a Festo EGC-TB-185 toothed-belt axis (catalogue: 5 m/s, 50 m/s^2, feed force 2500 N; Festo operating instructions 8162896, 2023-05) run inside that envelope: 2 m/s, 6 m/s^2, a jerk limit of 150 m/s^3 (an estimate: Festo publishes no jerk limit; the B9 feasibility study's value) and a motor force of at most 2500 N (fencing-4; up to fencing-3 the rail was no real product: 2 m/s, 6 m/s^2, 3000 N, no jerk limit). A 4 m advance at full speed takes about 2.6 s"
affects_result = true

[[deviations]]
id = "D9"
rule = "t.124, t.170 (0.5)"
text = "unwillingness to fight (FIE Technical Rules, August 2026, t.124: 'There is unwillingness to fight when there is one minute of fencing without a hit'; the FIE applies its sanctions to direct-elimination bouts (t.124.1) and team matches (t.124.2), not to pool bouts) applies to our one pool bout, with the direct-elimination sanctions: one minute of fencing time, measured on the bout clock (`fencing_time_s`, effective fencing time as in t.37: 60 s = 6000 control steps of 10 ms; the wall clock takes slowdown x 60 s), without a hit -> 'Halt!'; the first time a P-red card to both fencers, a penalty hit each, both put on guard on the on-guard lines (t.124.1.a, t.22.6); the second time the P-black card to the fencer with the lower score, who loses the bout, at equal scores to the fencer who loses a seeded lot (t.124.1.b.i: lots for fencers not in the FIE ranking, as all of ours); no P-card at 4-4, the pool's 14-14 (t.124.3.a): the halt is called and the minute restarts; the minute restarts after each hit, double, annulled double, rear-limit hit (t.34) and penalty hit (t.124.3.d), not after a corps-a-corps; t.124 does not apply in the extra minute (t.124.3.f). fencing-5; up to fencing-4 a bout could be run out without a hit to the 3 minutes and the extra minute's lot"
affects_result = true

[formats.bout]              # seat A against the scripted fencer inside the world (opponent.Opponent)
seats = ["A"]
opponent = true                       # success = winning a valid bout (core/grading.py), as in the legacy task
levels = [1, 2, 3]                    # the opponent level (RCB_LEVEL; default 1)
[formats.duel]
seats = ["A", "B"]
first = ["A", "B"]                    # FIRST_PLAYER names the fencer called first (t.22.1); the piste is symmetric, it does not enter the bout

[modes]
action_levels = ["high", "low"]       # high = the legacy interface (point pose + IK); low = joint space (joints / move / hold / traj)
plays = ["program"]

[timing]
slowdown = 20                         # the legacy default (RCB_SLOWDOWN; official 1, 2, 5, 10, 20)
start_timeout_s = 1800
ready_timeout_s = 300                 # each review (after every halt), else the bout is lost

[actions.cli]                         # `game guard`, `game none` (high); `game move X VMAX`, `game hold` (low); everything else: `game act JSON`
high = { guard = [], none = [] }
low = { move = ["x", "vmax"], hold = [] }

[observation]
fields = ["score", "fencing_time_s", "time_left_s", "extra_minute", "priority", "lamps", "robot", "command", "halts",
          "last_halt", "review_prompt", "passivity"]
renderer = "mujoco"                   # the images are drawn by the sport (cameras.py, MuJoCo osmesa) in each seat's render worker
frame_budget_ms = 4000                # one legacy view (8 tiles of 800 x 360, osmesa on the CPU): measured 3.3 s at host load ~700, 0.3 s at load ~45; a tile cache draws only the new camera frames
columns = 4

[spec]                                # the rule constants (the simulator's values; /spec adds cameras, robot, limits, kinematics)
bout = "one FIE pool bout (t.38): the first to 5 touches wins; 3 minutes of fencing time (the clock runs only while the world runs); at time the fencer ahead wins; at equal scores one more minute for a deciding touch with priority drawn by lot before it (seeded), the priority holder winning if still equal; a double touch counts for both except at 4-4 (not counted); in the extra minute a double leaves the scores equal. Unwillingness to fight (FIE t.124): one minute of fencing time (60 s of the bout clock) without a touch halts the bout; the first time both fencers get a P-red card, a penalty touch each; the second time the fencer with the lower score gets the P-black card and loses the bout (at equal scores: the one who loses a lot, seeded); no card at 4-4 (the minute restarts); the minute restarts after every touch (also a double, an annulled double and a rear-limit touch), not after a corps-a-corps; it does not apply in the extra minute (observation `passivity`: the time without a touch)"
touch = "only with the point (t.90-t.93): it counts when your point presses on any part of the opponent's robot (cart, pedestal, arm) along the blade with more than 7.35 N for at least 2 ms; on the guard, the blade, the piste or the rail it does not count; the apparatus locks 45 ms after the first touch, a touch by the other fencer before that is a double touch"
halts = "after every touch; after one minute of fencing time without a touch (unwillingness to fight, t.124); at a corps-a-corps (a cart, pedestal or shoulder touching the other robot; arms and blades touching is close quarters and goes on, t.24-t.25); when a cart goes entirely behind its rear limit, a touch against that fencer (t.34); at the end of time. The world freezes for the review (`game ready WHY PLAN`) after every halt"
on_guard = "at the start, after a valid touch and before the extra minute the carts are put on the on-guard lines (2 m from the centre line) and the arms in the on-guard pose; after a halt without a touch they stay where they were, each moved back the same distance to 4 m between the carts, a cart in front of its rear limit not put behind it (t.22, t.31)"
piste = "metres, seconds; your own frame: x along the piste towards the opponent, y to your left, z up, piste surface z = 0; 14 m x 1.5 m, centre line x = 0, on-guard lines x = -2 (yours) and +2, rear limits x = -7 (yours) and +7, run-backs to -9 and +9"
robot = "a cart (0.5 m long, 0.44 m wide, 0.14 m high) on the rail at y = 0 (|x| <= 7.6; a Festo EGC-TB-185 toothed-belt axis run at 2 m/s, 6 m/s^2 and a jerk of 150 m/s^3 (estimate), motor force at most 2500 N: a time-optimal go-to under these limits, `game spec` robot.rail), a 0.90 m pedestal, the arm's base at 0.90 m and the shoulder at 1.233 m; a Franka Emika Panda arm held to the manufacturer's joint limits (Franka 'Control Interface Specification and Robot Limits', FER; `game spec` robot.arm_limits): velocity 2.175 rad/s joints 1-4, 2.61 rad/s 5-7; acceleration 15, 7.5, 10, 12.5, 15, 20, 20 rad/s^2; jerk 7500, 3750, 5000, 6250, 7500, 10000, 10000 rad/s^3; torque 87 N m joints 1-4, 12 N m 5-7; torque rate 1000 N m/s; planned joint moves are time-optimal S-curves at 95 % of the velocity, acceleration and jerk limits (and of the jerk the torque-rate limit allows at the pose); the robot's 1 kHz servo never commands more than the limits (it smooths any reference to them) and its motor torques change by at most 1 N m per ms; a joint pushed more than 0.02 rad off its setpoint (a hit, a bind) makes the setpoint follow the arm; the epee is held at the flange: grip 0.10 m, bell guard 13.5 cm, blade 0.90 m, the point 1.04 m in front of the grip; on guard the point is at (1.40, -0.05, 1.10) in the cart frame pointing along (1, 0, -0.05); the point reaches about 1.75 m in front of the cart's centre; contacts (blades, guards, arms, bodies) are simulated (MuJoCo, 1 ms steps)"
actions_high = "act {t, tip [u, v, z], dir [du, dv, dz], rail [x, vmax] (optional)}: the point at (u, v, z) in your cart frame (u forward from the cart's centre, v left, z up from the piste; 0 <= u <= 2, |v| <= 0.8, 0.1 <= z <= 2) with the blade along dir, T s after the command takes effect (0 <= T <= 3) or as soon as the joint limits allow (reply: arrive_s, limited_by_joints; ik_residual > 0.002 = out of reach, the arm goes to the nearest pose it can); move {rail [x] or [x, vmax]}: the rail goal only (|x| <= 7.6, 0.05 <= vmax <= 2 m/s); guard: the arm back on guard; none: the arm stops where it is. An act takes effect at the first 10 ms control step after its IK is ready, the others at the next step; a new arm command replaces the one under way, the cart keeps going to its rail goal"
actions_low = "joints {q (7 arm joint goals, rad), t, rail_x, rail_vmax (optional)}: a time-optimal jerk-limited joint-space move under the arm's limits (no IK: the kinematic chain is in `game spec` kinematics); move {x, vmax}: the rail goal; hold: the arm stops; traj {q: rows [x, q1..q7]}: 100 Hz joint position targets (one row per 10 ms step; the arm within the velocity limits and the acceleration limits, second differences / (10 ms)^2, the servo smoothing them to the jerk limits; the rail column within the rail's 2 m/s, 6 m/s^2 and 150 m/s^3, first, second and third differences, joined to the rail's last three targets; refused otherwise, and first rows that do not join the current targets within the limits are rejected at the effect; after the last row the rail brakes to rest at it within its limits). Every command takes effect at the next control step"
observation = "a PNG of 2 rows (side camera beside the piste, top camera above it; poses and intrinsics in `game spec` cameras) x 4 columns (camera frames 20 ms apart, oldest left) of 800 x 360 tiles: your robot red, the opponent blue, the points yellow; no opponent coordinates. The state: score, fencing time, the lamps during the phrase, the last halt, your robot (cart_x, cart_v, the arm joints q, point, guard and blade_dir in your frame, rail goal, whether the arm is still moving) and your command in force"
scripted_opponent = "format bout: the computer fencer has the same robot and limits; it sees your robot with a reaction delay (level 1: 0.16 s, 2: 0.10 s, 3: 0.06 s) and plays one of its level's actions per phrase (level 1: attacks, attacks on preparation, distance play, feints; level 2 adds beats, parries, stop-hits, running attacks; level 3 beats, counter-beats, derobements, parries, retreats, low and running attacks, preferring what has scored); a phrase without a halt for 5 s makes it attack on the blade"

[tiebreaks]
order = ["touches", "passivity", "time", "deciding_touch", "priority"]
text = "the first to 5 touches wins (FIE t.38); a second minute without a touch (unwillingness to fight, FIE t.124) loses the bout for the fencer with the lower score, at equal scores for the one who loses a lot (seeded); at the end of the 3 minutes the fencer ahead wins; at equal scores one more minute is fenced and the first touch decides; if the scores are still equal after it, the fencer with priority, drawn by lot (seeded) before the extra minute, wins (FIE t.38.2.b)"
last_resort_in_prompt = true

[[exploits]]
id = "E1"
text = "out-of-range or malformed commands (both levels) are refused (HTTP 400) and change nothing"
test = "test_exploit_commands_out_of_range_refused"
[[exploits]]
id = "E2"
text = "a joint-target trajectory beyond the robot's speed or acceleration limits (the rail: also jerk) is refused (traj rows checked; first rows that do not join the current targets and the rail's motion within the limits are rejected at the effect, e.g. an arm-only traj that would stop a running cart at once); no command makes the arm exceed the real Panda's limits or the rail its 2 m/s, 6 m/s^2 and 150 m/s^3"
test = "test_exploit_traj_speed_limits"
[[exploits]]
id = "E3"
text = "stalling (never attacking, point in line) gains nothing: the level-1 opponent breaks the waiting game and scores"
test = "test_exploit_stalling_loses_against_level_1"
[[exploits]]
id = "E4"
text = "ramming the cart into the opponent with the arm on guard is no defence: against the stop-hit it is hit more often than it scores (12 phrases)"
test = "test_exploit_ramming_is_stop_hit"
[[exploits]]
id = "E5"
text = "running back behind the rear limit is a touch against (t.34)"
test = "test_exploit_rear_limit_is_a_touch_against"
[[exploits]]
id = "E6"
text = "the observation holds no opponent state and no seed (only the camera images show the opponent)"
test = "test_exploit_no_opponent_state_or_seed"
[[exploits]]
id = "E7"
text = "no draws: equal at time goes to the extra minute and then to the priority; doubles at 4-4 are not counted"
test = "test_exploit_no_draws"

[[exploits]]
id = "E8"
text = "running out the clock without a touch (both fencers waiting, or one retreating to its rear limit and the other waiting) is unwillingness to fight (t.124, D9): after one minute both get a P-red card (a penalty touch each), after the second minute the lower score (equal: a seeded lot) gets the P-black card and loses; up to fencing-4 the same play reached the end of time at 0-0 and the extra minute's lot"
test = "test_exploit_passivity_cards"

[players]
reference = "reference"               # Sport.players() names: camera-only
reference_class = "builtin_players:Reference"
check = []                            # the generic tests play the reference only: every view renders the legacy 8-tile image on the CPU, a random policy's long bouts would take hours

[fairness]
policy = "reference"
matches_per_order = 20                # N = 40: the 95% CI is wider than +-5 pp (a WARN; realtime fairness only warns): each bout renders ~1000 legacy views on the CPU
max_advantage_pp = 5
mirror = "statistical"                # B is A turned by 180 degrees: mirrored, but contact order makes it not bit-exact

[official]
seeds = [1, 2, 3, 101, 111, 121, 202, 212, 222, 303, 313, 323]   # the duel's seeds and the legacy bout's per-level seeds
first_any = true
levels = [1, 2, 3]
slowdowns = { program = [1, 2, 5, 10, 20] }   # the legacy bout's set (the legacy duel: 10, 20)

[golden]
episodes = "golden"                   # sports/fencing/golden/<case>/ + convert.py (the legacy records)

[[tasks]]
format = "bout"
action_level = "high"
id = "fencing-bout-wallclock-program-standard"      # the Season-1 task names ([[tasks]] id)
[[tasks]]
format = "duel"
action_level = "high"
id = "fencing-duel-wallclock-program-standard"

[broadcast]                           # spectators: the replay video's camera (the legacy replay.mp4 view)
camera = { name = "broadcast", pos = [0.0, -9.95, 1.95], lookat = [0.0, 0.0, 0.9], fovy_deg = 45, width = 960, height = 400 }

[capabilities]                        # docs/capabilities_zh.md: 2 primary, 1 secondary, 0 none
a1 = 2                                # 3D: the opponent's cart and arm only from two cameras
a2 = 1                                # contact dynamics of blades and bodies, the apparatus force
a3 = 2                                # embodiment: the arm (the real Panda's limits) and the cart under rail limits, IK reach
a4 = 2                                # real time: reaction delays, distance and timing (stop-hits, attacks on preparation)
b1 = 2                                # FIE rules: doubles, 4-4, rear limit, corps-a-corps, the extra minute and priority
b2 = 2                                # reading the opponent: tactics per phrase, the scripted levels adapt
b3 = 0
physics = ["contact"]

# ---------------------------------------------------------------------------------------------------------------------
[self_collision]                       # real limits B0 (2026-10-09): the arm cannot pass through its own stand and links
body = "franka_panda"                  # bodies/franka_panda/body.toml [self_collision]; the pairs in the scenes below are
                                       # generated (python3 -m bodies.selfcollision scene sports/fencing), CI S4 compares
[[self_collision.scenes]]
scene = "scene/fencing_scene.xml"
robots = [{ prefix = "A_", suffix = "" }, { prefix = "B_", suffix = "" }]
geoms = "physical"                     # the arm's meshes, the tool, the stand (massless drawings left out)
