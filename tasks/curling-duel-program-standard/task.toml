schema_version = "1.3"
artifacts = [
  "/app/output/",
  { source = "/app/output/", service = "seat_a", destination = "seats/A/app/output" },
  { source = "/app/output/", service = "seat_b", destination = "seats/B/app/output" },
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/video.json", service = "sim" },
  { source = "/data/broadcast.jsonl", service = "sim" },
  { source = "/data/think_usage_A.json", service = "sim" },
  { source = "/data/think_calls_A.jsonl", service = "sim" },
  { source = "/data/think_usage_B.json", service = "sim" },
  { source = "/data/think_calls_B.jsonl", service = "sim" },
]

[task]
name = "robot-coding-bench/curling-duel-program-standard"
description = "Curling, PROGRAM PLAY, duel, action level low (eai-standard-turn/1.0): two teams slide granite stones down a sheet of ice towards the house, 4 ends of 5 stones per team; you skip one team and throw every one of its stones (release speed, direction and spin); in the `match` format the other team is a scripted computer team, in the `duel` format another player. Generated from sports/curling/sport.toml by tools/generate.py on the v0.2 core."
authors = [{ name = "RoboOlympics" }]
keywords = ["program-play", "curling", "sports", "turn", "vision", "roboolympics-v0.2"]

[metadata]
revision = "curling-2"
author_name = "RoboOlympics"
category = "robotics-sports-arena"
task_type = "trajectory"
simulator = "curling ice model (DigitalCurling FCV1, pure Python, 1 ms steps) with impulse collisions; MuJoCo renders the cameras"
robot = "none"
family = "curling_duel"
mode = "standard"
protocol = "eai-standard-turn/1.0"
play = "program"
action_level = "low"
oracle = "full"
oracle_evidence = "solution/: the sport's reference player (camera images and /spec only); tools/check runs it live and it wins the default configuration"
parameters = "DUEL_SEED, FIRST_PLAYER, RO_RENDERER (the players' image renderer)"
expert_time_estimate_hours = 0.5

[[seats]]
name = "A"
service = "seat_a"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress_a"]

[[seats]]
name = "B"
service = "seat_b"
agent_kwargs = { think_proxy_url = "http://sim:18091/v1" }
setup_networks = ["egress_b"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 600); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; [ x$RCB_RENDER_VIDEO = x1 ] && for i in $(seq 1 300); do [ -f /data/video.json ] && break; sleep 1; done; cat /data/final.json | head -c 2000"
timeout_sec = 1080

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 1024
