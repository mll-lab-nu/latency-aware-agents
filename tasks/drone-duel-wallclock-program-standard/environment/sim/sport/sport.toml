# drone: drone racing after FAI F9U (docs/framework_zh.md §4.2, §8). Migrated from the legacy tree in stage 2
# (scripts/olympiad/drone, scripts/olympiad/shared/drone/sim): the simulator race.py is unchanged, so the legacy
# recordings replay bit-exactly (golden/convert.py). [[tasks]] id keeps the legacy task names
# (drone-racing-wallclock-program-standard, drone-duel-wallclock-program-standard).

[sport]
name = "drone"
title = "Drone racing"
summary = "fly an original simulated quadrotor through a seeded course of numbered gates by its front camera and its own telemetry, commanding world-frame velocity and yaw rate; format racing: three qualifying rounds alone (level 1-3), format duel: heats against another player who flies the same level-2 course at the same time in a world of its own, the first to two heat wins wins"
protocol = "realtime"
revision = "drone-race-4+core-0.2"    # bump on any change that alters play (race.py, the rules, the observation)
physics = "mujoco (CPU, 500 Hz rigid-body quadrotor with lagged rotors, linear drag in a seeded wind, kinematic shutters)"
image = "ghcr.io/mll-lab-nu/eai-olympiad:0.1.0"
status = "sport"
publish = true
category = "robotics-sports-arena"

[rulebook]
name = "FAI Sporting Code Section 4 (Aeromodelling), Volume F9 Drone Sports, chapter C, class F9U Drone Racing"
version = "2026 edition (effective 1 January 2026)"
url = "https://www.fai.org/sites/default/files/document/file/SC4_volume_CIAM_F9_Drone_sports_2026.pdf"

[[deviations]]
id = "D1"
rule = "C.2, C.6"
text = "one flight through an open course (the C.2 'open loop to be flown once') per round or heat, not three laps of a closed circuit in 3 minutes; the time limit is 35 / 60 / 120 s for levels 1 / 2 / 3"
affects_result = true
[[deviations]]
id = "D2"
rule = "C.6.3"
text = "format racing: exactly 3 qualifying rounds, Option 1 ranking (the best result; the 2nd and 3rd results split ties) with one lap; a round's result is its finish time, or the gates passed and the time at the last gate when it did not finish (gates as the sectors C.2 allows)"
affects_result = true
[[deviations]]
id = "D3"
rule = "C.6.4, C.6.5"
text = "format duel: a race of two pilots instead of four, flown as successive final races (C.6.5.3): the first to win two heats wins; a tied heat is re-flown, at most 5 heats; then more heat wins, the C.6.3 a order (best, second best, ... heat result), the winner of the last heat that had one, and a seeded lot"
affects_result = true
[[deviations]]
id = "D4"
rule = "C.6.4"
text = "a heat ends as soon as its placing is decided (the other drone is down or home and cannot catch up)"
affects_result = false
[[deviations]]
id = "D5"
rule = "C.2, C.6.2"
text = "both drones start at the same point, each in a world of its own (no mid-air collision, no restarts for collisions, C.8.2), and neither sees the other"
affects_result = true
[[deviations]]
id = "D6"
rule = "C.6.1, C.6.2"
text = "the clock starts when the world runs (after game start / game ready), with no start tone and no false start; qualifying rounds are timed from the start, not from a timing gate"
affects_result = false
[[deviations]]
id = "D7"
rule = "C.7.2"
text = "a gate counts only when the drone's centre crosses its plane forwards at least 0.18 m inside every edge (the whole drone through the opening); a missed gate may be flown again"
affects_result = true
[[deviations]]
id = "D8"
rule = "C.7.3, C.9.1"
text = "any contact (gate, panel, shutter, floor, wall) ends the flight; leaving the arena (the safety line) ends it as in C.9.1"
affects_result = true
[[deviations]]
id = "D9"
rule = "C.2"
text = "added: moving shutters (levels 2, 3), wind (levels 2, 3) and floor-to-ceiling panels to fly round (level 3); the course is fixed by the seed, the wind and the shutter phases change every round"
affects_result = true
[[deviations]]
id = "D10"
rule = "C.1"
text = "an original 0.35 kg simulated quadrotor commanded by world-frame velocity and yaw rate through an onboard attitude controller, not an FPV pilot's stick inputs; FPV image 320 x 240; exact own-state telemetry"
affects_result = false

[formats.racing]                      # the qualifying stage, flown alone (legacy drone-racing-wallclock-program-standard)
seats = ["A"]
opponent = false                      # solo: success = at least one finished round (the score) in a complete event
success = { score_at_least = 1 }
levels = [1, 2, 3]                    # the course level (RCB_LEVEL; default 1)
[formats.duel]                        # successive final races (legacy drone-duel-wallclock-program-standard), level 2
seats = ["A", "B"]
first = ["A"]                         # no first mover: both drones start at once in identical worlds, so a second
                                      # first order would replay the same matches; the golden data and the official
                                      # set vary the seed instead

[modes]
action_levels = ["low"]               # the velocity / yaw-rate command is the only level
plays = ["program"]

[timing]
slowdown = 10                         # RCB_SLOWDOWN default: the legacy racing task's x10 (the legacy duel used x20;
                                      # one default per sport)
start_timeout_s = 1800                # after the first seat started (duel: else a no-show)
ready_timeout_s = 300                 # each review (legacy duel: 300 s; the legacy single had no limit)

[actions.cli]                         # `game fly VX VY VZ YAW_RATE DURATION`
low = { fly = ["vx", "vy", "vz", "yaw_rate", "duration"] }

[observation]
fields = ["heat", "heat_tick", "tick", "time_s", "gates_passed", "gates_total", "gate_times", "flight_over",
          "flight_reason", "finished", "time_limit_s", "robot", "command", "command_until_tick", "event_over",
          "results", "standing", "level", "last_heat", "heat_wins"]
renderer = "mujoco"
frame_budget_ms = 500                 # one 320 x 240 FPV tile with shadows and the floor reflection (CPU, osmesa:
                                      # about 200 ms on a heavily loaded host)
columns = 1

[spec]                                # the rules (also /spec); the geometry and limits come from race.py (/spec)
real_time = "this sport is real time (where the generic text above says otherwise, this line holds): `game wait DT` (POST /wait {\"dt\": DT}, 0 < DT <= 1) lets the world run DT game seconds; `game ready \"WHY\" \"PLAN\"` is due only after each round or heat, not after each action; acts are never out of turn, one in flight at a time; in the duel the opponent flies in a world of its own (not the same world); there is no release point and no execution scatter: your command goes to the drone's attitude controller"
course = "numbered orange square gates spaced 3.5-4.3 m along +x, alternating left and right with changes of height and yaw; level 1: 6 gates with 1.4 m openings; level 2: 8 gates, 1.15 m, wind and two moving magenta shutters (gates 3 and 6); level 3: 10 gates, 0.85 m, stronger wind, four faster shutters (gates 2, 4, 7, 9) and two blue floor-to-ceiling panels to fly round; the course is fixed by the seed, wind and shutter phases change every round or heat"
gate_tag = "above each frame a black plate carries the gate's number in eight cells read left to right from the front: white = 1, black = 0; the first four cells are the number (most significant bit first), the last four its complement"
flight = "pass every gate in order from its front (the side facing the start) to its back; a gate counts when the drone's centre crosses the gate's plane forwards at least 0.18 m inside all four edges; a gate passed out of order, backwards or too close to an edge does not count (you may turn and fly it again); the flight's time is the moment the centre crosses the last gate, measured from the start of the round"
flight_end = "the flight ends when the drone finishes, touches anything (gate, panel, shutter, floor, wall), leaves the arena (-2 < x < 52, |y| < 5.8, 0.15 < z < 4.8 m) or reaches the round's time limit (race_timing.max_race_s)"
placing = "a finished flight beats an unfinished one; two finished flights by time; unfinished flights by the gates passed, then by the earlier time at the last gate passed; a flight without a gate comes last"
racing_format = "racing: three qualifying rounds on one course, each one flight from the start, a review after rounds 1 and 2; ranked by the best round (finish time), then the second and third best, then the gates passed; success = at least one finished round in a valid, complete event"
duel_format = "duel: heats on one level-2 course; both drones fly each heat at the same time, each in a world of its own (no contact, the other drone is not visible); a heat goes to the better placed drone and ends as soon as its placing is decided; a tied heat counts for nobody; the first to two heat wins wins; both players review after every heat"
action = "fly: a world-frame target velocity (vx, vy, vz) in m/s, a yaw rate in rad/s and a duration in game seconds; horizontal speed <= 4, |vz| <= 2, |yaw_rate| <= 1.5, 0.05 <= duration <= 1; it takes effect at the next 10 ms control step and replaces the one under way; after its duration the target is zero velocity and the heading is held (the drone brakes, it does not hold a position); the onboard controller tilts the drone and sets the rotor thrusts, it does not find gates or avoid obstacles"
drone = "mass 0.35 kg; four rotors at (+-0.105, +-0.105) m, each at most 2.5 N with a 25 ms lag; linear drag 0.06 N per m/s of air speed; gravity 9.81 m/s^2; starts each round at (0, 0, 1.45) hovering and facing +x; physics 500 Hz, control 100 Hz"
camera = "one FPV camera 0.12 m ahead of and 0.035 m above the drone's centre, looking along the body x axis (it tilts with the drone), vertical field of view 70 degrees, 320 x 240; /spec camera gives the mount, /spec cameras its world pose when /spec was read"
observation = "your own telemetry (robot: position, body-to-world quaternion w x y z, world velocity, body angular velocity; command), the referee's calls (gates passed and their times in this unit, your results, standing, last heat with the opponent's result in the duel); no gate, panel or shutter coordinates and no seed"
world = { "+x" = "forward along the course", "+y" = "left", "+z" = "up", units = "SI" }

[tiebreaks]
order = ["heat_wins", "most_heat_wins", "best_results", "last_heat_winner", "lot"]
text = "the first player to win two heats wins (a tied heat counts for nobody and is re-flown); after five heats, more heat wins; then the better best heat result, the better second best, ...; then the winner of the last heat that had one; last resort (not from the rulebook): a lot drawn from the seed before the race"
last_resort_in_prompt = true

[[exploits]]
id = "E1"
text = "the level-3 panels cannot be flown over or under: they reach from the floor to above the ceiling"
test = "test_exploit_fly_over_or_under_panel"
[[exploits]]
id = "E2"
text = "a gate passed backwards, out of order or too close to an edge does not count"
test = "test_exploit_skip_or_reverse_gate_does_not_count"
[[exploits]]
id = "E3"
text = "stalling and leaving gain nothing: hovering runs into the time limit without a result, climbing out or diving ends the flight"
test = "test_exploit_stalling_and_leaving_lose"
[[exploits]]
id = "E4"
text = "a seat that does not review in time loses the duel (ready_timeout)"
test = "test_exploit_review_stalling_forfeits"
[[exploits]]
id = "E5"
text = "an out-of-range or malformed command is refused (HTTP 400) and changes nothing; acting while the world is frozen or after the own flight ended is refused (409)"
test = "test_exploit_bad_and_frozen_actions_are_refused"
[[exploits]]
id = "E6"
text = "the observation and /spec hold no gate, panel or shutter coordinate, no shutter period or phase and no seed"
test = "test_exploit_world_state_hidden"
[[exploits]]
id = "E7"
text = "the seats fly identical, separate worlds: the opponent's actions never reach a seat's world or observation, and the same commands give the same flight on either seat"
test = "test_exploit_separate_identical_worlds"
[[exploits]]
id = "E8"
text = "no draws: a tied heat is re-flown and every tiebreak level decides"
test = "test_exploit_no_draw_tiebreak_chain"

[players]
reference = "reference"               # Sport.players() names: camera-only, wins the default configuration
reference_class = "builtin_players:Reference"
check = ["random"]                    # policies for the generic tests

[fairness]
# The duel is symmetric by construction (identical separate worlds, simultaneous start, no first mover), so the check
# measures the players' asymmetries. Two copies of the deterministic reference would fly identical, tied heats: one
# copy cruises d faster and the other d slower (d from seed and heat), and the faster seat alternates with seed + heat,
# so the players' own luck is balanced between the seats (with independent per-seat draws, 20 seeds gave seat A the
# faster pilot in 7 of 20 heats and a spurious -25 pp). Realtime fairness only warns on a wide interval; a reference
# duel takes minutes of CPU, so N is small.
policy = "reference"
matches_per_order = 20
max_advantage_pp = 5
mirror = "statistical"                # the reference's speed depends on the seat: no exact mirror

[official]
seeds = [1, 2, 3]                     # duel: as the legacy task; racing: every level with seeds 1-3 (the legacy
levels = [1, 2, 3]                    # single used 101/111/121, 202/..., 303/...; the v0.2 default seed is 1)

[golden]
episodes = "golden"                   # converted legacy records + the golden-data store via golden/convert.py

[[tasks]]
id = "drone-racing-wallclock-program-standard"
format = "racing"
action_level = "low"
[[tasks]]
id = "drone-duel-wallclock-program-standard"
format = "duel"
action_level = "low"
slowdown = 20                         # the legacy duel default ([timing] slowdown = 10 is the racing default)

[broadcast]                           # spectators: the replay video's camera (the course has no drone in the scene)
camera = { name = "broadcast", pos = [8.0, -15.0, 10.0], lookat = [18.0, 0.0, 1.5], fovy_deg = 65, width = 640, height = 360 }

[capabilities]                        # docs/capabilities_zh.md: 2 primary, 1 secondary, 0 none
a1 = 2                                # 3D: gate poses, numbers and shutters only from the FPV images
a2 = 2                                # flight dynamics: inertia, rotor lag, drag in a gusting wind
a3 = 2                                # execution: closed-loop flight through narrow openings
a4 = 2                                # real time: the world runs while the program thinks; moving shutters
b1 = 0
b2 = 1                                # duel: the opponent's results between heats (risk vs speed)
b3 = 0
physics = ["inertia_latency", "wind"]
