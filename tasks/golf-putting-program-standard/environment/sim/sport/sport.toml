# Mini-golf putting (docs/framework_zh.md §4.2, §8; migrated from the Season-1 task golf-putting-program-standard, docs
# §10 stage 1). One format, the single round (user decision of 2026-10-08, as review item B10 for archery and
# basketball: the legacy duel golf-putting-duel-program-standard had no interaction between the players, the balls
# never met on identical holes, and is retired; compare players by their single scores on the same seeds). The declarations as data: the core, the generator
# (tools/generate.py), the checks (tools/check) and the prompt/README read this file. The simulator and its rules
# module are sim/ (unchanged from the legacy tree); turnshot.py maps them onto contract ② (sports/bowling/README.md,
# "Pattern for the shared turn-based server").

[sport]
name = "golf"
title = "Mini-golf putting"
summary = "play a round of 4 mini-golf putting holes (par 2, 2, 2, 3; par 9) on sloped greens enclosed by walls, one hole with an obstacle block; each stroke is an aim and a speed chosen from the camera images, and the fewest strokes is best"
protocol = "turn"
revision = "golf-3"                   # golf-1 = the Season-1 service (turn-1); 3: single only (the duel retired)
physics = "a deterministic rolling-ball model on a height field (pure Python, fixed step; MuJoCo draws the scene)"
image = "ghcr.io/mll-lab-nu/eai-olympiad:0.1.0"
status = "sport"
publish = true
category = "robotics-sports-arena"

[rulebook]
name = "WMF Rulebook 2.3, Worldwide international sport rules (World Minigolf Sport Federation); secondary: R&A/USGA Rules of Golf 2023"
version = "2.3"
url = "https://gov.minigolfsport.com/rules/2_3.pdf"

[[deviations]]
id = "D1"
rule = "2.7, 8"
text = "the greens are enclosed by walls: no border line and no out of bounds"
affects_result = false
[[deviations]]
id = "D2"
rule = "11.3"
text = "no time limit per stroke: the player has a chess clock instead (clock out: the round ends there, the unfinished hole and the holes not played score 7 each)"
affects_result = true
[[deviations]]
id = "D5"
rule = "none (the player plays the ball with the putter)"
text = "the ball is struck by a declared putting machine, like the swing robots of Golf Laboratories (robotic hitting machines used for independent club and ball testing; https://www.golflabs.com/robotics-information), not by a player: you set the putt's aim and the ball's initial rolling speed and the machine strikes with a stated execution scatter. Speed 0.05 to 6.0 m/s (the ball's start speed): media reports of these robots give club-head speeds from 0.1 mph (0.045 m/s) for putters to 120 mph (https://robohub.org/robot-golfer-hits-hole-in-one/, 2016), Golf Laboratories' own page today 5 to 130 mph (2.2 to 58 m/s), so the fast end is well within the machine and the slow end has only the media source (weak); the execution scatter is an estimate, not the machine's number. The 6.0 m/s cap is used in full: on the hole with the block some starts need a bank shot of about 5.9 m/s"
affects_result = false

[formats.single]
seats = ["A"]
opponent = false                      # solo: success = a complete round in 9 strokes or fewer (par; the old task's line)
success = { score_at_most = 9 }

[modes]
action_levels = ["low"]               # the putt (aim, speed) is the only level (no robot body)
plays = ["program"]

[timing]
clock_s = 3600                        # the chess clock (the round's turns, reviews included)
start_timeout_s = 1800

[actions.cli]                         # `game putt AIM_DEG SPEED`
low = { putt = ["aim_deg", "speed"] }

[observation]
fields = ["decision", "game_over", "score", "last_shot"]   # the whitelist of Match.observe()
renderer = "mujoco"                   # the sport draws its own views (sim/golf.py Views, MuJoCo + osmesa)
frame_budget_ms = 2000                # per observation, all three views (about 100-300 ms on a CPU)
columns = 1

[spec]                                # the rule constants (shown in /spec and in the prompt's Rules)
round = "4 holes, par 2, 2, 2, 3 (par 9); each hole starts from its own fixed spot and the ball is played from where it stopped"
scoring = "the score is the total number of strokes, fewer is better (WMF 9.1); a hole not holed after 6 strokes is picked up and scores 7"
success_single = "success = the round complete in 9 strokes or fewer (par); fewer strokes is better"
putt = "{'type':'putt','aim_deg':A,'speed':V}: aim_deg = where the putter face points, i.e. the ball's start direction, in the green's frame: 0 = +x (down the green, away from the end the ball starts at), + = counter-clockwise seen from above (90 = +y), -180 to 180, not relative to the cup; walls can be used for bank shots; speed = the ball's initial rolling speed, m/s, 0.05 to 6.0"
execution_scatter_1sigma = { aim_deg = 0.3, speed_rel = 0.015 }
green = "each green has its own frame: x in [0, L] along the green, y in [-W/2, W/2] across it, z up (sizes in match.holes); the surface is smooth but not flat: tilts, bumps, hollows and ridges of up to a few centimetres to a decimetre; the slopes are not given and change with the seed"
ball_physics = "the ball (radius 21.35 mm) rolls without slipping: slopes accelerate it downhill ((5/7) g sin(slope), g = 9.81 m/s^2); rolling resistance slows it at a constant rate (stimpmeter 10 ft: on a flat green a ball starting at 1.83 m/s stops after 3.05 m); it comes to rest when it is slow and the slope cannot move it"
walls = "walls and blocks: the ball rebounds, keeping about 70 % of its speed into the wall and about 92 % along it"
cup = "the cup (radius 54 mm): a ball whose centre passes over the cup drops if it is slow enough (straight at the centre up to about 1.7 m/s, less when it only catches the edge); faster, it lips out or rolls over the edge"
image_layout = "one PNG of 2000 x 1000 (the rectangles are image.tiles in /spec and observation.tiles): behind (800 x 500, top left): 2.0 m behind the ball along -x, 1.1 m above the green there, looking along +x, pitched 14 deg down; side (800 x 500, bottom left): fixed per hole beyond the green's left wall at mid-green (match.holes[].side_camera_pos_m), looking along -y, pitched 12 deg down, image right = +x; overhead (1200 x 600, right): straight down over the whole green from (L/2, 0, match.holes[].overhead_camera_height_m), image right = +x, image up = +y, with the path of your previous stroke on this hole as yellow dots (one every 0.1 s). White grid lines every 0.5 m follow the surface; mowing stripes are 1 m wide; the cup is a black disc with a white rim and a yellow flagstick with a red flag; obstacle blocks are red. No ball or cup coordinates and no slope numbers are given"
hearing = "after each stroke you are told its result (holed, stopped, lipped out, rolled over the edge of the cup), the wall or block hits and the roll time; your scorecard is in every observation"


[[exploits]]
id = "E1"
text = "an out-of-range or malformed putt (unknown field, NaN, a string, a missing field) is refused (HTTP 400) and changes nothing"
test = "test_exploit_bad_actions_are_refused"
[[exploits]]
id = "E2"
text = "putting before the start or before the review of the previous stroke is refused (HTTP 409)"
test = "test_exploit_out_of_turn"
[[exploits]]
id = "E3"
text = "stalling gains nothing: a round that ends early (abandoned or on the clock; on the clock the unfinished holes score 7) is a valid failure"
test = "test_exploit_stalling_loses"
[[exploits]]
id = "E4"
text = "no world state reaches the player: no ball or cup coordinates, no slopes, no executed (scattered) stroke, no path and no seed in the observation or /spec"
test = "test_exploit_no_world_state"
[[exploits]]
id = "E5"
text = "a hole cannot be dragged out: after 6 strokes without holing the ball is picked up and the hole scores 7"
test = "test_exploit_pick_up_after_six"
[[exploits]]
id = "E8"
text = "the ball cannot leave the green: the walls and blocks keep even the hardest putt in any direction inside the playing area"
test = "test_exploit_ball_stays_on_green"

[players]
reference = "reference"               # Sport.players(): camera-only, at most par (9) on the default seed
reference_class = "builtin_players:Reference"
check = ["random"]

[official]                            # the Season-1 official seeds (20260928 = the original course); the default is 1
seeds = [20260928, 13, 14]

[golden]
episodes = "golden"                   # golden/<case>/ + golden/convert.py (the Season-1 records, RO_GOLDEN_DATA)

[[tasks]]
id = "golf-putting-program-standard"  # the Season-1 task name ([[tasks]] id)
format = "single"
action_level = "low"

[capabilities]                        # docs/capabilities_zh.md: 2 primary, 1 secondary, 0 none
a1 = 2                                # the ball, the cup, the walls and the slopes only from the camera images (grid lines, paths)
a2 = 2                                # rolling on an unknown sloped green: break, pace, the cup's capture speed, wall rebounds
a3 = 2                                # aim and speed under execution scatter (0.3 deg, 1.5 %)
a4 = 0                                # turn-based: no time pressure
b1 = 1                                # pick-up rule, bank shots off the walls
b2 = 1                                # lag or attack
b3 = 0
physics = ["friction_rolling", "collision"]
