schema_version = "1.3"
artifacts = [
  "/app/output/",
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/replay_check.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/video.json", service = "sim" },
  { source = "/data/broadcast.jsonl", service = "sim" },
  { source = "/data/think_usage_A.json", service = "sim" },
  { source = "/data/think_calls_A.jsonl", service = "sim" },
]

[task]
name = "robot-coding-bench/basketball-shootout-program-standard"
description = "Robot basketball shootout, PROGRAM PLAY, single, action level low (eai-standard-turn/1.0): a declared shooting machine (a launcher like Toyota's CUE robots) on a 1 m pedestal shoots from five spots, mid-range to beyond the three-point line, past a static defender, finding the hoop in the camera images; every make counts 1. Generated from sports/basketball/sport.toml by tools/generate.py on the v0.2 core."
authors = [{ name = "RoboOlympics" }]
keywords = ["program-play", "basketball", "sports", "turn", "vision", "roboolympics-v0.2"]

[metadata]
revision = "basketball-5+core-0.2"
author_name = "RoboOlympics"
category = "robotics-sports-arena"
task_type = "trajectory"
simulator = "MuJoCo 3.3.7 (ball with quadratic drag and Magnus force; rim, backboard, floor and defender contacts)"
robot = "none"
family = "basketball_single"
mode = "standard"
protocol = "eai-standard-turn/1.0"
play = "program"
action_level = "low"
oracle = "full"
oracle_evidence = "solution/: the sport's reference player (camera images and /spec only); tools/check runs it live and it wins the default configuration"
parameters = "RCB_SEED, RO_RENDERER (the players' image renderer)"
expert_time_estimate_hours = 0.5

[[seats]]
name = "A"
service = "player"
agent_kwargs = { think_proxy_url = "http://sim:18090/v1" }
setup_networks = ["egress"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "for i in $(seq 1 90); do [ -f /data/server.pid ] && break; sleep 2; done; kill -USR1 $(cat /data/server.pid); for i in $(seq 1 600); do grep -q '\"graded_ready\": true' /data/final.json 2>/dev/null && break; sleep 1; done; [ x$RCB_RENDER_VIDEO = x1 ] && for i in $(seq 1 300); do [ -f /data/video.json ] && break; sleep 1; done; cat /data/final.json | head -c 2000"
timeout_sec = 1080

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 1024
