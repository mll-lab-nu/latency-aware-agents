[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "latency-sensitive-bench"
version = "0.2.0"
description = "Benchmarking latency-sensitive vision-language-action policies"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==1.26.4",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
runtime = [
    "gymnasium==0.29.1",
    "huggingface-hub>=0.34.0,<1.0",
    "opencv-python-headless==4.10.0.84",
    "optree==0.19.1",
    "pillow==12.1.1",
    "pygame==2.6.1",
    "scipy==1.15.3",
    "tqdm==4.67.3",
    "wandb==0.26.1",
]
data = [
    "av==15.1.0",
    "datasets==4.8.5",
    "jsonlines==4.0.0",
    "pandas==2.3.3",
    "pyarrow==24.0.0",
]
training = [
    "ninja==1.13.0",
    "packaging>=24.2",
    "stable-baselines3==2.8.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
]
starvla = [
    "accelerate==1.5.2",
    "draccus>=0.10.0,<0.12",
    "einops>=0.8.0,<0.9",
    "safetensors>=0.4.3",
]
analysis = ["matplotlib==3.10.9"]
dev = ["pytest==9.0.3"]
mujoco = ["mujoco==3.3.0"]
atari = [
    "gymnasium[atari]==0.29.1",
    "ale-py==0.8.1",
    "autorom==0.6.1",
]
vizdoom = ["vizdoom==1.3.0"]
box2d = ["gymnasium[box2d]==0.29.1"]
sonic = [
    "dm-control==1.0.28",
    "mujoco==3.3.0",
]

[tool.setuptools.packages.find]
include = ["latency_bench*", "training*"]

[tool.setuptools.package-data]
"latency_bench.configs.base" = ["*.yaml"]
"latency_bench.envs.tasks" = ["assets/*.xml"]
"training.flappy_sf" = ["cuda_kernels/*.cpp", "cuda_kernels/*.cu"]
