env:
  name: gymnasium
  task_name: inverted_pendulum_discrete
  env_id: LatencyBench/InvertedPendulumDiscrete-v0
  registration_imports:
  - latency_bench.envs.gymnasium_mujoco
  make_kwargs:
    base_env_id: InvertedPendulum-v4
    render_mode: rgb_array
    force_values:
    - -3.0
    - -1.5
    - 0.0
    - 1.5
    - 3.0
    base_make_kwargs: {}
  env_fps: 25.0
  obs_fps: 25.0
  frame_stack: 1
  noop_action: zero_force
  action_map:
    push_left_hard: 0
    push_left_soft: 1
    zero_force: 2
    push_right_soft: 3
    push_right_hard: 4
  action_order:
  - push_left_hard
  - push_left_soft
  - zero_force
  - push_right_soft
  - push_right_hard
  base_prompt: 'Keep the pole upright by applying horizontal cart forces. Choose exactly
    one action from: push_left_hard, push_left_soft, zero_force, push_right_soft,
    push_right_hard.'
