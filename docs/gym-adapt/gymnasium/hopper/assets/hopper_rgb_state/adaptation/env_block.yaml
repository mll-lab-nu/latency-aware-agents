env:
  name: gymnasium
  task_name: hopper_rgb_state
  env_id: LatencyBench/HopperRgbState-v0
  registration_imports:
  - latency_bench.envs.gymnasium_hopper_rgb_state
  make_kwargs:
    base_env_id: Hopper-v4
    render_mode: rgb_array
    base_make_kwargs:
      forward_reward_weight: 1.0
      ctrl_cost_weight: 0.001
      healthy_reward: 1.0
      terminate_when_unhealthy: true
      reset_noise_scale: 0.005
      exclude_current_positions_from_observation: true
  env_fps: 125.0
  obs_fps: 125.0
  frame_stack: 1
  action_space:
    type: box
    labels:
    - thigh_torque
    - leg_torque
    - foot_torque
    low:
    - -1.0
    - -1.0
    - -1.0
    high:
    - 1.0
    - 1.0
    - 1.0
    dtype: float32
  noop_action:
  - 0.0
  - 0.0
  - 0.0
  base_prompt: Move the Hopper robot forward while keeping its torso upright. Predict
    three continuous torques in [-1, 1] ordered as thigh, leg, and foot.
