framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /mnt/checkpoints/latency-sensitive-bench/openvla/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
  action_model:
    action_model_type: MLP
    action_dim: 3
    action_hidden_dim: 2560
    future_action_window_size: 0
    past_action_window_size: 0
    loss_type: l1
    state_encoding: continuous_projector
    state_dim: 11
    action_horizon: 1
    action_env_dim: 3
  kv_memory:
    enabled: false
    window: 4
    rollout_len: 8
    packed_train: false
    rebased_sink: true
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /mnt/data/latency-sensitive-bench/vla_datasets/rl_games
    data_mix: hopper_rgb_state_l0_return_gt3000_100ep
    eval_data_mix: hopper_rgb_state_l0_return_gt3000_100ep__val
    custom_mixtures_path: /mnt/data/latency-sensitive-bench/vla_datasets/rl_games/_generated_mixtures/hopper_rgb_state_l0_return_gt3000_100ep.json
    action_type: discrete
    sequential_step_sampling: false
    eval_sequential_step_sampling: null
    num_workers: 8
    eval_num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true
    shuffle: true
    action_balance:
      enabled: false
      strategy: balanced_epoch
      action_key: action_id
      target_flap_fraction: 0.3
      noop_id: 0
      flap_id: 1
    latency_curriculum:
      enabled: false
      strategy: exclusive
      latencies: null
      phase_steps: null
      phase_distributions: null
      new_latency_passes: 1.0
      replay_passes: 0.25
      target_total_passes: 2.0
      final_equalization: true
      step_budget_mode: auto
      eval_at_phase_end: false
      save_at_phase_end: false
      computed_plan: null
    per_device_batch_size: 16
    load_all_data_for_training: true
    num_obs_frames: 1
    image_mode: single
    prompt_mode: raw
    stitch_grid:
    - 2
    - 2
    obs_image_size: null
    video_backend: torchvision_av
    gymnasium_task_contract:
      action_space:
        dtype: float32
        high:
        - 1.0
        - 1.0
        - 1.0
        labels:
        - thigh_torque
        - leg_torque
        - foot_torque
        low:
        - -1.0
        - -1.0
        - -1.0
        type: box
      base_prompt: Move the Hopper robot forward while keeping its torso upright.
        Predict three continuous torques in [-1, 1] ordered as thigh, leg, and foot.
      env_fps: 125.0
      env_id: LatencyBench/HopperRgbState-v0
      frame_stack: 1
      make_kwargs:
        base_env_id: Hopper-v4
        base_make_kwargs:
          ctrl_cost_weight: 0.001
          exclude_current_positions_from_observation: true
          forward_reward_weight: 1.0
          healthy_reward: 1.0
          reset_noise_scale: 0.005
          terminate_when_unhealthy: true
        render_mode: rgb_array
      noop_action:
      - 0.0
      - 0.0
      - 0.0
      obs_fps: 125.0
      registration_imports:
      - latency_bench.envs.gymnasium_hopper_rgb_state
      state_space:
        labels:
        - torso_height
        - torso_angle
        - thigh_angle
        - leg_angle
        - foot_angle
        - torso_x_velocity
        - torso_z_velocity
        - torso_angular_velocity
        - thigh_angular_velocity
        - leg_angular_velocity
        - foot_angular_velocity
      task_name: hopper_rgb_state
    active_action_dim: 3
