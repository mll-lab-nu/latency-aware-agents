checkpoint:
  local:
    keep_last_n: 1
  save_best_model: false
  save_final_model: true
  save_pt_file: true
  save_safetensors_file: false
  save_training_state: false
  sync:
    enabled: false
    keep_last_n: 0
    repo_id: null
datasets:
  vla_data:
    data_mix: ant_rgb_state_l0_return_gt3000_100ep
    dataset_py: lerobot_datasets
    eval_data_mix: ant_rgb_state_l0_return_gt3000_100ep__val
    latency_curriculum:
      enabled: false
    per_device_batch_size: 16
framework:
  action_model:
    action_dim: 8
    action_env_dim: 8
    action_hidden_dim: 2560
    action_horizon: 1
    action_model_type: MLP
    loss_type: l1
  kv_memory:
    enabled: false
    packed_train: false
    rebased_sink: true
    rollout_len: 8
    window: 4
  name: QwenOFT
  qwenvl:
    attn_implementation: flash_attention_2
    base_vlm: /mnt/checkpoints/latency-sensitive-bench/openvla/Qwen3-VL-4B-Instruct
    enable_gradient_checkpointing: true
output_dir: /mnt/checkpoints/latency-sensitive-bench/openvla_runs/ant_rgb_state_l0_return_gt3000_100ep_openvla_native_sft_5k
rl_games:
  env_eval:
    enabled: false
  task: gymnasium
run_id: ant_rgb_state_l0_return_gt3000_100ep_openvla_native_sft_5k
run_root_dir: /mnt/checkpoints/latency-sensitive-bench/openvla_runs
seed: 42
trainer:
  distributed_backend: deepspeed
  eval_action_classification: false
  eval_action_classification_interval: null
  eval_interval: 500
  eval_num_batches: 200
  freeze_llm_layers: []
  freeze_modules: ''
  freeze_tied_embedding: false
  freeze_vit: false
  gradient_accumulation_steps: 1
  is_resume: false
  learning_rate:
    action_model: 0.0001
    base: 2.0e-05
    qwen_vl_interface: 1.0e-05
  logging_frequency: 1
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 5000
  num_warmup_steps: 100
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    fused: true
    weight_decay: 1.0e-08
  per_latency_eval_num_batches: null
  pretrained_checkpoint: null
  profile_timing:
    enabled: true
    log_interval: 10
  save_interval: 500
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
wandb_entity: dongqianyu99-zhejiang-university
wandb_project: latency-sensitive-bench
