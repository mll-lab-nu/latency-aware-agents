env:
  name: gymnasium
  task_name: lunar_lander_discrete
  env_id: LunarLander-v2
  registration_imports: []
  make_kwargs:
    render_mode: rgb_array
    continuous: false
    gravity: -10.0
    enable_wind: false
    wind_power: 15.0
    turbulence_power: 1.5
  env_fps: 50
  obs_fps: 50
  frame_stack: 1
  noop_action: do_nothing
  action_map:
    do_nothing: 0
    fire_left_orientation_engine: 1
    fire_main_engine: 2
    fire_right_orientation_engine: 3
  action_order:
  - do_nothing
  - fire_left_orientation_engine
  - fire_main_engine
  - fire_right_orientation_engine
  base_prompt: 'Land the spacecraft safely between the flags. Choose exactly one action
    from: do_nothing, fire_left_orientation_engine, fire_main_engine, fire_right_orientation_engine.'
