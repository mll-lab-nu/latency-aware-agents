env:
  name: gymnasium
  task_name: pendulum_discrete
  env_id: LatencyBench/PendulumDiscrete-v0
  registration_imports:
  - latency_bench.envs.gymnasium_pendulum
  make_kwargs:
    base_env_id: Pendulum-v1
    render_mode: rgb_array
    torque_values:
    - -2.0
    - -1.0
    - 0.0
    - 1.0
    - 2.0
    base_make_kwargs:
      g: 10.0
  env_fps: 20.0
  obs_fps: 20.0
  frame_stack: 1
  noop_action: zero_torque
  action_map:
    torque_clockwise_hard: 0
    torque_clockwise_soft: 1
    zero_torque: 2
    torque_counterclockwise_soft: 3
    torque_counterclockwise_hard: 4
  action_order:
  - torque_clockwise_hard
  - torque_clockwise_soft
  - zero_torque
  - torque_counterclockwise_soft
  - torque_counterclockwise_hard
  base_prompt: 'Swing the pendulum upright and keep it balanced by applying torque.
    Choose exactly one action from: torque_clockwise_hard, torque_clockwise_soft,
    zero_torque, torque_counterclockwise_soft, torque_counterclockwise_hard.'
