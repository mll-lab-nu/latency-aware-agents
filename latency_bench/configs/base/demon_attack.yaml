experiment:
  name: demon_attack_base
  seed: 0

backend:
  algo: APPO
  device: cpu
  train_dir: results/sample_factory
  restart_behavior: resume
  run_mode: train

executor:
  mode: simulated
  simulated_worker_capacity: null

  parallel_envs: 100
env:
  name: demon_attack
  env_id: ALE/DemonAttack-v5
  # env_fps is raw-frame frequency; observations happen at the wrapped env cadence.
  env_fps: 60
  obs_fps: 15
  screen_size: 84
  noop_max: 30
  reset_mode: fire
  frame_stack: 4
  terminal_on_life_loss: true
  clip_reward: true
  repeat_action_probability: 0.0
  full_action_space: false
  max_episode_steps: 25000
  noop_action: 0
  action_map:
    noop: 0
    fire: 1
    right: 2
    left: 3
    rightfire: 4
    leftfire: 5
  action_order: [0, 1, 2, 3, 4, 5]
  simulator: gpu
  gpu_env_device: auto


latency:
  method: zero
  add_latency_info: false

scheduler:
  hold_policy: hold
  ordering_policy: latest_ready

policy:
  type: random
  actions: [0, 1, 2, 3, 4, 5]

  deterministic: true

training:
  train_for_env_steps: 25000000
  num_workers: 1
  num_envs_per_worker: 512
  worker_num_splits: 1
  num_policies: 1
  batch_size: 1024
  batched_sampling: true
  rollout: 64
  recurrence: 32
  num_epochs: 2
  num_batches_per_epoch: 8
  max_policy_lag: 300
  learning_rate: 0.000303
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.0
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5

evaluation:
  eval_interval_steps: 1000000
  eval_raw_reward: true
  episodes: 20
  max_env_steps: 14400
  suites:
  - name: fixed_0
    latency:
      method: zero
  - name: fixed_2
    latency:
      method: fixed
      fixed_latency_ms: 33.333333333333336
  - name: fixed_4
    latency:
      method: fixed
      fixed_latency_ms: 66.66666666666667
  - name: fixed_6
    latency:
      method: fixed
      fixed_latency_ms: 100.0
  - name: normal_mean_4_std_1_min_0_max_15
    latency:
      method: normal
      mean_latency_ms: 66.66666666666667
      std_latency_ms: 16.666666666666668
      min_latency_ms: 0.0
      max_latency_ms: 250.00000000000003
      seed: 0
  - name: uniform_min_2_max_6
    latency:
      method: uniform
      min_latency_ms: 33.333333333333336
      max_latency_ms: 100.0
      seed: 0
logging:
  output_dir: outputs/demon_attack_base
  video:
    enabled: true
    num_bins: 10
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  wandb_project: null
  wandb_group: demon_attack-new(remove training episode limit)
  wandb_job_type: sample_factory
  wandb_tags: ""
