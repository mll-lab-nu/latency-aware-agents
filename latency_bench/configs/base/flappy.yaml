experiment:
  name: flappy_base
  seed: 0

backend:
  algo: APPO
  device: cuda
  train_dir: results/checkpoints
  restart_behavior: resume
  run_mode: train

executor:
  mode: simulated
  simulated_worker_capacity: null

  parallel_envs: 100
env:
  name: flappy
  # note that env_fps must be an integer multiple of obs_fps!
  env_fps: 30
  obs_fps: 30
  gym_id: FlappyBird-v0
  render_mode: rgb_array
  observation_mode: image
  use_lidar: false
  normalize_obs: true
  audio_on: false
  frame_stack: 4
  obs_resize:
    - 84
    - 84
  # for training it could be true, but for realtime mode, THIS MUST BE FALSE!
  use_gpu_render: true
  simulator: gpu
  gpu_render_device: auto
  gpu_render_profile: false
  gpu_render_profile_interval: 200
  noop_action: noop
  action_map:
    noop: 0
    flap: 1
  oneshot_actions:
    - flap

latency:
  method: normal
  mean_latency_ms: 66.7
  std_latency_ms: 33.3
  min_latency_ms: 0
  max_latency_ms: 500.0


scheduler:
  # [one_frame_then_noop, hold]
  # hold retains the latest action until another arrives.
  hold_policy: one_frame_then_noop
  # can be either `issue_order_fifo` or `latest ready`
  ordering_policy: latest_ready

policy:
  type: random
  actions:
    - noop
    - flap

  deterministic: true
training:
  train_for_env_steps: 25000000
  num_workers: 2
  num_envs_per_worker: 128
  worker_num_splits: 1
  num_policies: 1
  batch_size: 4096
  rollout: 128
  recurrence: 1
  num_epochs: 8
  num_batches_per_epoch: 8
  max_policy_lag: 400
  learning_rate: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_ratio: 0.1
  ppo_clip_value: 0.2
  value_loss_coeff: 0.5
  max_grad_norm: 0.5
  async_rl: true
  use_rnn: false
  normalize_input: true
  normalize_returns: true
  stats_avg: 100
  experiment_summaries_interval: 1
  save_every_sec: 600
  keep_checkpoints: 5

evaluation:
  eval_interval_steps: 1000000
  eval_raw_reward: false
  episodes: 15
  max_env_steps: 3600
  suites:
  - name: fixed_0
    latency:
      method: zero
  - name: fixed_1
    latency:
      method: fixed
      fixed_latency_ms: 33.333333333333336
  - name: fixed_2
    latency:
      method: fixed
      fixed_latency_ms: 66.66666666666667
  - name: fixed_3
    latency:
      method: fixed
      fixed_latency_ms: 100.0
  - name: normal_mean_2_std_1_min_0_max_15
    latency:
      method: normal
      mean_latency_ms: 66.66666666666667
      std_latency_ms: 33.333333333333336
      min_latency_ms: 0.0
      max_latency_ms: 500.00000000000006
      seed: 0
  - name: uniform_min_1_max_3
    latency:
      method: uniform
      min_latency_ms: 33.333333333333336
      max_latency_ms: 100.0
      seed: 0
logging:
  output_dir: outputs/flappy_base
  video:
    enabled: true
    num_bins: 10
  save_step_records: true
  save_action_records: true
  save_latency_records: true
  wandb_project: null
  wandb_group: flappy-new(remove training episode limit)
  wandb_job_type: sample_factory
  wandb_tags: ""
